# Coach OS — Netlify config
# برای استقرار: کل این پوشه را در https://app.netlify.com/drop رها کنید
# یا به مخزن گیت وصل کنید. (publish یعنی خود ریشه‌ی پروژه مستقیماً میزبانی می‌شود)

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/lib/**"]
  node_bundler = "esbuild"

# مسیر تمیز برای API همگام‌سازی (با config.path داخل data.mjs هم‌خوان است؛
# این ریدایرکت برای سازگاری با دیپلوی‌های قدیمی‌تر هم نگه داشته شده)
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/api/billing/*"
  to = "/.netlify/functions/billing/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/data"
  status = 200
  force = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = false

# index.html و sw.js نباید کش بلندمدت شوند تا کاربران همیشه آخرین نسخه را بگیرند
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# هدرهای امنیتی برای همه‌ی مسیرها (API هم از داخل هندلرها همین‌ها را ست می‌کند)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
