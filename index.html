/* v18.79 — mockup does not dim a locked tick */
.hab .tick:disabled{cursor:default;opacity:1}
.hab .tick svg{opacity:0;transform:scale(.5);transition:.15s;stroke-width:4}
.hab.done .tick{background:var(--accent);border-color:var(--accent)}
.hab.done .tick svg{opacity:1;transform:scale(1)}
.hab .txt{flex:1;min-width:0}
.hab .txt b{display:block;font-size:13.5px;font-weight:800;color:var(--ink)}
.hab .txt span{font-size:11px;color:var(--ink3)}
.hab.done .txt b{color:var(--ink3);text-decoration:line-through}
.hab .hv{font-size:11px;font-weight:900;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 8px;flex:none}
.hab .hv.off{background:var(--surface3);color:var(--ink3)}
.hab-chev{color:var(--ink3);transition:transform .3s ease;width:17px;height:17px}
.hab-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s cubic-bezier(.4,0,.2,1),opacity .25s;border-top:1px dashed var(--line2);overflow:hidden}
.hab-body.closed{grid-template-rows:0fr;border-top-width:0;opacity:0}
.habwrap{min-height:0;overflow:hidden;padding:12px 14px 14px;transition:padding .3s}
.hab-body.closed .habwrap{padding-top:0;padding-bottom:0}
.filters{display:flex;gap:7px;margin:0 14px 12px}
/* v18.85 — Training (mockup 02) parity. Three leaks, one omission:
   1. `.wkd` base never shipped here (only `.tr-week .wkd` did) → the strip
      inherited 16px / 400 / start from the phone instead of 9.5px / 800 / center.
   2. the app's base `.fchip` is the QUICK-CHIP pill (radius 999, padding 6px 13px,
      12.5/600); the mockup's TRAINING filters are full-width segments
      (radius 10, padding 8px 0, 12px/900, flex:1).
   3. the coach-side FitFlow `.wcard` (flex-direction:column, min-height:190px,
      color:#fff) leaks into the phone list — that is why cards were 220px vs 128px. */
.wkd{flex:1;text-align:center;border-radius:10px;padding:7px 0;background:var(--surface3);font-size:9.5px;color:var(--ink3);font-weight:800}
.wkd b{display:block;font-size:12.5px;color:var(--ink2);font-family:'JetBrains Mono',monospace}
.wkd.done{color:var(--accent)}
.phone .filters .fchip{flex:1;text-align:center;font-size:12px;font-weight:800;padding:8px 0;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink3)}
/* mockup `.fchip.on` is weight 900 (the mockup's own line 197) */
.phone .filters .fchip.on,.phone .filters .fchip:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:900}
.phone .wcard{flex-direction:row;min-height:0;color:var(--ink)}
/* mockup `.tr-today-cta .btn` carries no padding (the .btn-out re-adds its own) */
.tr-today-cta .btn{padding:0}
.tr-wfoot .lbl{margin:0}
/* v18.85 — the mockup's exercise tags sit on ONE row (27px); the demo's longer
   names wrapped `.tr-exrow` to 60px. Keep one line: tighter chip padding and no
   wrap — ellipsis + overflow guard the case where names are longer still. */
.phone .tr-exrow{flex-wrap:nowrap;overflow:hidden}
.phone .tr-exrow span{padding:4px 6px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.plhead{padding:44px 14px 10px;display:flex;align-items:center;gap:10px}
.plhead .back{width:32px;height:32px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;flex:none}
.plhead .t{flex:1;min-width:0}
.plhead .t b{font-size:15px;font-weight:900;display:block}
.plhead .t span{font-size:11px;color:var(--ink3)}
.plring{width:44px;height:44px;flex:none;position:relative}
.plring span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;line-height:1;gap:1px}
.plring span b{font-size:13px;font-weight:900;letter-spacing:-.03em}
.plring span i{font-style:normal;font-size:7.5px;font-weight:700;color:var(--ink3)}
.exh{margin:0 14px 8px;display:flex;justify-content:space-between;align-items:baseline}
.exh b{font-size:17px;font-weight:900}
.exh .tgt{font-size:11.5px;font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:700}
.exnote{margin:0 14px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;font-size:12.5px;color:var(--ink2);line-height:1.9}
.cue-h{display:flex;align-items:flex-start;gap:9px;padding-bottom:9px;border-bottom:1px dashed var(--line2);margin-bottom:9px}
.cue-av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#3D4A22,#20260F);border:1.5px solid var(--accent);display:grid;place-items:center;font-size:9.5px;font-weight:900;color:var(--accent);flex:none;margin-top:-3px}
.cue-h .t{flex:1;min-width:0}
.cue-h .t b{display:block;font-size:11.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.cue-h .t span{font-size:10px;color:var(--ink3)}
.cue-badge{font-size:9px;font-weight:900;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2.5px 7px;flex:none;font-family:'JetBrains Mono',monospace}
.cue-txt{color:var(--ink);font-weight:600;font-size:13px;line-height:1.85}
.cue-prev{display:flex;align-items:baseline;gap:10px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line2)}
.cue-prev .k{font-size:9px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);flex:none;padding-top:2px}
.cue-prev .v{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:var(--ink2);flex:1}
.cue-prev .d{font-size:11px;font-weight:900;font-family:'JetBrains Mono',monospace;color:var(--green);background:rgba(43,191,113,.12);border-radius:7px;padding:3px 8px;flex:none;align-self:center}
.settbl{margin:0 14px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sth{display:grid;grid-template-columns:36px 1fr 1fr 40px;background:var(--surface2);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:900;padding:8px 12px}
.sth span:last-child{text-align:right;padding-right:4px}
.sth span:not(:last-child){text-align:center}
.str{display:grid;grid-template-columns:36px 1fr 1fr 40px;align-items:center;padding:9px 12px;border-top:1px solid var(--line2);cursor:pointer}
.str b{font-size:13.5px;font-family:'JetBrains Mono',monospace;text-align:center}
.str .setn{font-size:11.5px;font-family:'JetBrains Mono',monospace;color:var(--ink3);font-weight:700;text-align:center}
.str .go{width:24px;height:24px;border-radius:7px;border:2px solid #333941;display:grid;place-items:center;justify-self:end}
.str.done .go{background:var(--accent);border-color:var(--accent)}
.str.done b{color:var(--ink3)}
.str .go svg{opacity:0}
.str.done .go svg{opacity:1}
/* v18.86 — class-collision fix. This was a bare `.rest`, and the week strip's
   REST days render as `<span class="wkd rest">`, so they inherited
   `margin:0 14px 12px` (+ padding/border/background) from the Player's rest-timer
   card. With gap:4px that pushed days 6-7 past the card edge (cells ended at 371px
   inside a 310px card) — the "one circle out of place". Scoping to `.cplayer`
   makes the collision impossible; the card only ever renders inside `.cplayer`. */
.cplayer .rest{margin:0 14px 12px;background:var(--surface);border:1px solid rgba(200,240,75,.3);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;transition:border-color .25s}
.rest-main{display:flex;align-items:center;gap:12px;width:100%}
.rest .cd{font-size:22px;font-weight:900;font-family:'JetBrains Mono',monospace;color:var(--accent);letter-spacing:-.03em;transition:color .2s}
.rest .rlbl{font-size:9px;letter-spacing:.15em;font-weight:900;color:var(--accent);display:block;margin-top:2px}
.rest .info{flex:1}
.rest .info b{font-size:12px;display:block}
.rest .info span{font-size:10.5px;color:var(--ink3)}
.rpause{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink2);display:grid;place-items:center;cursor:pointer;flex:none;transition:.15s}
.rpause:hover{border-color:rgba(200,240,75,.5);color:var(--accent)}
.rest-bar{width:100%;height:6px;border-radius:99px;background:#22262D;overflow:hidden}
.rest-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .9s linear,background .25s}
.rest-ctrls{display:flex;gap:6px;width:100%}
.rbtn{flex:1;padding:6px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink2);font-family:inherit;font-size:11.5px;font-weight:800;cursor:pointer;transition:.15s}
.rbtn:hover{border-color:rgba(200,240,75,.45);color:var(--ink)}
.rbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rbtn.primary:hover{color:var(--accent-ink)}
.rest[data-state="pause"] .cd,.rest[data-state="pause"] .rlbl{color:var(--amber)}
.rest[data-state="pause"]:hover{border-color:rgba(229,169,60,.5)}
.rest[data-state="done"]{border-color:rgba(43,191,113,.55)}
.rest[data-state="done"] .cd,.rest[data-state="done"] .rlbl{color:var(--green)}
.rest[data-state="done"] .rest-bar i{background:var(--green)}
/* v18.90 — SMART REST TIMER (Strong / Hevy inspired).
   • a ms-accurate RING replaces the horizontal bar as the primary visual — its
     colour follows the card state through `currentColor`, so run/pause/done
     recolour it for free;
   • preset durations (30/60/90/120) for jumping straight to a length;
   • per-alert toggles so the ticking can be silenced without leaving the set. */
/* v18.91 — SIZE BUDGET: `.cpbody`'s usable band is (viewport - head - foot).
   On a 439px-tall window that is only ~225px, and the card was 257px — so the
   LAST row (the mode toggles) always sat under the foot no matter where the
   card scrolled. Everything here is trimmed to land the card near ~210px:
   ring 66->54, flex gap 12->8, card padding 11/16->9/13, control paddings -2. */
.cplayer .rest{gap:8px;padding:9px 13px}
.rest-ring{position:relative;width:54px;height:54px;flex:none;display:grid;place-items:center;color:var(--accent);transition:color .2s}
.rest-ring svg{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible}
.rest-ring .trk{fill:none;stroke:#22262D;stroke-width:6}
.rest-ring .prg{fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round}
.rest-ring .val{position:relative;z-index:1;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:900;letter-spacing:-.05em;color:var(--ink)}
.rest[data-state="pause"] .rest-ring{color:var(--amber)}
.rest[data-state="done"] .rest-ring{color:var(--green)}
.rest .info{flex:1;min-width:0}
.rest-presets{display:flex;gap:6px;width:100%;margin-top:8px;align-items:center}
.rest-presets .rbtn{padding:5px 0;font-size:11.5px;flex:1}
.rest-presets .rbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* v18.91 — the three MODE toggles now sit together and are LABELLED (icon-only
   was cryptic): sound, vibration and AUTO-ADVANCE to the next set. */
.rest-toggles{display:flex;gap:6px;width:100%;margin-top:8px}
.rtog{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 0;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--ink3);font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;transition:.15s;white-space:nowrap;overflow:hidden}
.rtog.on{background:var(--accent-soft);border-color:rgba(200,240,75,.4);color:var(--accent)}
.rtog svg{flex:none}
/* the row auto-advance lands on, so the next tap is obvious */
.cplayer .str.nextup{background:rgba(200,240,75,.14);box-shadow:inset 0 0 0 2px rgba(200,240,75,.6);border-radius:8px}
.rfs{position:absolute;inset:0;z-index:40;background:radial-gradient(120% 100% at 50% 0%,#1B2313,#0A0C0E 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:34px 26px;direction:ltr;border-radius:44px}
.rfs[hidden]{display:none}
.rfs-eb{font-size:11px;letter-spacing:.34em;font-weight:900;color:var(--accent)}
.rfs-num{font-size:74px;line-height:1;font-weight:900;font-family:'JetBrains Mono',monospace;letter-spacing:-.05em;color:#fff;text-shadow:0 0 44px rgba(200,240,75,.25)}
.rfs-next{font-size:13.5px;color:var(--ink3);text-align:center;line-height:1.9}
.rfs-next b{color:var(--ink2)}
.rfs-bar{width:100%;max-width:250px;height:9px;border-radius:99px;background:#22262D;overflow:hidden;margin-top:6px}
.rfs-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s linear,background .25s}
.rfs-ctrls{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;justify-content:center}
.rfs-ctrls .rbtn{min-width:76px;padding:11px 14px;font-size:12.5px}
.rfs-close{position:absolute;top:52px;inset-inline-end:16px;width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink2);display:grid;place-items:center;cursor:pointer;transition:.15s}
.rfs-close:hover{border-color:rgba(200,240,75,.5);color:var(--accent)}
.rfs[data-state="pause"] .rfs-num{color:var(--amber);text-shadow:0 0 44px rgba(229,169,60,.3)}
.rfs[data-state="pause"] .rfs-eb{color:var(--amber)}
.rfs[data-state="pause"] .rfs-bar i{background:var(--amber)}
.rfs[data-state="done"] .rfs-num{color:var(--green);text-shadow:0 0 44px rgba(43,191,113,.4)}
.rfs[data-state="done"] .rfs-eb{color:var(--green)}
.rfs[data-state="done"] .rfs-bar i{background:var(--green)}
.rest .cd{cursor:pointer}
.rpause svg{display:block}
.rpe-top{display:flex;align-items:center;gap:9px}
.rpe-help{width:20px;height:20px;border-radius:50%;border:1.5px dashed var(--ink3);background:none;color:var(--ink3);font-size:11px;font-weight:900;cursor:pointer;font-family:inherit;flex:none;transition:.15s;padding:3px 0 0;line-height:1;display:grid;place-items:center}
.rpe-help:hover{border-color:var(--accent);color:var(--accent);border-style:solid}
.rpe-scale{display:flex;gap:6px;margin-top:10px}
.rchip{flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink2);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:900;cursor:pointer;transition:.15s;padding-inline:0}
.rchip:hover{border-color:rgba(200,240,75,.45);color:var(--ink)}
.rchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rpe-ovl{position:absolute;inset:0;background:rgba(6,8,6,.55);z-index:44;opacity:0;pointer-events:none;transition:.25s;border-radius:44px}
.rpe-ovl.on{opacity:1;pointer-events:auto}
.rpe-sheet{position:absolute;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:14px 16px 20px;transform:translateY(105%);transition:transform .32s cubic-bezier(.3,.9,.3,1);direction:ltr;box-shadow:0 -14px 40px -12px rgba(0,0,0,.6)}
.rpe-sheet.on{transform:translateY(0)}
.rpe-grab{width:38px;height:4px;border-radius:99px;background:#333941;margin:0 auto 12px}
.rpe-sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.rpe-sh-h b{font-size:14px;font-weight:900}
.rpe-sh-h span{font-size:10.5px;color:var(--ink3);display:block;font-weight:400;margin-top:2px}
.rpe-x{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink2);cursor:pointer;font-size:15px;line-height:1;display:grid;place-items:center;font-family:inherit;flex:none}
.rpe-x:hover{border-color:rgba(200,240,75,.5);color:var(--accent)}
.rlg{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--line2)}
.rlg:last-of-type{border:none}
.rlg .n{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-weight:900;font-size:14px;flex:none}
.rlg .t{flex:1;min-width:0}
.rlg .t b{display:block;font-size:12.5px}
.rlg .t span{font-size:11px;color:var(--ink3)}
.rlg .tag{font-size:8.5px;font-weight:900;border-radius:6px;padding:3px 7px;background:var(--surface3);color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;flex:none}
.rpe-sh-f{margin-top:11px;background:var(--accent-soft);border:1px dashed rgba(200,240,75,.4);border-radius:11px;padding:9px 11px;font-size:11.5px;color:var(--ink2);line-height:1.9}
.rpe-sh-f b{color:var(--accent)}
.plfoot{position:absolute;bottom:0;left:0;right:0;background:rgba(13,15,19,.95);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.07);padding:11px 14px 16px;display:flex;gap:9px;z-index:15;direction:ltr}
.plfoot .btn{flex:1;height:44px;display:flex;align-items:center;justify-content:center;gap:7px}
.plfoot .btn.ghost{flex:none;width:46px}
.kcal{margin:0 14px 12px;background:linear-gradient(145deg,#1C2118,#14171C 60%);border:1px solid rgba(200,240,75,.22);border-radius:18px;padding:15px}
.kcal .eyebrow{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:900}
.kcal .big{font-size:34px;font-weight:900;font-family:'JetBrains Mono',monospace;letter-spacing:-.04em;margin-top:5px;display:flex;align-items:center;gap:8px;line-height:1.1}
.kcal .big small{font-size:13px;color:var(--ink3);font-weight:500;letter-spacing:0;line-height:1;align-self:center;padding-top:2px}
.macros{display:flex;gap:8px;margin-top:13px}
.macro{flex:1}
.macro .lab{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);margin-bottom:5px;font-weight:800}
.macro .lab b{color:var(--ink2);font-family:'JetBrains Mono',monospace}
.macro .pbar{height:5px}
.macro.p .pbar i{background:#7EA0FF}
.macro.c .pbar i{background:#F0B457}
.macro.f .pbar i{background:#B79CFF}
.wtank{position:relative;height:78px;border-radius:14px;background:#0B1524;border:1px solid #1B3A5C;overflow:hidden;transition:border-color .3s}
.wtank.done{border-color:rgba(43,191,113,.55)}
.wfill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#3DB8FF,#1D6BFF);transition:height .55s cubic-bezier(.3,.8,.3,1)}
.wfill.goal{background:linear-gradient(180deg,#3BE89B,#12A968)}
.wsurf{position:absolute;top:-6px;left:0;width:200%;height:13px;animation:wslide 3.6s linear infinite}
.wsurf path{fill:#3DB8FF}
.wfill.goal .wsurf path{fill:#3BE89B}
.wsurf.s2{top:-4px;animation-duration:5.4s;animation-direction:reverse;opacity:.6}
.wmid{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;gap:7px;pointer-events:none;z-index:2;padding-top:26px}
.wmid b{font-size:21px;font-weight:900;font-family:'JetBrains Mono',monospace;letter-spacing:-.04em;color:#fff;text-shadow:0 1px 8px rgba(0,10,40,.7)}
.wmid span{font-size:10.5px;font-family:'JetBrains Mono',monospace;color:rgba(255,255,255,.8);text-shadow:0 1px 6px rgba(0,10,40,.7)}
.wbtns{display:flex;gap:8px;margin-top:9px}
.wbtn{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;font-size:10.5px;font-weight:800;color:var(--ink2);cursor:pointer;transition:.15s}
.wbtn .eic{width:15px;height:15px;color:#4CC2FF}
.wbtn:hover{border-color:rgba(77,124,254,.5);color:var(--ink)}
.wbtn:disabled{opacity:.4;cursor:default}
.wbtn:disabled:hover{border-color:var(--line);color:var(--ink2)}
.wbtn.wundo .eic{color:var(--ink3)}
.meal{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line2)}
.meal:last-child{border-bottom:none}
.meal .mi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:15px}
.meal .t{flex:1;min-width:0}
.meal .t b{display:block;font-size:13px}
.meal .t span{font-size:11px;color:var(--ink3)}
.meal .kc{font-size:12px;font-family:'JetBrains Mono',monospace;font-weight:700;flex:none}
.macc{border-bottom:1px solid var(--line2)}
.macc:last-child{border-bottom:none}
.macc-head{display:flex;align-items:center;gap:8px;padding:11px 0;cursor:pointer;user-select:none}
.macc-head .mi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;flex:none;margin-right:3px;transition:box-shadow .2s}
.macc.open .macc-head .mi{box-shadow:0 0 0 2.5px rgba(200,240,75,.5)}
.macc .t{flex:1;min-width:0}
