<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CoachMint — Coach & Client Workspace</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12151B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CoachMint">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 100'%3E%3Crect width='120' height='100' rx='22' fill='%2312151B'/%3E%3Cpath d='M36 6L116 6 94 30 56 30 44 50 56 70 94 70 116 94 4 94Z' fill='%23C8F04B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* v18.7 — light-theme separation fix (round 2): users only saw clear section
     boundaries while a modal dimmed the page (rgba(0,0,0,.55) overlay makes
     white surfaces glow against the darkened canvas). Round 1 (#EAEAE2) was
     too subtle — the canvas is now clearly darker than the cards and the
     hairlines/shadow carry real weight, so the layout has depth un-dimmed. */
  --bg:#DDDDD0; --surface:#FFFFFF; --sidebar:#12151B;
  --ink:#15181E; --ink2:#5C6270; --ink3:#9AA0AE;
  --line:#C8C8B6; --line2:#D5D5C6;
  --accent:#C8F04B; --accent-deep:#8FB51E; --accent-ink:#1A2205; --accent-soft:#F4FAE0;
  --acc-line:#CDE694; --acc-line2:#CFE49B; --acc-mid:#A6D437; --acc-mid2:#9CC53E; --acc-stat:#B4D95B; --acc-chip:#D8E9AF;
  --green:#16A34A; --green-soft:#E9F6EE; --red:#DC2626; --red-soft:#FDEDED;
  --amber:#C77414; --amber-soft:#FBF2E2; --blue:#2563EB; --blue-soft:#EAF1FE;
  --purple:#7C3AED; --purple-soft:#F2EDFD;
  --glass:rgba(221,221,208,.85); --glass2:rgba(221,221,208,.92);
  --ink-bg:#15181E; --btn-dark-bg:#15181E; --btn-dark-fg:#fff;
  --row-h:#F7F7F3; --seg-bg:#E9E9E3; --seg-on:#FFFFFF; --kbd-bg:#EFEFEA; --cal-hd:#F9F9F5; --cal-alt:#F7F7F3;
  --sh-1:0 1px 2px rgba(18,21,27,.09),0 6px 18px -6px rgba(18,21,27,.16);
  --sh-2:0 12px 32px -8px rgba(18,21,27,.18);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
html{color-scheme:light}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1114; --surface:#171A1F; --sidebar:#0B0D10;
  --ink:#E9EAEE; --ink2:#A9AFBA; --ink3:#707786;
  --line:#2E333B; --line2:#262B33;
  --glass:rgba(15,17,20,.85); --glass2:rgba(15,17,20,.92);
  --ink-bg:#0B0D10; --btn-dark-bg:#E9EAEE; --btn-dark-fg:#12151B;
  --row-h:#1C2026; --seg-bg:#22262D; --seg-on:#2B3038; --kbd-bg:#1C2026; --cal-hd:#1B1F25; --cal-alt:#171A1F;
  --sh-1:0 1px 2px rgba(0,0,0,.5); --sh-2:0 14px 34px -10px rgba(0,0,0,.7);
}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
html[lang="fa"] body{font-family:'Vazirmatn','Inter',-apple-system,sans-serif;font-size:13.5px}
html[lang="fa"] h1,html[lang="fa"] h2,html[lang="fa"] h3,html[lang="fa"] .stat .v{letter-spacing:0}
html[lang="fa"] .card-t,html[lang="fa"] .nav-sec,html[lang="fa"] .tbl th,html[lang="fa"] .fs-t,html[lang="fa"] .eyebrow,html[lang="fa"] .mi span{letter-spacing:0;text-transform:none}
.ic{flex:none;display:block}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
::placeholder{color:var(--ink3)}
h1,h2,h3{letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;font-weight:600;font-size:13.5px;border:1px solid transparent;transition:.15s;white-space:nowrap}
/* v18.11 design pass — brand lime front and center: gradient primary with a
   soft glow + hover lift (both themes; accent vars adapt automatically). */
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--acc-mid));color:var(--accent-ink);box-shadow:0 4px 14px -6px rgba(143,181,30,.55)}.btn-primary:hover{filter:brightness(1.04);transform:translateY(-1px);box-shadow:0 7px 20px -6px rgba(143,181,30,.65)}
.btn-dark{background:var(--btn-dark-bg);color:var(--btn-dark-fg)}.btn-dark:hover{filter:brightness(.94)}
.btn-outline{background:var(--surface);border-color:var(--line);color:var(--ink)}.btn-outline:hover{border-color:var(--ink3);background:var(--row-h)}
.btn-ghost{color:var(--ink2)}.btn-ghost:hover{background:var(--line2);color:var(--ink)}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn-icon{padding:8px;border-radius:9px}
.bdg{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.bdg-green{background:var(--green-soft);color:var(--green)}.bdg-amber{background:var(--amber-soft);color:var(--amber)}
.bdg-red{background:var(--red-soft);color:var(--red)}.bdg-gray{background:var(--seg-bg);color:var(--ink2)}
.bdg-blue{background:var(--blue-soft);color:var(--blue)}.bdg-purple{background:var(--purple-soft);color:var(--purple)}
.bdg-lime{background:var(--accent-soft);color:var(--accent-ink)}
.inp,.sel,.ta{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;outline:none;transition:.15s}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--accent-deep);box-shadow:0 0 0 3px var(--accent-soft)}
.ta{resize:vertical;min-height:74px}
.lbl{font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px;display:block}
.field{margin-bottom:14px}
kbd{background:var(--kbd-bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;font-size:11px;font-family:inherit;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-1)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line)}
.card-t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.muted{color:var(--ink3)}.sub{color:var(--ink2);font-size:13.5px}
.lnk{color:var(--accent-deep);font-weight:600;cursor:pointer;text-decoration:none}.lnk:hover{text-decoration:underline}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--sidebar);color:#A9AFBD;display:flex;flex-direction:column;z-index:60;transition:width .2s,transform .25s;user-select:none}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;color:#fff}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand-name{font-weight:800;font-size:15.5px;white-space:nowrap;font-style:italic;text-transform:uppercase;letter-spacing:.01em}
.brand-name b{color:var(--ink3);font-weight:800}
.brand-tag{font-size:8.5px;font-weight:700;letter-spacing:.24em;color:var(--ink3);margin-top:3px;white-space:nowrap}
body.sb-c .brand-tag{display:none}
.nav{flex:1;padding:4px 10px 10px;overflow-y:auto}
.nav-sec{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#565D6B;padding:14px 10px 6px;white-space:nowrap}
.nav-it{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;font-size:13.5px;font-weight:500;color:#A9AFBD;margin-bottom:2px;cursor:pointer;position:relative;white-space:nowrap}
.nav-it:hover{background:rgba(255,255,255,.06);color:#fff}
/* v18.11 — active nav = solid lime pill (was a faint 13% tint nobody saw) */
.nav-it.on,.nav-it.on:hover{background:var(--accent);color:var(--accent-ink);font-weight:700}
.nav-it.on::before{content:none}
.nav-it.on .nbadge{background:rgba(26,34,5,.22);color:var(--accent-ink)}
.nbadge{margin-inline-start:auto;font-size:10px;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:1px 7px;border-radius:99px}
body.sb-c .nbadge{position:absolute;top:2px;inset-inline-end:6px;padding:1px 5px;margin:0}
.side-foot{padding:10px;border-top:1px solid rgba(255,255,255,.07)}
.sprof{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer}
.sprof:hover{background:rgba(255,255,255,.06)}
.sprof .n{font-size:13px;font-weight:600;color:#fff;white-space:nowrap}
.sprof .p{font-size:11px;color:var(--accent);white-space:nowrap}
.main{margin-left:250px;min-height:100vh;display:flex;flex-direction:column;transition:margin .2s}
body.sb-c .sidebar{width:76px}
body.sb-c .main{margin-left:76px}
body.sb-c .txt,body.sb-c .nav-sec,body.sb-c .brand-name,body.sb-c .sprof .n,body.sb-c .sprof .p{display:none}
body.sb-c .nav-it{justify-content:center;padding:10px}
body.sb-c .nav-it.on::before{display:none}
body.sb-c .sprof{justify-content:center}
.topbar{position:sticky;top:0;z-index:40;background:var(--glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px}
.searchbox{flex:0 1 360px;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink3);cursor:text;font-size:13.5px}
.searchbox.sm{padding:6px 10px;font-size:12.5px;border-radius:9px;gap:7px}
.hamb{display:none}
.content{padding:24px;max-width:1400px;width:100%;margin:0 auto;flex:1;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
/* v18.11 tier-3 — dashboard hero banner (dark gradient + lime glow, both themes) */
.hero{position:relative;overflow:hidden;background:linear-gradient(115deg,#12151B 0%,#1C2530 55%,#27351B 100%);border-radius:18px;padding:24px 26px;margin-bottom:20px;box-shadow:var(--sh-2)}
.hero::after{content:'';position:absolute;inset-inline-end:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(200,240,75,.28),transparent 70%);pointer-events:none}
.hero-k{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
html[lang="fa"] .hero-k{letter-spacing:0}
.hero h1{color:#fff;font-size:27px;font-weight:800;margin:4px 0 5px}
.hero .sub{color:#A9AFBD;font-size:13.5px}
.hero .btn-outline{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
.hero .btn-outline:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.32)}
.hero .row{position:relative;z-index:1}
@media(max-width:760px){.hero{padding:18px}.hero h1{font-size:22px}}
/* v18.11 — page title scale + lime kicker bar above every coach page header */
.page-h h1{font-size:26px;font-weight:800}
.page-h h1::before{content:'';display:block;width:34px;height:4px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--acc-mid));margin-bottom:8px}
.page-h .sub{margin-top:4px}
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700;text-align:start;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr[data-act]{cursor:pointer}
/* v18.11 — Stripe-style row hover: soft wash + lime inset bar on the start edge */
.tbl tbody tr[data-act]{position:relative}
.tbl tbody tr[data-act]:hover{background:var(--row-h)}
.tbl tbody tr[data-act]:hover td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .tbl tbody tr[data-act]:hover td:first-child{box-shadow:inset -3px 0 0 var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 20px;overflow-x:auto;scrollbar-width:none}
.tab{padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:9px 9px 0 0}
.tab:hover{color:var(--ink);background:var(--line2)}
/* v18.11 — active tab gets a soft lime wash above the underline (Linear-style) */
.tab.on{color:var(--accent-deep);border-color:var(--accent-deep);background:linear-gradient(to top,var(--accent-soft),transparent 70%)}
.mwrap{position:relative}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh-2);padding:6px;min-width:230px;z-index:80;display:none}
.mwrap.open .menu{display:block;animation:fade .12s}
.menu-it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--ink)}
.menu-it:hover{background:var(--line2)}
.menu-it .ic{color:var(--ink2)}
.menu-hd{padding:8px 10px 4px;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--ink3)}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--sh-2);width:100%;max-width:760px;max-height:90vh;display:flex;flex-direction:column;animation:pop .16s ease}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:17px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:16px}
.modal-b{padding:20px 22px;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:15px 22px;border-top:1px solid var(--line)}
.fs{margin-bottom:20px}
.fs-t{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);padding-bottom:8px;border-bottom:1px solid var(--line2);margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{padding:17px 19px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12.5px;font-weight:600;color:var(--ink2)}
.stat .v{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.delta{font-size:12px;font-weight:600}
.delta.up{color:var(--green)}.delta.down{color:var(--red)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:start}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.bgrid{display:grid;grid-template-columns:1fr 250px;gap:14px;align-items:start}
.sgrid{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}
.tl-row{display:flex;gap:14px;padding:13px 20px;border-bottom:1px solid var(--line2);align-items:center}
.tl-row:last-child{border-bottom:none}
.tl-row.click{cursor:pointer}
.tl-row.click:hover{background:var(--row-h)}
.tl-time{width:56px;font-weight:700;font-size:13px;color:var(--ink2);flex:none}
.act-dot{width:9px;height:9px;border-radius:50%;background:var(--accent-deep);flex:none;margin-top:5px}
.fchip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.fchip.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--acc-line)}
.seg{display:inline-flex;background:var(--seg-bg);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:var(--sh-1)}
.pbar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent-deep);border-radius:99px;transition:width .3s}
.sw{position:relative;width:38px;height:22px;flex:none;display:inline-block}
.sw input{position:absolute;opacity:0}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s;cursor:pointer}
.sw i::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;inset-inline-start:3px;top:3px;transition:.15s;box-shadow:var(--sh-1)}
.sw input:checked+i{background:var(--accent-deep)}
.sw input:checked+i::after{inset-inline-start:calc(100% - 19px)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid var(--line2)}
.set-row:last-child{border-bottom:none}
.set-row .t{font-weight:600;font-size:13.5px}
.set-row .d{font-size:12.5px;color:var(--ink2);margin-top:2px}
/* v17.6 — light-theme polish: sectioning, focus, scrollbars, empty states */
.sec-t{display:flex;align-items:center;gap:10px;margin:24px 0 12px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.sec-t::after{content:'';flex:1;height:1px;background:var(--line)}
.sec-t .bdg{letter-spacing:0}
html[lang="fa"] .sec-t{letter-spacing:0}
.stat{transition:transform .18s,box-shadow .18s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.stat .icw{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-deep);flex:none}
button:focus-visible,[data-act]:focus-visible,a:focus-visible,.tab:focus-visible,.fchip:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px;border-radius:8px}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid var(--bg)}
*::-webkit-scrollbar-thumb:hover{background:var(--ink3)}
*::-webkit-scrollbar-track{background:transparent}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:26px 20px;text-align:center;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty b{color:var(--ink2);font-size:13.5px}
.empty .muted{font-size:12.5px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:14px}
.cgrid .card{padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.cgrid .card:hover{border-color:var(--acc-line);box-shadow:var(--sh-2);transform:translateY(-1px)}
/* v17.11 — onboarding wizard */
.onb-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.onb-opt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;text-align:start;transition:border-color .15s,background .15s;color:var(--ink)}
.onb-opt:hover{border-color:var(--ink3)}
.onb-opt.on{border-color:var(--accent-deep);background:var(--accent-soft);color:var(--accent-ink)}
.onb-dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .2s}
.onb-dot.on{background:var(--accent-deep)}
@media(max-width:520px){.onb-grid{grid-template-columns:1fr}}
.cal-grid{display:grid;grid-template-columns:56px repeat(7,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.cal-hd{padding:10px 6px;text-align:center;border-bottom:2px solid var(--line);border-inline-start:1px solid var(--line2);font-size:12px;font-weight:700;color:var(--ink2);background:var(--cal-hd)}
.cal-hd.today{color:var(--accent-ink);background:var(--accent-soft)}
.cal-hd.click{cursor:pointer;transition:.12s}
.cal-hd.click:hover{background:var(--accent-soft)}

.photo.after{position:absolute;inset:0;clip-path:inset(0 0 0 var(--cut,50%));background:linear-gradient(160deg,#DDE8CE,#C4D6A6)}

.login{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}

.ric{width:44px;height:44px;border-radius:13px;display:grid;place-items:center}

.pal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;justify-content:center;align-items:flex-start;padding-top:11vh;backdrop-filter:blur(3px)}

.pal-it{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:13.5px}

#toasts{position:fixed;inset-inline-end:20px;bottom:20px;z-index:120;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink-bg);color:#fff;padding:11px 16px;border-radius:12px;box-shadow:var(--sh-2);font-size:13.5px;font-weight:500;animation:slide .2s}

@keyframes slide{from{transform:translateY(8px);opacity:0}}
.bub{max-width:78%;padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.45}
.bub.me{background:var(--ink-bg);color:#fff;border-end-end-radius:6px}
.bub.them{background:var(--surface);border:1px solid var(--line);border-end-start-radius:6px}
.bub .ctx{display:inline-flex;font-size:10.5px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink);padding:2px 8px;border-radius:6px;margin-bottom:5px}

.vid{width:220px;max-width:100%;height:118px;border-radius:12px;background:linear-gradient(150deg,#1B2029,#0D0F13);display:grid;place-items:center;color:#fff;position:relative;cursor:pointer;margin-top:4px}

.vid .lbl{position:absolute;top:6px;inset-inline-start:8px;font-size:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:1px 7px;border-radius:6px}
.composer{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line2);background:var(--surface)}
.clientwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px;background:var(--bg)}
.phone{width:410px;max-width:100%;height:min(870px,94vh);background:var(--bg);border:10px solid #0D0F13;border-radius:48px;box-shadow:0 30px 70px -25px rgba(13,15,19,.5);overflow:hidden;position:relative;display:flex;flex-direction:column;flex:none}

.cbody{padding:14px 14px 96px;display:flex;flex-direction:column;gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh-1)}
.cstat{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}

.cnav{position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:8px 8px 22px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:7}

.cnav-it.on{color:var(--accent-deep)}
.cdot{position:absolute;top:4px;inset-inline-end:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--red)}

/* client portal — black chrome, green brand accents */
.phone .card-t{color:var(--accent-deep)}
.phone .chead{background:linear-gradient(180deg,#12151B,#171B22);color:#fff;border-bottom:1px solid rgba(200,240,75,.16)}
.phone .chead .muted{color:rgba(255,255,255,.55);font-weight:600}
.phone .chead .gbadge{background:rgba(200,240,75,.14);color:var(--accent);border:1px solid rgba(200,240,75,.25)}
.phone .chip{background:var(--accent-soft);color:var(--accent-ink)}
.phone .fchip{background:var(--accent-soft);border-color:var(--acc-chip);color:var(--accent-ink)}
.phone .fchip:hover{background:var(--accent);color:var(--accent-ink)}
.phone .seg{background:var(--accent-soft)}
.phone .seg button.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.phone .pbar{background:var(--accent-soft)}
.phone .pbar i{background:linear-gradient(90deg,var(--accent-deep),var(--accent))}
/* v18.14 — Fitness+-inspired client app: the phone is ALWAYS true-black with
   dark-gray cards, regardless of the coach theme (Apple Fitness+ never goes
   light inside the app). Scoped via CSS vars on .phone so every nested
   component (chips, inputs, bars) adapts without touching markup. */
.phone{--surface:#15171C;--line:#262A31;--line2:#1F232A;--ink:#F5F6F8;--ink2:#B4B9C4;--ink3:#7E8492;
  --row-h:#1C2026;--seg-bg:#22262D;--seg-on:#2B3038;--kbd-bg:#1C2026;--cal-hd:#1B1F25;--cal-alt:#171A1F;
  --glass:rgba(5,6,8,.88);--glass2:rgba(5,6,8,.92);--btn-dark-bg:#F5F6F8;--btn-dark-fg:#12151B;
  background:#000;color:var(--ink)}
.phone .ccard{box-shadow:none}
.phone .chip{background:#22262D;color:#E9EAEE;border:1px solid #2E333B}
.phone .fchip{background:#1C2026;border-color:#2E333B;color:#B4B9C4}
.phone .fchip.on,.phone .fchip:hover{background:rgba(200,240,75,.1);border-color:var(--accent);color:var(--accent)}
.phone .inp,.phone .sel,.phone .ta{background:#1C2026;border-color:#2E333B;color:var(--ink)}
.phone .tbl th{color:#7E8492}.phone .tbl td{border-color:#1F232A}
.phone .tbl tbody tr[data-act]:hover td:first-child{box-shadow:none}
/* Fitness+ check-in segments: dark pills, selected = lime outline + lime text */
.phone .seg{background:transparent;gap:6px}
.phone .seg button{flex:1;background:#1C2026;border:1.5px solid transparent;border-radius:10px;color:#B4B9C4}
.phone .seg button.on{background:rgba(200,240,75,.08);border-color:var(--accent);color:var(--accent);box-shadow:none}
/* Fitness+ bottom tab bar: blurred black, active = lime icon + label, no pill */
.phone .cnav,.mshell .cnav{background:rgba(8,9,11,.92);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.06)}
.phone .cnav-it,.mshell .cnav-it{color:#6B7280}
.phone .cnav-it.on,.mshell .cnav-it.on{color:var(--accent);background:none}
/* Fitness+ gradient hero card ("Stay Consistent") — layered radial mesh */
.fhero{position:relative;overflow:hidden;border-radius:20px;padding:18px;color:#fff;border:none;
  background:radial-gradient(120% 95% at 85% 8%,rgba(235,150,90,.92),transparent 55%),
             radial-gradient(125% 105% at 12% 92%,rgba(88,68,158,.95),transparent 62%),
             linear-gradient(135deg,#6D5BA6,#B85B8A 55%,#D98A62)}
.fhero.pink{background:radial-gradient(120% 95% at 82% 12%,rgba(242,172,120,.88),transparent 55%),
             radial-gradient(130% 110% at 10% 88%,rgba(186,56,138,.95),transparent 62%),
             linear-gradient(135deg,#A84B8A,#C25B7C 50%,#E08D5B)}
.fhero .card-t{color:rgba(255,255,255,.85)}
.fhero .chip{background:rgba(0,0,0,.22);color:#fff;border:none}
.fhero .glass{width:100%;justify-content:center;background:rgba(0,0,0,.28);backdrop-filter:blur(6px);color:#fff;border-radius:13px;font-weight:700}
/* Fitness+ big lime CTA ("Review Plan" / "Let's Go") */
.btn-lime{width:100%;justify-content:center;background:var(--accent);color:#141A05;font-weight:800;border-radius:14px;padding:13px 16px;font-size:14px}
.btn-lime:hover{filter:brightness(1.05)}
/* Fitness+ weekly letter circles (M T W T F S S) */
.wkc{display:flex;gap:7px}
.wkc i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12.5px;background:#1C2026;color:#8A90A0;flex:none}
.wkc i.done{background:rgba(200,240,75,.16);color:var(--accent)}
.wkc i.today{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
/* Fitness+ pill filter row */
.fpills{display:flex;gap:8px;flex-wrap:wrap}
.fpill{padding:8px 16px;border-radius:999px;background:#1C2026;color:#B4B9C4;font-size:12.5px;font-weight:700;border:1.5px solid transparent;cursor:pointer}
.fpill.on{background:rgba(200,240,75,.08);border-color:var(--accent);color:var(--accent)}
/* Fitness+ big bold section headers inside the app */
.csec{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin:4px 2px -2px}
html[lang="fa"] .csec{letter-spacing:0}
.phone .cnav{background:#12151B;border-top:1px solid rgba(255,255,255,.07)}
.phone .cnav-it{color:#8A90A0}

.phone .bub.me{background:var(--accent);color:var(--accent-ink);border:none}

.phone .btn-outline{border-color:var(--acc-line2);color:var(--accent-ink)}
.phone .cempty svg{color:var(--accent-deep)}
.phone .cphead{border-bottom:2px solid var(--accent)}

.mshell{height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.mhead{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#12151B,#171B22);backdrop-filter:blur(10px);border-bottom:1px solid rgba(200,240,75,.16);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff}

.mbrand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px}
.mbrand b{color:var(--ink3)}
.mmain{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 100px;scrollbar-width:thin}
.mmain.chatmode{display:flex;flex-direction:column;overflow:hidden;padding:0}
.mstack{display:flex;flex-direction:column;gap:12px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13.5px}
.mrow:hover{background:var(--line2)}
.mshell .cnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#12151B;border-top:1px solid rgba(255,255,255,.07)}
.mshell .cnav-it{color:#8A90A0}
.mshell .cnav-it.on{color:var(--accent);background:rgba(200,240,75,.12)}
.mchat{display:flex;flex-direction:column;height:100%;min-height:0}
.mchat-h{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line2);background:var(--surface)}
.mchat-b{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:10px}
/* nutrition workspace */
.frow{display:grid;grid-template-columns:1fr 92px 64px 28px 28px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.frow:last-child{border-bottom:none}
.frow .fk{font-weight:600}
.mtime{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink2);font-size:12px;background:var(--line2);padding:2px 8px;border-radius:6px;flex:none}
.wcol{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:220px}
.wmealc{border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:grab;background:var(--surface);margin-top:8px;font-size:12px}
.wmealc b{font-size:12.5px}
.wmealc.dragging{opacity:.4}
.wcol.droptarget{background:var(--accent-soft);border-color:var(--acc-line)}
.dist{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line2)}
.dist i{display:block;height:100%}
[dir="rtl"] .sidebar{left:auto;right:0}
[dir="rtl"] .main{margin-left:0;margin-right:250px}
[dir="rtl"] body.sb-c .main{margin-left:0;margin-right:76px}
[dir="rtl"] .back-ic{transform:scaleX(-1)}
[dir="rtl"] .flip-rtl{transform:scaleX(-1)}

@media(max-width:1080px){

  .sidebar .nav-it{justify-content:center;padding:10px}.sidebar .nav-it.on::before{display:none}.sidebar .sprof{justify-content:center}
  .main{margin-left:76px}

  .hamb{display:inline-flex}

/* ≤520px — client portal goes full-screen. The page must NEVER scroll as a whole:
   .clientwrap is pinned to the viewport (100vh on iOS is taller than the visible
   screen, which made the entire app wobble up/down while scrolling), overscroll
   is contained (no rubber-band / pull-to-refresh moving the whole page), the
   floating lang/exit/feedback buttons are hidden (the lang one was an in-flow
   flex sibling of .phone and caused horizontal overflow), and inputs get 16px
   so iOS stops auto-zooming when the client types a message. */
@media(max-width:520px){
html,body{overscroll-behavior:none}
.clientwrap{position:fixed;inset:0;padding:0;overflow:hidden}
.phone{width:100%;height:100%;border:none;border-radius:0;box-shadow:none}
.notch{display:none}
.chead{padding-top:calc(14px + env(safe-area-inset-top,0px));backdrop-filter:none}
.cphead{padding-top:calc(14px + env(safe-area-inset-top,0px))}
.clientwrap>button[data-act="exitdemo"],.clientwrap>button[data-act="lang"],.clientwrap>a.btn{display:none}
.phone .inp,.phone .ta,.phone .sel{font-size:16px}
}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;display:none}
body.sb-open .scrim{display:block}
/* v16.8 — AI chat assistant */
.ai-fab{position:fixed;bottom:22px;inset-inline-end:22px;z-index:60;height:52px;padding:0 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:9px;cursor:pointer;border:none;box-shadow:0 10px 30px -6px rgba(0,0,0,.35);transition:transform .25s;font-weight:800;font-size:13.5px;white-space:nowrap}
.ai-fab:hover{transform:translateY(-3px)}
/* Mobile: the pill must sit ABOVE the fixed bottom nav, not on top of it */
@media(max-width:760px){.ai-fab{bottom:calc(86px + env(safe-area-inset-bottom,0px));height:46px;padding:0 15px;font-size:12.5px}}
.ai-ovl{position:fixed;inset:0;z-index:98;background:rgba(8,10,6,.45);backdrop-filter:blur(3px)}
.ai-panel{position:fixed;bottom:0;inset-inline-end:0;z-index:99;width:min(430px,100vw);height:min(660px,94vh);background:var(--bg);border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -12px 44px -10px rgba(0,0,0,.4)}
.ai-hd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line2);font-size:13.5px}
.ai-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.ai-m{max-width:86%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ai-m.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.ai-m.a{align-self:flex-start;background:var(--bg2);border:1px solid var(--line2);border-bottom-left-radius:4px}
.ai-typing{display:flex;gap:4px;align-items:center}
.ai-typing span{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:aib 1.2s infinite}
.ai-typing span:nth-child(2){animation-delay:.2s}.ai-typing span:nth-child(3){animation-delay:.4s}
@keyframes aib{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.ai-in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line2)}
.ai-in .inp{flex:1}
</style>
</head>

/* Coach-configurable calendar working hours (e.g. 08:00 → 24:00).
   Sanitizes stored values: start 0–23.5, end start+1…24, always on the half hour. */
function calHours(){
  const q=v=>{const n=Math.round((+v)*2)/2;return Number.isFinite(n)?n:null};
  let s=q(PREFS.cal&&PREFS.cal.start);if(s==null)s=7;
  let e=q(PREFS.cal&&PREFS.cal.end);if(e==null)e=21;
  s=Math.max(0,Math.min(23.5,s));
  e=Math.max(s+1,Math.min(24,e));
  return {start:s,end:e};
}

  return `<option value="${v}" ${+sel===v?'selected':''}>${nf(l)}</option>`}).join('');

/* ============ PERSISTENCE (auto-save on this device) ============ */
const STORE_KEY='co-os-data';
/* Put your email here to show a Feedback button for beta coaches, e.g. 'you@gmail.com' — leave '' to hide */
const FEEDBACK_MAIL='';
/* Unique local ids: Date.now() can repeat inside one millisecond AND two devices
   can create the same value, so every locally created record carries a counter. */
let __uid=0;
const uid=()=>Date.now()*1000+(__uid=(__uid+1)%1000);
/* Tombstones for cloud merge — deleted ids are remembered so a sync never resurrects them */
const DEAD={CLIENTS:[],EVENTS:[],MSGS:[],NOTES:[],NPLANS:[],TEMPLATES:[],MTPL:[],PTPL:[],FOODS:[],FILES:[],MEAS:[],PACKS:[],MSGTPL:[],CEXS:[]};
let __lastPack='';
/* v16.4 — tenant ownership of the LOCAL dataset. The leak: coach A signs out,
   coach B signs in on the SAME device; the local arrays (and STORE_KEY) still
   held A's clients, and the first sync "seeded" B's empty workspace with them
   — so A's clients appeared under B too. Every saved payload now carries the
   coach id it belongs to; on login/signup as a DIFFERENT coach the local
   workspace is wiped (and the previous account's parked codes dropped) before
   any sync can run. Same coach returning to the device keeps offline edits. */
let DATA_OWNER=null;
function adoptAccount(acct){
  const id=(acct&&acct.id)||'';
  if(!id)return;
  if(!DATA_OWNER||DATA_OWNER!==id){
    // No owner stamp (fresh device / demo seed) or a DIFFERENT coach was last:
    // the local bytes must never reach the new coach's workspace.
    freshWorkspace();
    try{localStorage.removeItem('co-legacy-ws')}catch(e){}
    if(DATA_OWNER&&DATA_OWNER!==id){try{localStorage.removeItem('co-ws')}catch(e){}}
  }
  DATA_OWNER=id;
  saveData();
}
function saveData(){
  let payload='';
  try{
    payload=JSON.stringify({v:13,owner:DATA_OWNER,ownerName:wsOwnerName(),CLIENTS,EVENTS,NOTES,MSGS,TEMPLATES,FILES,BUILDER,NPLANS,MTPL,PTPL,NHIST,ACTIVITY,NOTIFS,FOODS,PACKS,MSGTPL,EXVID,COACH_PIC,ONBOARD,CEXS,DB:packDB(),DEAD});
    localStorage.setItem(STORE_KEY,payload);
  }catch(e){}
  // render() runs on EVERY interaction, so without this comparison even a pure
  // view switch marked the workspace dirty and scheduled a full-payload PUT.
  // Only actual data changes should reach the network.
  if(payload&&payload!==__lastPack){
    __lastPack=payload;
    if(CLOUD.on)cloudSchedule();
  }
}
function loadData(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw)return false;
    const d=JSON.parse(raw);
    if(!d||d.v!==13){
      // Don't silently throw away a payload we can't read. Park it under a
      // backup key so it can be recovered/migrated instead of vanishing.
      try{if(!localStorage.getItem(STORE_KEY+'-backup'))localStorage.setItem(STORE_KEY+'-backup',raw)}catch(e){}
      return false;
    }
    DATA_OWNER=d.owner||null; // whose tenant these local bytes belong to
    WS_OWNER=d.ownerName||''; // coach display name (shown on client devices)
    const repl=(arr,val)=>{arr.length=0;(val||[]).forEach(x=>arr.push(x))};
    repl(CLIENTS,d.CLIENTS);repl(EVENTS,d.EVENTS);repl(NOTES,d.NOTES);repl(MSGS,d.MSGS);
    repl(TEMPLATES,d.TEMPLATES);repl(FILES,d.FILES);repl(BUILDER,d.BUILDER);
    repl(NPLANS,d.NPLANS);repl(MTPL,d.MTPL);repl(PTPL,d.PTPL);repl(NHIST,d.NHIST);
    repl(ACTIVITY,d.ACTIVITY);repl(NOTIFS,d.NOTIFS);repl(FOODS,d.FOODS);
    repl(PACKS,d.PACKS);repl(MSGTPL,d.MSGTPL);repl(CEXS,d.CEXS);syncCustomEx();
    // v18.9.1 — workspaces saved before the food seed existed carry FOODS:[]
    // (freshWorkspace used to leave it empty). There is no food-delete UI, so
    // an empty library is always a broken state, never intentional: backfill.
    if(!FOODS.length)defaultFoods().forEach(f=>FOODS.push(f));
    if(d.EXVID&&typeof d.EXVID==='object')EXVID=d.EXVID;
    if(typeof d.COACH_PIC==='string')COACH_PIC=d.COACH_PIC;
    if(d.ONBOARD&&typeof d.ONBOARD==='object')ONBOARD=d.ONBOARD;
    Object.keys(d.DB||{}).forEach(k=>{DB[k]=d.DB[k]});
    Object.keys(DEAD).forEach(k=>{DEAD[k].length=0;((d.DEAD||{})[k]||[]).forEach(x=>DEAD[k].push(String(x)))});
    /* NOTE: this used to run `if(!EVENTS.some(e=>e.att)) EVENTS.forEach(e=>e.day<TODAY&&(e.att='done'))`
       — i.e. EVERY past session was silently marked "Attended" the first time a
       workspace had no recorded attendance. That fabricated history fed the
       attendance-rate KPI, the "Missed session" list and what clients see, and
       was unrecoverable once pushed. Attendance must only be set explicitly. */
    if(TEMPLATES.some(tp=>!tp.exs&&!tp.parts)){
      const seeds=defaultTemplates();
      TEMPLATES.forEach((tp,i)=>{if(!tp.exs&&!tp.parts){const sd=seeds.find(s=>s.n===tp.n);if(sd)TEMPLATES[i]=JSON.parse(JSON.stringify(sd))}});
    }
    CLIENTS.forEach(c=>{if(!DB[c.id])DB[c.id]={workouts:[],sessions:[],stats:{done:c.done||0,missed:c.missed||0},nutrition:null,measures:mseeds(c.id)}});
    Object.keys(DB).forEach(k=>{if(!DB[k].measures){DB[k].measures=mseeds(k)}});
    scrubNames(); // stored payload may predate the escaping fix — strip markup from names
    return true;
  }catch(e){return false}
}

/* Session token in localStorage; every sync request carries it as a Bearer
   header when present. Students keep syncing by code alone (no login). */
const AUTH={token:'',coach:null,ws:null,access:null};
try{AUTH.token=localStorage.getItem('co-auth')||''}catch(e){}
const authHeaders=()=>AUTH.token?{'authorization':'Bearer '+AUTH.token}:{};
const authSet=t=>{AUTH.token=t||'';try{t?localStorage.setItem('co-auth',t):localStorage.removeItem('co-auth')}catch(e){}};
/* v16.5 — the signed-in coach's REAL identity. The UI used to hardcode the
   demo persona "Soroush Karimi / soroush@coachos.app" in the sidebar, topbar
   and profile, so the name chosen at signup never appeared anywhere (it WAS
   saved server-side — only the display was wrong). Falls back to the persona
   in demo mode. */
const coachName=()=>(AUTH.coach&&AUTH.coach.name)||'Coach Soroush';
const coachFirst=()=>coachName().trim().split(/\s+/)[0]||'Coach';
const coachEmail=()=>(AUTH.coach&&AUTH.coach.email)||'soroush@coachos.app';
let WS_OWNER=''; // coach display name carried inside the workspace payload
const wsOwnerName=()=>WS_OWNER||coachName();
/* Full cloud-state reset — MUST run whenever the active account changes,
   otherwise the next coach's sync keeps targeting the previous coach's
   workspace (403 foreign) and pulls foreign data over local rows. */
function cloudReset(){
  CLOUD.on=false;CLOUD.code='';CLOUD.rev=0;CLOUD.dirty=false;CLOUD.started=false;
  clearTimeout(CLOUD.pushT);
  // The 7s poll used to be started with a bare setInterval() and never cleared,
  // so every sign-out/sign-in left another live interval behind — N accounts
  // meant N × /api/data GETs every 7 seconds, forever, in a long-lived PWA.
  clearInterval(CLOUD.pollT);CLOUD.pollT=null;
  // Preserve the pre-account workspace code before dropping it: the one-time
  // /api/auth/claim import in the bootstrap reads it, and this reset used to
  // delete it, making that import permanently unreachable.
  try{
    const legacy=localStorage.getItem('co-ws');
    if(legacy&&!localStorage.getItem('co-legacy-ws'))localStorage.setItem('co-legacy-ws',legacy);
    localStorage.removeItem('co-ws');
  }catch(e){}
}
/* Empty in-memory workspace — used when a NEW account is created so coaches
   start clean instead of inheriting the demo seed (which also instantly
   exceeds the trial quota and silently blocks adding clients). */
function freshWorkspace(){
  CLIENTS.length=0;EVENTS.length=0;NOTES.length=0;MSGS.length=0;TEMPLATES.length=0;
  FILES.length=0;BUILDER.length=0;NPLANS.length=0;MTPL.length=0;PTPL.length=0;
  NHIST.length=0;ACTIVITY.length=0;NOTIFS.length=0;PACKS.length=0;MSGTPL.length=0;
  CEXS.length=0;syncCustomEx();
  // v18.9.1 — a new coach still needs a usable nutrition library: the 20
  // starter foods + meal/plan templates. FOODS used to stay EMPTY here, so
  // "Create Nutrition Plan" seeded meals referencing FOODS[fi] entries that
  // did not exist — the planner crashed and the food picker was blank.
  FOODS.length=0;
  defaultFoods().forEach(f=>FOODS.push(f));
  defaultMtpl().forEach(x=>MTPL.push(x));
  defaultPtpl().forEach(x=>PTPL.push(x));
  ONBOARD={done:false};
  Object.keys(DB).forEach(k=>delete DB[k]);
  Object.keys(DEAD).forEach(k=>DEAD[k].length=0);
  S.cid=1;S.pickCid=1;S.msgThread=null;S.nplan=0;
}
async function authApi(path,opts){
  const o=opts||{};
  o.headers=Object.assign({'content-type':'application/json'},authHeaders(),o.headers||{});
  const r=await fetch(path,o);
  let d=null;try{d=await r.json()}catch(e){}
  return {status:r.status,ok:r.ok,d};
}

async function authLogout(){
  // Flush pending local edits BEFORE tearing down the sync target — a quick
  // add-client → sign-out otherwise loses them (cloudReset drops the dirty
  // flag and the next account's adoptAccount wipes the local bytes).
  if(CLOUD.on&&CLOUD.dirty){try{await cloudPush()}catch(e){}}
  try{if(AUTH.token)await authApi('/api/auth/logout',{method:'POST'})}catch(e){}
  authSet('');AUTH.coach=null;AUTH.ws=null;AUTH.access=null;
  cloudReset(); // never let the next session reuse this tenant's sync target
  // Admin/billing state belongs to the signed-out account — clear it so a
  // different account on this device never sees stale rows.
  BILL.info=null;BILL.quota=null;BILL.adminCoaches=null;BILL.adminLoaded=false;BILL.adminError=null;BILL.redeemCode='';
}

  // which used to be shown for every unmapped error (including 429s).

/* ============ CLOUD SYNC (API + SQLite/Postgres KV) ============ */
/* یک کد = یک فضای کاری مشترک. دستگاه مربی هنگام ورود می‌سازد؛ شاگرد با همان کد وصل می‌شود. */
const CLOUD={on:false,code:'',rev:0,dirty:false,pushT:null,pollT:null,started:false};
const cloudPack=()=>({v:13,ownerName:wsOwnerName(),CLIENTS,EVENTS,NOTES,MSGS,TEMPLATES,FILES,BUILDER,NPLANS,MTPL,PTPL,NHIST,ACTIVITY,NOTIFS,FOODS,PACKS,MSGTPL,EXVID,COACH_PIC,ONBOARD,CEXS,DB:packDB(),DEAD});
const markDead=(k,v)=>{if(DEAD[k])DEAD[k].push(String(v))};
const cloudFetch=async (code,rev)=>{
  try{
    const r=await fetch('/api/data?code='+encodeURIComponent(code)+(rev?'&rev='+encodeURIComponent(rev):''),{headers:authHeaders()});
    if(!r.ok)return null;return await r.json()
  }
  catch(e){return null}
};
const cloudPut=async data=>{
  try{
    const r=await fetch('/api/data?code='+encodeURIComponent(CLOUD.code),{method:'PUT',headers:Object.assign({'content-type':'application/json'},authHeaders()),body:JSON.stringify({rev:CLOUD.rev,data})});
    const o=await r.json();
    if(r.ok&&o.ok){CLOUD.rev=o.rev;return true}
    if(r.status===409){CLOUD.rev=o.rev||0;CLOUD.dirty=true}
    // Phase-2: server is authoritative on quota/subscription — surface it once.
    if(r.status===402){
      CLOUD.dirty=false;
      if(AUTH.token){
        billRefresh();
        // Branch on the actual server code: 'sub-suspended' and 'quota-exceeded'
        // both fell into the quota message before, telling a suspended coach to
        // "upgrade your plan or archive a client".
        toast(t(o.error==='sub-expired'
          ?'Subscription expired — renew to keep syncing (data is safe, read-only)'
          :o.error==='sub-suspended'
            ?'Access suspended — contact support (data is safe, read-only)'
            :'Client limit reached — upgrade your plan or archive a client'));
      }
      return false;
    }
    // Phase-1 tenant guard: never loop on a rejected write. Anonymous devices
    // stay silent (a student tablet must not nag); the coach sees the reason.
    if(r.status===403){CLOUD.dirty=false;if(AUTH.token)toast(t('Sync blocked: '+(o.error||'forbidden')))}
    return false;
  }catch(e){CLOUD.dirty=true;return false}
};
function cloudMerge(d,adopt){
  if(!d||typeof d!=='object')return false;
  let ch=false;const take=!!adopt&&!CLOUD.dirty;let __cexChanged=false;
  // The coach's display name rides the payload so CLIENT devices can greet
  // the right coach (they have no account of their own).
  if(typeof d.ownerName==='string'&&d.ownerName.trim()&&d.ownerName!==WS_OWNER){WS_OWNER=d.ownerName;ch=true}
  Object.keys(DEAD).forEach(k=>{const set=new Set(DEAD[k].map(String));((d.DEAD||{})[k]||[]).forEach(x=>{const s=String(x);if(!set.has(s)){set.add(s);DEAD[k].push(s);ch=true}})});
  const deadSets={};Object.keys(DEAD).forEach(k=>deadSets[k]=new Set(DEAD[k].map(String)));
  ['CLIENTS','EVENTS','MSGS','NOTES','NPLANS','TEMPLATES','MTPL','PTPL','FOODS','FILES','PACKS','MSGTPL'].forEach(k=>{if(!deadSets[k])deadSets[k]=new Set()});
  // CLIENTS — union by id; on pull adopt server profile fields, progress = max
  {for(let i=CLIENTS.length-1;i>=0;i--){const c=CLIENTS[i];if(c&&c.id!=null&&deadSets.CLIENTS.has(String(c.id))){if(DB[c.id])delete DB[c.id];CLIENTS.splice(i,1);ch=true}}
   const idx={};CLIENTS.forEach((c,i)=>{if(c&&c.id!=null)idx[String(c.id)]=i});
   (d.CLIENTS||[]).forEach(rc=>{
     if(rc.id==null||deadSets.CLIENTS.has(String(rc.id)))return;
     const i=idx[String(rc.id)];
     if(i===undefined){CLIENTS.push(rc);idx[String(rc.id)]=CLIENTS.length-1;ch=true}
     else if(take){const loc=CLIENTS[i];
       ['name','goal','prog','status','freq','next','nextW','last','email','weight','bf','h','targetW','targetDate','startW'].forEach(f=>{if(rc[f]!==undefined&&rc[f]!==loc[f]){loc[f]=rc[f];ch=true}});
       // Intake answers are an OBJECT — compared by content, never by identity,
       // or every pull would see a fresh parse and loop the sync dirty flag.
       if(rc.intake&&JSON.stringify(rc.intake)!==JSON.stringify(loc.intake||null)){loc.intake=rc.intake;ch=true}
       ['done','missed','streak','week'].forEach(f=>{if(typeof rc[f]==='number'&&rc[f]>(loc[f]||0)){loc[f]=rc[f];ch=true}});
     }})}
   if(ch)CLIENTS.sort((a,b)=>(b.id||0)-(a.id||0)); // identical order on every device (newest first)
  // EVENTS / MSGS / NOTES / NPLANS / PACKS — union by id (NOTES & NPLANS stay newest-first)
  [['EVENTS',EVENTS],['MSGS',MSGS],['NOTES',NOTES],['NPLANS',NPLANS],['PACKS',PACKS]].forEach(([k,arr])=>{
    for(let i=arr.length-1;i>=0;i--){const x=arr[i];if(x&&x.id!=null&&deadSets[k].has(String(x.id))){arr.splice(i,1);ch=true}}
    const idx={};arr.forEach((x,i)=>{if(x&&x.id!=null)idx[String(x.id)]=i});
    (d[k]||[]).forEach(rc=>{
      if(rc.id==null||deadSets[k].has(String(rc.id)))return;
      const i=idx[String(rc.id)];
      if(i===undefined){arr.push(rc);idx[String(rc.id)]=arr.length-1;ch=true}
      else if(take&&k==='EVENTS'){const loc=arr[i];if(rc.att&&!loc.att){loc.att=rc.att;ch=true}}
    });
    if(k==='NOTES'||k==='NPLANS')arr.sort((a,b)=>(b.id||0)-(a.id||0));
  });
  // name-keyed stores
  [['TEMPLATES',TEMPLATES],['MTPL',MTPL],['PTPL',PTPL],['FOODS',FOODS],['FILES',FILES],['MSGTPL',MSGTPL]].forEach(([k,arr])=>{
    for(let i=arr.length-1;i>=0;i--){const x=arr[i];if(x&&x.n!=null&&deadSets[k].has(String(x.n))){arr.splice(i,1);ch=true}}
    const set=new Set(arr.map(x=>x&&x.n));
    (d[k]||[]).forEach(rc=>{
      if(!rc||rc.n==null||deadSets[k].has(String(rc.n)))return;
      if(!set.has(rc.n)){arr.push(rc);set.add(rc.n);ch=true}
    });
  });
  // append-only logs — dedupe by JSON
  [['NHIST',NHIST],['ACTIVITY',ACTIVITY],['NOTIFS',NOTIFS]].forEach(([k,arr])=>{
    const set=new Set(arr.map(x=>JSON.stringify(x)));
    (d[k]||[]).forEach(x=>{const s=JSON.stringify(x);if(!set.has(s)){arr.push(x);set.add(s);ch=true}});
  });
  /* v18.9 — these fields used to be PUSH-ONLY (cloudMerge never read them),
     so a second device never saw the video bank, the coach photo, the builder
     draft or new progress photos. All merge now: */
  if(d.EXVID&&typeof d.EXVID==='object'&&!Array.isArray(d.EXVID)){
    Object.keys(d.EXVID).forEach(k=>{if(EXVID[k]===undefined){EXVID[k]=d.EXVID[k];ch=true}});
  }
  if(!COACH_PIC&&typeof d.COACH_PIC==='string'&&d.COACH_PIC){COACH_PIC=d.COACH_PIC;ch=true}
  if(Array.isArray(d.BUILDER)&&d.BUILDER.length&&!BUILDER.length){d.BUILDER.forEach(x=>BUILDER.push(x));ch=true}
  // custom exercises — id-union; ids are time-based so id-order is identical
  // on every device (EXERCISES indexes must stay deterministic)
  if(Array.isArray(d.CEXS)){
    const xidx={};CEXS.forEach((x,i)=>{if(x&&x.id!=null)xidx[x.id]=i});
    d.CEXS.forEach(x=>{
      if(!x||x.id==null||deadSets.CEXS.has(String(x.id)))return;
      if(xidx[x.id]===undefined){CEXS.push(x);xidx[x.id]=CEXS.length-1;ch=true;__cexChanged=true}
    });
  }
  // onboarding answers — the coach's own device wins only while local is
  // unfinished; once done:true anywhere, it propagates everywhere.
  if(d.ONBOARD&&typeof d.ONBOARD==='object'&&(d.ONBOARD.done||!ONBOARD.done)&&JSON.stringify(d.ONBOARD)!==JSON.stringify(ONBOARD)){ONBOARD=d.ONBOARD;ch=true}
  // DB — per client
  Object.keys(d.DB||{}).forEach(cid=>{
    const L=DB[cid],R=d.DB[cid];if(!R)return;
    if(!L){DB[cid]=R;ch=true;return}
    const widx={};(L.workouts||[]).forEach((w,i)=>{if(w&&w.id!=null)widx[w.id]=i});
    (R.workouts||[]).forEach(w=>{

  cloudReset();

  CLOUD.on=true;cloudStart();

/* Session packs: attending a session consumes one from the client's oldest
   pack with remaining sessions; un-marking refunds it (tracked via ev.packId
   so a re-mark never double-charges). */
function packCharge(ev,was){
  if(ev.type!=='session')return;
  if(ev.att==='done'&&!ev.packId){
    const p=PACKS.filter(x=>x.client===ev.client&&x.total-x.used>0).sort((a,b)=>a.createdAt-b.createdAt)[0];
    if(p){p.used++;ev.packId=p.id}
  }else if(was==='done'&&ev.att!=='done'&&ev.packId){
    const p=PACKS.find(x=>x.id===ev.packId);
    if(p&&p.used>0)p.used--;
    ev.packId=undefined;
  }
}

function vCAttend(){
  const c=client(S.cid);

/* The workout builder is ALWAYS scoped to the selected client: switching
   clients loads THAT client's current program (or an empty builder), so one
   client's program can never leak into another's. */
function loadClientProgram(cid){
  const c=CLIENTS.find(x=>x.id===cid);if(!c)return;
  const ws=(DB[cid]&&DB[cid].workouts)||[];
  const cur=ws[0]; // newest first (b-save unshifts)
  if(cur&&cur.exercises&&cur.exercises.length){
    BUILDER.length=0;cur.exercises.forEach(x=>BUILDER.push({...x}));
    S.wname=cur.name+' — '+c.name;
    S.wday=cur.day||'Monday';S.wdur=cur.dur||'60 min';S.wnote=cur.note||'';
  }else{
    BUILDER.length=0;
    S.wname='New Workout — '+c.name;
    S.wday='Monday';S.wdur='60 min';S.wnote='';
  }
}

function vMeasure(){

        ${(()=>{const tag=({Front:'front',Back:'back',Side:'side'})[S.pose]||'front';
          const inPose=photos.filter(p=>p.tag===tag).sort((a,b)=>a.id-b.id);

function icsExport(){
  const pad=n=>String(n).padStart(2,'0');
  const dstr=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  // Minutes were clamped to 45 and snapped to 15-minute steps, so a 09:50 or
  // 09:05 session exported as 09:45. Keep the hour and round the real minutes.
  const tstr=t2=>{const h=Math.min(23,Math.floor(t2)),m=(t2-h)*60;return `${pad(h)}${pad(Math.min(59,Math.round(m)))}00`};
  let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CoachMint//Calendar//EN','CALSCALE:GREGORIAN'];
  EVENTS.forEach(ev=>{
    const d=dayDate(ev.day,0);
    const endH=Math.min(23.98,ev.start+ev.dur);
    out.push('BEGIN:VEVENT',`UID:co-os-${ev.id}@coachos`,
      `DTSTART:${dstr(d)}T${tstr(ev.start)}`,
      `DTEND:${dstr(d)}T${tstr(endH)}`,
      `SUMMARY:${ev.label} — ${ev.client}`,'END:VEVENT');
  });
  out.push('END:VCALENDAR');
  const blob=new Blob([out.join('\r\n')],{type:'text/calendar'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='coachmint-calendar.ics';a.click();
  toast('Calendar exported (.ics)');
}

/* ===== QR code — fully self-contained =====
   Compact byte-mode QR encoder adapted from Project Nayuki's qrcodegen (MIT).
   Only what this app needs: byte mode, ECC level M, versions 1..10 (join links
   are ~50 chars → version 4). No external CDN: the app CSP allows 'self' +
   inline scripts only, so the encoder lives here. Rendered as inline SVG
   (crisp at any size, works in print, no canvas taint). */
const QR=(()=>{
  /* ECC M tables, versions 1..10: codewords per block / block count */
  const ECC=[0,10,16,26,18,24,16,18,22,22,26],NB=[0,1,1,1,2,2,4,4,4,5,5];
  /* GF(256) exp/log tables, polynomial 0x11D */
  const EXP=new Uint8Array(512),LOG=new Uint8Array(256);
  for(let i=0,x=1;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&0x100)x^=0x11D}
  for(let i=255;i<512;i++)EXP[i]=EXP[i-255];
  const mul=(a,b)=>a&&b?EXP[LOG[a]+LOG[b]]:0;
  const rsDiv=deg=>{const r=Array(deg).fill(0);r[deg-1]=1;let root=1;
    for(let i=0;i<deg;i++){for(let j=0;j<deg;j++){r[j]=mul(r[j],root);if(j+1<deg)r[j]^=r[j+1]}root=mul(root,2)}
    return r};
  const rsRem=(data,div)=>{const res=div.map(()=>0);
    for(const b of data){const f=b^res.shift();res.push(0);div.forEach((c,i)=>res[i]^=mul(c,f))}
    return res};
  const rawModules=v=>{let r=(16*v+128)*v+64;
    if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
  const dataCW=v=>Math.floor(rawModules(v)/8)-ECC[v]*NB[v];
  const interleave=(v,data)=>{const nb=NB[v],el=ECC[v];
    const raw=Math.floor(rawModules(v)/8),short=Math.floor(raw/nb),nShort=nb-raw%nb;
    const div=rsDiv(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){const len=short-el+(i<nShort?0:1);
      const dat=data.slice(k,k+len);k+=len;
      const ecc=rsRem(dat,div),blk=dat.concat(ecc);
      if(i<nShort)blk.splice(dat.length,0,0); /* pad byte sits before ecc */
      blocks.push(blk)}
    const out=[];
    for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!=short-el||j>=nShort)out.push(b[i])});
    return out};
  const make=text=>{
    const bytes=[...new TextEncoder().encode(String(text))];
    let ver=0;
    for(let v=1;v<=10;v++){if(4+(v<10?8:16)+8*bytes.length<=dataCW(v)*8){ver=v;break}}
    if(!ver)throw new Error('qr-too-long');
    const bits=[],put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1)};
    put(4,4);put(bytes.length,ver<10?8:16); /* byte mode + count */
    bytes.forEach(b=>put(b,8));
    const cap=dataCW(ver)*8;
    put(0,Math.min(4,cap-bits.length)); /* terminator */
    while(bits.length%8)bits.push(0);
    const dcw=dataCW(ver),data=[];
    for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
    for(let p=0xEC;data.length<dcw;p^=0xEC^0x11)data.push(p);
    const all=interleave(ver,data);
    const size=ver*4+17;
    const mod=Array.from({length:size},()=>Array(size).fill(false));
    const fn=Array.from({length:size},()=>Array(size).fill(false));
    const set=(x,y,c)=>{mod[y][x]=c;fn[y][x]=true};
    const finder=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){
      const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;
      if(xx>=0&&xx<size&&yy>=0&&yy<size)set(xx,yy,d!=2&&d!=4)}};
    const align=(x,y)=>{for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)
      set(x+dx,y+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)};
    const drawFmt=mask=>{const d=mask;let rem=d; /* ECL M format bits = 0 */
      for(let i=0;i<10;i++)rem=(rem<<1)^((rem>>>9)*0x537);
      const b=(d<<10|rem)^0x5412;
      for(let i=0;i<=5;i++)set(8,i,(b>>>i)&1);
      set(8,7,(b>>>6)&1);set(8,8,(b>>>7)&1);set(7,8,(b>>>8)&1);
      for(let i=9;i<15;i++)set(14-i,8,(b>>>i)&1);
      for(let i=0;i<8;i++)set(size-1-i,8,(b>>>i)&1);
      for(let i=8;i<15;i++)set(8,size-15+i,(b>>>i)&1);
      set(8,size-8,true)};
    const drawVer=()=>{if(ver<7)return;let rem=ver;
      for(let i=0;i<12;i++)rem=(rem<<1)^((rem>>>11)*0x1F25);
      const b=ver<<12|rem;
      for(let i=0;i<18;i++){const c=(b>>>i)&1,a=size-11+i%3,q=Math.floor(i/3);
        set(a,q,c);set(q,a,c)}};
    for(let i=0;i<size;i++){set(6,i,i%2==0);set(i,6,i%2==0)} /* timing */
    finder(3,3);finder(size-4,3);finder(3,size-4);
    const ap=[6];
    if(ver>=2){const n=Math.floor(ver/7)+2,st=Math.ceil((ver*4+4)/(n*2-2))*2;
      for(let pos=size-7;ap.length<n;pos-=st)ap.splice(1,0,pos)}
    for(let i=0;i<ap.length;i++)for(let j=0;j<ap.length;j++)
      if(!(i==0&&j==0||i==0&&j==ap.length-1||i==ap.length-1&&j==0))align(ap[i],ap[j]);
    drawFmt(0);drawVer();
    let bi=0; /* zigzag codeword placement */
    for(let right=size-1;right>=1;right-=2){
      if(right==6)right=5;
      for(let vt=0;vt<size;vt++)for(let j=0;j<2;j++){
        const x=right-j,up=((right+1)&2)==0,y=up?size-1-vt:vt;
        if(!fn[y][x]&&bi<all.length*8){mod[y][x]=((all[bi>>>3]>>>(7-(bi&7)))&1)==1;bi++}}}
    const inv=(m,x,y)=>m==0?(x+y)%2==0:m==1?y%2==0:m==2?x%3==0:m==3?(x+y)%3==0
      :m==4?(Math.floor(x/3)+Math.floor(y/2))%2==0:m==5?(x*y%2+x*y%3)==0
      :m==6?(x*y%2+x*y%3)%2==0:((x+y)%2+x*y%3)%2==0;
    const applyMask=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)
      if(!fn[y][x]&&inv(m,x,y))mod[y][x]=!mod[y][x]};
    const addHist=(run,h)=>{if(h[0]==0)run+=size;h.pop();h.unshift(run)};
    const countPat=h=>{const n=h[1],core=n>0&&h[2]==n&&h[3]==n*3&&h[4]==n&&h[5]==n;
      return (core&&h[0]>=n*4&&h[6]>=n?1:0)+(core&&h[6]>=n*4&&h[0]>=n?1:0)};
    const term=(color,run,h)=>{if(color){addHist(run,h);run=0}run+=size;addHist(run,h);return countPat(h)};
    const penalty=()=>{let res=0;
      for(let y=0;y<size;y++){let rc=false,rx=0;const h=[0];
        for(let x=0;x<size;x++){if(mod[y][x]==rc){rx++;if(rx==5)res+=3;else if(rx>5)res++}
          else{addHist(rx,h);if(!rc)res+=countPat(h)*40;rc=mod[y][x];rx=1}}
        res+=term(rc,rx,h)*40}
      for(let x=0;x<size;x++){let rc=false,ry=0;const h=[0];
        for(let y=0;y<size;y++){if(mod[y][x]==rc){ry++;if(ry==5)res+=3;else if(ry>5)res++}
          else{addHist(ry,h);if(!rc)res+=countPat(h)*40;rc=mod[y][x];ry=1}}
        res+=term(rc,ry,h)*40}
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=mod[y][x];
        if(c==mod[y][x+1]&&c==mod[y+1][x]&&c==mod[y+1][x+1])res+=3}
      let dark=0;for(const row of mod)for(const c of row)if(c)dark++;
      const k=Math.ceil(Math.abs(dark*20-size*size*10)/(size*size))-1;
      return res+k*10};
    let best=0,bestScore=Infinity;
    for(let m=0;m<8;m++){applyMask(m);drawFmt(m);const s=penalty();
      if(s<bestScore){bestScore=s;best=m}applyMask(m)} /* second apply undoes */
    applyMask(best);drawFmt(best);
    return mod};
  return {make};
})();
const qrSvg=(text,px)=>{
  let m;try{m=QR.make(text)}catch(e){return ''}
  const n=m.length;let path='';
  m.forEach((row,y)=>row.forEach((v,x)=>{if(v)path+=`M${x} ${y}h1v1h-1z`}));

     so phone cameras scan it in both app themes. */
  return `<svg viewBox="-4 -4 ${n+8} ${n+8}" width="${px}" height="${px}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect x="-4" y="-4" width="${n+8}" height="${n+8}" fill="#fff"/><path d="${path}" fill="#161c04"/></svg>`;
};

/* v18.9 — REAL file storage: small documents ride the workspace payload as
   data URLs (≤300 KB/file, ≤1 MB total — the server payload cap is 5 MB and
   progress photos share it). Preview for images, download for everything. */
const FILE_MAX=300*1024,FILES_TOTAL=1024*1024;
const fileTotalBytes=()=>FILES.reduce((a,f)=>a+(f.src?f.src.length:0),0);
const fileTypeOf=n=>/\.pdf$/i.test(n)?'PDF':/\.(png|jpe?g|gif|webp|avif)$/i.test(n)?'Image':/\.(zip|rar|7z|tar|gz)$/i.test(n)?'Archive':'Document';
const fileSizeLbl=b=>b<1024?nf(b)+' B':b<1048576?nf(Math.round(b/1024))+' KB':nf(Math.round(b/1048576*10)/10)+' MB';
function filesAdd(list){
  list.forEach(f=>{
    if(f.size>FILE_MAX){toast(t('File too large — max 300 KB per file')+' ('+f.name+')');return}
    if(fileTotalBytes()+Math.ceil(f.size*4/3)>FILES_TOTAL){toast(t('File storage is full — delete some files first'));return}
    const rd=new FileReader();
    rd.onload=()=>{
      FILES.push({n:f.name,t:fileTypeOf(f.name),d:fmtShortDate(new Date()),s:fileSizeLbl(f.size),src:rd.result,mime:f.type||''});
      saveData();render();toast(t('File uploaded ✓'));
    };
    rd.readAsDataURL(f);
  });
}
window.fileDrop=ev=>{ev.preventDefault();const fs=ev.dataTransfer&&ev.dataTransfer.files;if(fs&&fs.length)filesAdd([...fs])};
function fileViewModal(f){
  const img=f.src&&/^image\//.test(f.mime||'')||f.src&&/\.(png|jpe?g|gif|webp|avif)$/i.test(f.n);

let restIv=null;
function startRest(sec){
  if(!sec||!S.player)return;
  S.player.rest=sec;S.player.restTotal=sec;clearInterval(restIv);
  restIv=setInterval(()=>{
    const elN=document.getElementById('restNum');
    if(!elN||!S.player){clearInterval(restIv);return}
    S.player.rest--;
    elN.textContent=nf(fmtMS(Math.max(0,S.player.rest)));
    const f=document.getElementById('restFill');
    if(f)f.style.width=(S.player.rest/S.player.restTotal*100)+'%';
    if(S.player.rest<=0)clearInterval(restIv);
  },1000);
}

function saveMeasurementFromModal(requireWeight){
  const cid=+$('ms-client').value;const c=CLIENTS.find(x=>x.id===cid);if(!c)return null;
  const d=$('ms-date').value||'2026-07-08';
  const cvt=id=>{const raw=$('ms-'+id).value;if(raw==='')return null;const n=parseFloat(raw);
    return id==='w'?wToKg(n):(id==='bf'?n:lToCm(n))};
  const e={d,w:cvt('w'),ht:cvt('ht'),bf:cvt('bf'),ch:cvt('ch'),wa:cvt('wa'),hi:cvt('hi'),ar:cvt('ar'),th:cvt('th'),ca:cvt('ca')};
  if(e.w==null){if(requireWeight)toast('Weight is required');return null}
  DB[cid].measures=DB[cid].measures||[];
  DB[cid].measures.push(e);
  DB[cid].measures.sort((x,y)=>x.d<y.d?-1:1);
  if(e.w!=null)c.weight=e.w;
  if(e.bf!=null)c.bf=e.bf;
  if(e.ht!=null)c.h=e.ht;
  ACTIVITY.unshift({w:'Just now',i:'ruler',h:lang==='fa'?`<b>شما</b> برای <b>${t(c.name)}</b> اندازه‌گیری ثبت کردید`:`<b>You</b> logged a measurement for <b>${t(c.name)}</b>`});
  return c;
}

function paletteData(){return [

  ...TEMPLATES.map(tp=>({g:'Templates',i:'stack',t:tp.n,s:`${nf(tplExN(tp))} ${t('exercises')} · ${t(tp.dur)}`,run:()=>{S.role='coach';S.view='templates';closePal()}})),
  ...EXERCISES.slice(0,8).map(e=>({g:'Exercises',i:'dumbbell',t:t(e.n),s:`${tmus(e.m)} · ${t(e.e)}`,run:()=>{S.role='coach';S.view='library';closePal()}})),
  ...NOTES.map(n=>({g:'Notes',i:'note',t:t(n.title),s:t(n.client),run:()=>{S.role='coach';S.view='notes';closePal()}})),
  ...FILES.map(f=>({g:'Files',i:'folder',t:t(f.n),s:`${t(f.t)} · ${f.s}`,run:()=>{S.role='coach';S.view='wspace';S.tab='files';closePal()}}))
]}
function renderPal(q=''){
  const data=paletteData().filter(x=>!q||x.t.toLowerCase().includes(q.toLowerCase())||x.s.toLowerCase().includes(q.toLowerCase()));
  palItems=data;palIdx=Math.min(palIdx,Math.max(0,data.length-1));
  let last='',html='';
  data.forEach((x,i)=>{if(x.g!==last){html+=`<div class="pal-sec">${t(x.g)}</div>`;last=x.g}
    html+=`<div class="pal-it ${i===palIdx?'sel':''}" data-pi="${i}">${ic(x.i,16)}<span>${esc(x.t)}</span><span class="muted" style="font-size:12px">${esc(x.s)}</span><span class="arrow">${ic('arrowR',13)}</span></div>`});
  $('pal-root').innerHTML=`<div class="pal" data-act="pal-x"><div class="pal-box" onclick="event.stopPropagation()">
    <div class="pal-in">${ic('search',18)}<input id="pal-q" placeholder="${t('Search clients, workouts, templates, exercises, notes, files…')}"><kbd>ESC</kbd></div>
    <div class="pal-res" id="pal-res">${html||`<div style="padding:34px;text-align:center;color:var(--ink3)">${t('No results found.')}</div>`}</div>
  </div></div>`;
  const inp=$('pal-q');if(inp){inp.value=q;
  inp.addEventListener('input',()=>{palIdx=0;renderPal(inp.value)});
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();palIdx=Math.min(palIdx+1,palItems.length-1);renderPal(inp.value)}
    if(e.key==='ArrowUp'){e.preventDefault();palIdx=Math.max(palIdx-1,0);renderPal(inp.value)}
    if(e.key==='Enter'&&palItems[palIdx]){palItems[palIdx].run();render()}
  });inp.focus();}
  $('pal-res')?.querySelectorAll('[data-pi]').forEach(el=>el.addEventListener('click',()=>{palItems[+el.dataset.pi].run();render()}));
}
const closePal=()=>$('pal-root').innerHTML='';
const openPal=()=>{palIdx=0;renderPal()};

(async()=>{ // Phase-1 bootstrap: session first, then tenant-owned code
  try{
    if(AUTH.token)await authMe();
    // v16.4 — the local payload must belong to the signed-in coach. On a
    // shared device (or two tabs) STORE_KEY may still hold the PREVIOUS
    // coach's clients; without this wipe the first sync pushes them into this
    // coach's workspace (the exact cross-tenant leak adoptAccount fixes at
    // login — this covers the reload path too).
    if(AUTH.coach)adoptAccount(AUTH.coach);
    // Session resume: a valid stored token (a buyer who just signed up on the
    // shop and tapped "Open the app", or a returning coach reloading) goes
    // straight into the workspace instead of role-chooser → login form.
    // authMe() above already validated the token — a dead/expired one leaves
    // AUTH.coach null and the normal login screen shows. Skipped for reset
    // links and client join links, which need their own screens.
    if(AUTH.coach&&!S.joinCode&&!S.resetToken){
      S.role='coach';S.view=ONBOARD.done?landingView():'dash';
    }
    let join=null;try{join=JSON.parse(localStorage.getItem('co-join')||'null')}catch(e){}
    // A signed-in coach always syncs their OWN workspace — never a stale code.
    let code=(AUTH.coach&&AUTH.ws&&AUTH.ws.code)?AUTH.ws.code:'';
    try{
      // `co-legacy-ws` holds the pre-account anonymous code that cloudReset()
      // parks before clearing `co-ws` on sign-in (see cloudReset()).
      const saved=(localStorage.getItem('co-legacy-ws')||localStorage.getItem('co-ws')||'').toUpperCase().trim();
      // Fall back to a parked code ONLY when it cannot belong to someone else:
      // an anonymous device (no token), or an authenticated coach with no
      // workspace (legacy claim). A token whose authMe FAILED must never sync
      // into a parked code — it may be the previous coach's workspace.
      if(!code&&(!AUTH.token||(AUTH.coach&&!AUTH.ws)))code=saved;
      // One-time legacy import: an old anonymous device code moves under the
      // coach's tenant on first authenticated push (server binds ownership).
      if(code&&AUTH.coach&&(!AUTH.ws||!AUTH.ws.code)&&saved){
        try{
          await authApi('/api/auth/claim',{method:'POST',body:JSON.stringify({legacyCode:saved})});
          const m=await authMe();
          if(m&&AUTH.ws&&AUTH.ws.code){code=AUTH.ws.code;try{localStorage.removeItem('co-legacy-ws')}catch(e){}}
        }catch(e){}
      }
    }catch(e){}
    if(!code&&join&&join.code)code=String(join.code).toUpperCase();
    if(code&&/^https?:$/.test(location.protocol)){
      const out=await cloudFetch(code);
      if(out&&out.ok){
        CLOUD.code=code;CLOUD.on=true;
        if(join){S.joinCode=join.pcode||code;if(join.cid)S.pickCid=join.cid}
        if(out.data){CLOUD.rev=out.rev||0;cloudMerge(out.data,true);cloudResync()}
        else if(!await cloudPut(cloudPack())){CLOUD.dirty=true;cloudSchedule(2000)}
      }
    }
  }catch(e){}
  render();
  cloudStart();
  // A coach who arrived through a resumed session (e.g. straight from the shop
  // signup) still gets the onboarding wizard if their workspace never finished
  // it. Called AFTER the cloud merge so ONBOARD.done reflects the server state
  // (a returning coach must not be re-nagged); the 600ms internal delay also
  // re-checks it. Anonymous/demo boots return immediately (no token).
  maybeOnboard();
})();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
  /* When a NEW service worker takes control (a fresh deploy), reload ONCE so
     the running shell matches the served code — otherwise the user keeps the
     old UI until their next manual reload. The sessionStorage guard prevents
     reload loops; it is cleared on every fresh boot, so future deploys still
     trigger exactly one refresh. */
  try{sessionStorage.removeItem('co-sw-reload')}catch(e){}
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    try{
      if(sessionStorage.getItem('co-sw-reload'))return;
      sessionStorage.setItem('co-sw-reload','1');
      location.reload();
    }catch(e){}
  });
}
</script>
