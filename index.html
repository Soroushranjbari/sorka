<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* v18.7 — light-theme separation fix (round 2): users only saw clear section
     boundaries while a modal dimmed the page (rgba(0,0,0,.55) overlay makes
     white surfaces glow against the darkened canvas). Round 1 (#EAEAE2) was
     too subtle — the canvas is now clearly darker than the cards and the
     hairlines/shadow carry real weight, so the layout has depth un-dimmed. */
  --bg:#DDDDD0; --surface:#FFFFFF; --sidebar:#12151B;
  --ink:#15181E; --ink2:#505666; --ink3:#626875;
  /* v19.10 — AA on the surfaces they ACTUALLY sit on, not on white:
       --ink2 on --line2 (chip) was 4.12, on --bg (.sub) 4.46
       --ink3 on --seg-bg (.tbl th) was 3.97
     Measured after: 5.09 / 5.48 / 4.61. */
  /* --side3: the rail is #12151B in BOTH themes, so text on it needs its own
     token. #9AA0AE reads 6.97:1 there. Sharing --ink3 would have made the   contrast fix (above) push the brand line from 6.97 down to 3.78. */
  --side3:#9AA0AE;
  --line:#C8C8B6; --line2:#D5D5C6;
  --accent:#C8F04B; --accent-deep:#8FB51E; --accent-ink:#1A2205; --accent-soft:#F4FAE0;
  /* v19.10 — ACCENT AS TEXT needs its own token. --accent is 1.31:1 on white   and --accent-deep is 2.39:1: both are fine as FILLS and ICONS, unusable
     as glyphs. #547009 measures 5.61 on surface, 4.62 on --seg-bg. */
  --accent-text:#547009;
  /* v19.13 — the §12 key node's FILL must be theme-aware: it sits under
     --accent-text, which is dark olive on light and bright lime on dark. Using   --accent-soft here (never redefined in dark) put lime on pale lime = 2.23. */
  --accent-key:#F4FAE0;
  --acc-line:#CDE694; --acc-line2:#CFE49B; --acc-mid:#A6D437; --acc-mid2:#9CC53E; --acc-stat:#B4D95B; --acc-chip:#D8E9AF;
  --green:#16A34A; --green-soft:#E9F6EE; --red:#DC2626; --red-soft:#FDEDED;
  --amber:#C77414; --amber-soft:#FBF2E2; --blue:#2563EB; --blue-soft:#EAF1FE;
  /* v19.10 — badge TEXT: the base hues measure 2.96 / 3.18 on their own soft
     backgrounds. They stay unchanged as fills and icons; only .bdg-* text
     switches to these (4.59 / 4.60). Dark inherits both, because dark never
     redefines --green-soft/--amber-soft either. */
  --green-ink:#15803D; --amber-ink:#A15C0F;
  --purple:#7C3AED; --purple-soft:#F2EDFD;
  --glass:rgba(221,221,208,.85); --glass2:rgba(221,221,208,.92);
  --ink-bg:#15181E; --btn-dark-bg:#15181E; --btn-dark-fg:#fff;
  --row-h:#F7F7F3; --seg-bg:#E9E9E3; --seg-on:#FFFFFF; --kbd-bg:#EFEFEA; --cal-hd:#F9F9F5; --cal-alt:#F7F7F3;
  --sh-1:0 1px 2px rgba(18,21,27,.09),0 6px 18px -6px rgba(18,21,27,.16);
  --sh-2:0 12px 32px -8px rgba(18,21,27,.18);
  /* v18.121 — theme_2 tokens that the coach desktop did NOT already have.
     Deliberately NEW NAMES ONLY: nothing the other 21 screens depend on can
     shift. `.phone` re-declares --font-display, so the client app keeps its
     own value.
       --font-display : Oxanium, loaded since v18.111 (shared with the client
                        workout hero — this is what ties the two halves of the
                        product together)
       --panel-pad/-gap: both 20px on PURPOSE, so a panel's inner padding
                        equals the gutter between panels and the next column's
                        text lines up with the previous column's right edge
       --t-label/-tr  : the tracked mono caps used for every field label */
  --font-display:'Oxanium','Inter',system-ui,sans-serif;
  --panel-pad:20px;
  --panel-gap:20px;
  --t-label:700 10.5px/1 'JetBrains Mono',monospace;
  --tr-label:.14em;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
html{color-scheme:light}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1114; --surface:#171A1F; --sidebar:#0B0D10;
  --ink:#E9EAEE; --ink2:#A9AFBA; --ink3:#878F9F;
  /* v19.10 — #7E8695 measured 4.14 on --seg-bg and 4.46 on --row-h (both AA
     failures). #878F9F gives 4.65 / 5.03 while staying 5.39 on --surface. */
  --accent-text:#8FB51E;
  --accent-key:rgba(200,240,75,.10);
  --line:#2E333B; --line2:#262B33;
  --glass:rgba(15,17,20,.85); --glass2:rgba(15,17,20,.92);
  --ink-bg:#0B0D10; --btn-dark-bg:#E9EAEE; --btn-dark-fg:#12151B;
  --row-h:#1C2026; --seg-bg:#22262D; --seg-on:#2B3038; --kbd-bg:#1C2026; --cal-hd:#1B1F25; --cal-alt:#171A1F;
  --sh-1:0 1px 2px rgba(0,0,0,.5); --sh-2:0 14px 34px -10px rgba(0,0,0,.7);
}
/* ================= v18.28 — DESIGN TEMPLATE: COACHMINT =================
   Sourced from the user's Stitch project (COACHMINT Fitness Operating System).
   Material-3 token set: graphite surfaces, mint primary, JetBrains Mono metrics,
   Space Grotesk display. Scoped under html[data-tpl="coachmint"] — the default
   design stays untouched. Light + dark variants keep the Theme toggle working. */
html[data-tpl="coachmint"]{
  --bg:#E9EDE9; --surface:#FFFFFF; --sidebar:#0E120E;
  --ink:#161A16; --ink2:#4E5A50; --ink3:#849587;
  --line:#D3DAD3; --line2:#E1E6E0;
  --accent:#00C97B; --accent-deep:#008A4D; --accent-ink:#032B18; --accent-soft:#E0F6EB;
  --acc-line:#9ED2B3; --acc-line2:#BCEBDA; --acc-mid:#00B86B; --acc-mid2:#00A862; --acc-stat:#5ED9A4; --acc-chip:#CDEFDF;
  --green:#008A4D; --green-soft:#E0F6EB; --red:#C62828; --red-soft:#FDEBEA;
  --amber:#B26A00; --amber-soft:#FBF1E0; --blue:#1565C0; --blue-soft:#EAF1FB;
  --accent-text:#00704A; --green-ink:#007040; --amber-ink:#8A5200; --accent-key:#E0F6EB;
  --purple:#6A3AB2; --purple-soft:#F1EBFB;
  --glass:rgba(233,237,233,.85); --glass2:rgba(233,237,233,.92);
  --row-h:#F2F5F1; --seg-bg:#E3E8E2; --seg-on:#FFFFFF; --kbd-bg:#EEF1ED; --cal-hd:#F4F7F3; --cal-alt:#EFF2EE;
  --sh-1:0 1px 2px rgba(12,20,14,.08),0 6px 18px -6px rgba(12,20,14,.14);
  --sh-2:0 12px 32px -8px rgba(12,20,14,.18);
}
html[data-tpl="coachmint"][data-theme="dark"]{
  --bg:#0C0E10; --surface:#1A1C1E; --sidebar:#0C0E10;
  --ink:#E2E2E5; --ink2:#B9CBBC; --ink3:#849587;
  --line:#2C302D; --line2:#242725;
  --accent:#00FF9D; --accent-deep:#00E38B; --accent-ink:#00391F; --accent-soft:rgba(0,255,157,.12);
  --acc-line:rgba(0,255,157,.42); --acc-line2:rgba(0,255,157,.28); --acc-mid:#00E38B; --acc-mid2:#00C97B; --acc-stat:#56FFA8; --acc-chip:rgba(0,255,157,.16);
  --green:#00E38B; --green-soft:rgba(0,255,157,.12); --red:#FFB4AB; --red-soft:rgba(255,180,171,.12);
  --amber:#FFB871; --amber-soft:rgba(255,184,113,.12); --blue:#8AB4F8; --blue-soft:rgba(138,180,248,.12);
  --accent-text:#00E38B; --green-ink:#00E38B; --amber-ink:#FFB871; --accent-key:rgba(0,255,157,.12);
  --purple:#C9A7F5; --purple-soft:rgba(201,167,245,.12);
  --glass:rgba(12,14,16,.85); --glass2:rgba(12,14,16,.92);
  --ink-bg:#0C0E10; --btn-dark-bg:#E2E2E5; --btn-dark-fg:#121416;
  --row-h:#1E2022; --seg-bg:#282A2C; --seg-on:#333537; --kbd-bg:#1E2022; --cal-hd:#1A1C1E; --cal-alt:#16181A;
  --sh-1:0 1px 2px rgba(0,0,0,.5); --sh-2:0 14px 34px -10px rgba(0,0,0,.7);
}

   1) JetBrains Mono ships its own Arabic-block glyphs at poor quality — in FA
      every mono element puts Vazirmatn FIRST so Persian text renders clean;

   2) .eyebrow mint (#00FF9D) was unreadable on the light canvas — light theme

   3) FA mono sizes bumped (9.5px labels were too small for Persian script). */

html[lang="fa"][data-tpl="coachmint"] .bdg,html[lang="fa"][data-tpl="coachmint"] .tab,
html[lang="fa"][data-tpl="coachmint"] .fchip,html[lang="fa"][data-tpl="coachmint"] .menu-it,

   overrides padding/font-size, so a fixed height here would flatten it. */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;font-weight:700;font-size:13px;border:1px solid transparent;transition:filter .15s,transform .15s,box-shadow .15s,border-color .15s,background .15s,color .15s;white-space:nowrap}
/* v18.11 design pass — brand lime front and center: gradient primary with a
   soft glow + hover lift (both themes; accent vars adapt automatically). */
/* v18.122 — theme_2: flat lime instead of the lime→olive gradient, and the
   glow colour corrected to the accent itself (it was rgba(143,181,30) = the
   darker --acc-mid, which made the halo read muddy on the dark canvas). */
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px -10px rgba(200,240,75,.55)}.btn-primary:hover{filter:brightness(1.04);transform:translateY(-1px);box-shadow:0 10px 24px -8px rgba(200,240,75,.65)}

.btn-ghost{color:var(--ink2)}.btn-ghost:hover{background:var(--line2);color:var(--ink)}

/* v18.122 — theme_2 table head: the SAME tracked mono as every other field
   label (--t-label), a surface tint so the header separates from the rows
   without a heavier rule, and a 38px band instead of padding-driven height.

   name only exists in theme_2.css and silently resolved to transparent. */
.tbl th{height:38px;background:var(--seg-bg);font:var(--t-label);letter-spacing:var(--tr-label);text-transform:uppercase;color:var(--ink3);text-align:start;padding:0 16px;border-bottom:1px solid var(--line);white-space:nowrap}

.tbl tbody tr[data-act]:hover{background:var(--row-h)}
.tbl tbody tr[data-act]:hover td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .tbl tbody tr[data-act]:hover td:first-child{box-shadow:inset -3px 0 0 var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 20px;overflow-x:auto;scrollbar-width:none}
.tab{padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:9px 9px 0 0}
.tab:hover{color:var(--ink);background:var(--line2)}
/* v18.11 — active tab gets a soft lime wash above the underline (Linear-style) */
.tab.on{color:var(--accent-deep);border-color:var(--accent-deep);background:linear-gradient(to top,var(--accent-soft),transparent 70%)}
.mwrap{position:relative}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh-2);padding:6px;min-width:230px;z-index:80;display:none}
.mwrap.open .menu{display:block;animation:fade .12s}
.menu-it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--ink)}
.menu-it:hover{background:var(--line2)}
.menu-it .ic{color:var(--ink2)}
.menu-hd{padding:8px 10px 4px;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--ink3)}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--sh-2);width:100%;max-width:760px;max-height:90vh;display:flex;flex-direction:column;animation:pop .16s ease}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:17px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:16px}
.modal-b{padding:20px 22px;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:15px 22px;border-top:1px solid var(--line)}
.fs{margin-bottom:20px}
.fs-t{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);padding-bottom:8px;border-bottom:1px solid var(--line2);margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
/* v18.121 — theme_2: the KPI row now shares the dashboard's panel gutter
   (14 → 20px) instead of a tighter, unrelated one. */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--panel-gap);margin-bottom:20px}
.stat{padding:17px 19px;display:flex;flex-direction:column;gap:2px}
/* label → tracked mono caps (quiet, instrument-style) */
.stat .k{font:var(--t-label);letter-spacing:var(--tr-label);text-transform:uppercase;color:var(--ink3)}
/* value → Oxanium so the dashboard's numbers are DISPLAY type, not body type */
.stat .v{font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.delta{font-size:12px;font-weight:600}
.delta.up{color:var(--green)}.delta.down{color:var(--red)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:start}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.bgrid{display:grid;grid-template-columns:1fr 250px;gap:14px;align-items:start}
.sgrid{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}
.tl-row{display:flex;gap:14px;padding:13px 20px;border-bottom:1px solid var(--line2);align-items:center}
.tl-row:last-child{border-bottom:none}
.tl-row.click{cursor:pointer}
.tl-row.click:hover{background:var(--row-h)}
.tl-time{width:56px;font-weight:700;font-size:13px;color:var(--ink2);flex:none}
.act-dot{width:9px;height:9px;border-radius:50%;background:var(--accent-deep);flex:none;margin-top:5px}
.fchip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.fchip.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--acc-line)}
.seg{display:inline-flex;background:var(--seg-bg);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:var(--sh-1)}
.pbar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent-deep);border-radius:99px;transition:width .3s}
.sw{position:relative;width:38px;height:22px;flex:none;display:inline-block}
.sw input{position:absolute;opacity:0}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:background .15s;cursor:pointer}
.sw i::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;inset-inline-start:3px;top:3px;transition:inset-inline-start .15s;box-shadow:var(--sh-1)}
.sw input:checked+i{background:var(--accent-deep)}
.sw input:checked+i::after{inset-inline-start:calc(100% - 19px)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid var(--line2)}
.set-row:last-child{border-bottom:none}
.set-row .t{font-weight:600;font-size:13.5px}
.set-row .d{font-size:12.5px;color:var(--ink2);margin-top:2px}
/* v17.6 — light-theme polish: sectioning, focus, scrollbars, empty states */
.sec-t{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:900;color:var(--ink)}
.sec-t::after{content:'';flex:1;height:1px;background:var(--line)}
.sec-t .bdg{letter-spacing:0}
html[lang="fa"] .sec-t{letter-spacing:0}
.stat{transition:transform .18s,box-shadow .18s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.stat .icw{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-deep);flex:none}
button:focus-visible,[data-act]:focus-visible,a:focus-visible,.tab:focus-visible,.fchip:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px;border-radius:8px}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid var(--bg)}
*::-webkit-scrollbar-thumb:hover{background:var(--ink3)}
*::-webkit-scrollbar-track{background:transparent}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:26px 20px;text-align:center;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty b{color:var(--ink2);font-size:13.5px}
.empty .muted{font-size:12.5px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:14px}
.cgrid .card{padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.cgrid .card:hover{border-color:var(--acc-line);box-shadow:var(--sh-2);transform:translateY(-1px)}
/* v17.11 — onboarding wizard */
.onb-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.onb-opt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;text-align:start;transition:border-color .15s,background .15s;color:var(--ink)}
.onb-opt:hover{border-color:var(--ink3)}
.onb-opt.on{border-color:var(--accent-deep);background:var(--accent-soft);color:var(--accent-ink)}
.onb-dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .2s}
.onb-dot.on{background:var(--accent-deep)}
@media(max-width:520px){.onb-grid{grid-template-columns:1fr}}
.cal-grid{display:grid;grid-template-columns:56px repeat(7,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:var(--sh-1)}
.cal-hd{padding:10px 6px;text-align:center;border-bottom:1.5px solid var(--line);border-inline-start:1px solid var(--line2);background:var(--cal-hd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:background .15s}
.cal-hd.cal-hd-corner{background:var(--cal-hd);border-inline-start:none}
.cal-hd-day{font-family:'JetBrains Mono','Vazirmatn',monospace;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase}
.cal-hd-num{font-family:'Space Grotesk','Inter',sans-serif;font-size:15px;font-weight:800;color:var(--ink);width:28px;height:28px;display:grid;place-items:center;border-radius:50%;transition:background .15s,color .15s}
.cal-hd-num.cal-num-today{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 12px rgba(200,240,75,.45)}
.cal-hd.today{background:rgba(200,240,75,.05)}
.cal-hd.today .cal-hd-day{color:var(--accent-text)}
.cal-hd-count{display:inline-block;padding:1px 6px;font-size:9.5px;font-weight:800;font-family:'JetBrains Mono',monospace;border-radius:99px;background:var(--accent-soft);color:var(--accent-text);border:1px solid var(--acc-line)}
.cal-hd.click{cursor:pointer}
.cal-hd.click:hover:not(.today){background:var(--row-h)}
.cal-time{font-family:'JetBrains Mono','Vazirmatn',monospace;font-size:10.5px;font-weight:600;color:var(--ink3);text-align:end;padding:6px 8px 0 0;border-top:1px solid var(--line2);height:48px}
.cal-col{position:relative;border-inline-start:1px solid var(--line2);min-height:624px;cursor:cell;transition:background .15s}
.cal-col.cal-today-col{background:rgba(200,240,75,.035)!important;box-shadow:inset 0 2px 0 var(--accent)}
html[data-theme="light"] .cal-col.cal-today-col{background:rgba(200,240,75,.08)!important}
.cal-col.cal-weekend{background:var(--cal-alt)}
.cal-col.droptarget{background:var(--accent-soft)!important}
.ev{position:absolute;border-radius:10px;padding:6px 8px;cursor:grab;border:1px solid;line-height:1.25;overflow:hidden;box-shadow:var(--sh-1);z-index:4;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .16s cubic-bezier(.16,1,.3,1),box-shadow .16s cubic-bezier(.16,1,.3,1),filter .16s;display:flex;flex-direction:column;justify-content:space-between}
.ev:hover{transform:translateY(-2px) scale(1.012);box-shadow:0 10px 24px -4px rgba(0,0,0,.35);z-index:12}
.ev-head{display:flex;align-items:center;gap:5px;width:100%;min-width:0}
.ev-type-ic{width:13px;height:13px;display:inline-flex;align-items:center;justify-content:center;flex:none;opacity:.9}
.ev-title{font-weight:700;font-size:11.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ev-att{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:900;flex:none;margin-inline-start:auto}
.ev-att.ev-done{background:rgba(34,197,94,.22);color:#22C55E;border:1px solid rgba(34,197,94,.4)}
.ev-att.ev-miss{background:rgba(239,68,68,.22);color:#EF4444;border:1px solid rgba(239,68,68,.4)}
.ev-sub{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:10.5px;font-weight:500;opacity:.88}
.ev-avatar{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.14);font-size:8px;font-weight:800;display:inline-grid;place-items:center;flex:none;border:1px solid rgba(255,255,255,.2);font-family:'Space Grotesk',sans-serif}
.ev-client{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ev-time{font-family:'JetBrains Mono',monospace;font-size:9.5px;opacity:.75;flex:none}
.ev.ev-short{padding:3px 7px;justify-content:center}
.ev.ev-short .ev-head{gap:4px}
.ev.ev-short .ev-title{font-size:11px}
.ev.ev-short .ev-time{margin-inline-start:auto;font-size:9.5px}
/* Theme variants for event cards */
.ev-session{background:linear-gradient(145deg,rgba(200,240,75,.15),rgba(200,240,75,.06));border-color:rgba(200,240,75,.35);border-inline-start:3.5px solid var(--accent);color:var(--ink)}
html[data-theme="light"] .ev-session{background:linear-gradient(145deg,#F7FCEB,#EDF8D3);border-color:var(--acc-line);color:var(--accent-ink);border-inline-start:3.5px solid var(--accent-deep)}
.ev-assess{background:linear-gradient(145deg,rgba(37,99,235,.15),rgba(37,99,235,.06));border-color:rgba(59,130,246,.35);border-inline-start:3.5px solid #3B82F6;color:var(--ink)}
html[data-theme="light"] .ev-assess{background:linear-gradient(145deg,#F0F6FE,#E1EEFE);border-color:#BDD7FB;color:#1D4ED8;border-inline-start:3.5px solid var(--blue)}
.ev-meas{background:linear-gradient(145deg,rgba(124,58,237,.15),rgba(124,58,237,.06));border-color:rgba(168,85,247,.35);border-inline-start:3.5px solid #8B5CF6;color:var(--ink)}
html[data-theme="light"] .ev-meas{background:linear-gradient(145deg,#F6F2FD,#ECE4FC);border-color:#D7C5F9;color:#6D28D9;border-inline-start:3.5px solid var(--purple)}
.ev-appt{background:linear-gradient(145deg,rgba(217,119,6,.15),rgba(217,119,6,.06));border-color:rgba(245,158,11,.35);border-inline-start:3.5px solid #F59E0B;color:var(--ink)}
html[data-theme="light"] .ev-appt{background:linear-gradient(145deg,#FEF8EE,#FBF0DC);border-color:#F5DDAD;color:#A15C0B;border-inline-start:3.5px solid var(--amber)}
.nowline{position:absolute;inset-inline-start:0;inset-inline-end:0;height:2px;background:var(--accent);z-index:7;pointer-events:none;box-shadow:0 0 10px var(--accent)}
.nowline::before{content:'';position:absolute;inset-inline-start:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.nowline::after{content:'NOW';position:absolute;inset-inline-end:6px;top:-10px;font-size:8px;font-weight:900;letter-spacing:.08em;background:var(--accent);color:var(--accent-ink);padding:1px 6px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.calk{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.calk .card{padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(170deg,var(--surface),rgba(255,255,255,.015));transition:border-color .15s,transform .15s,box-shadow .15s}
.calk .card:hover{border-color:var(--acc-line);transform:translateY(-1px);box-shadow:var(--sh-1)}
.calk .v{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-family:'Space Grotesk','Inter',sans-serif}
/* Dashboard v19.9 — Modern Dashboard Enhancements */
.stat-trend{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;display:inline-flex;align-items:center;gap:3px;font-family:'Space Grotesk','Inter',sans-serif;letter-spacing:-.01em}
.qa-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:12px 14px}
.qa-tile{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:transform .16s cubic-bezier(.16,1,.3,1),border-color .16s,box-shadow .16s,background .16s;text-align:start;color:var(--ink);width:100%}
.qa-tile:hover{transform:translateY(-2px);border-color:var(--acc-line);box-shadow:var(--sh-1);background:var(--row-h)}
.qa-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;transition:transform .16s}
.qa-tile:hover .qa-ico{transform:scale(1.08)}
.qa-ico-accent{background:var(--accent-soft);color:var(--accent-deep)}
.qa-ico-lime{background:rgba(200,240,75,.15);color:var(--accent-deep)}
.qa-ico-blue{background:var(--blue-soft);color:var(--blue)}
.qa-ico-green{background:var(--green-soft);color:var(--green-ink)}
.qa-ico-purple{background:var(--purple-soft);color:var(--purple)}
.qa-ico-amber{background:var(--amber-soft);color:var(--amber-ink)}
.qa-lbl{font-size:12.5px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa-arrow{opacity:.35;transition:opacity .15s,transform .15s;display:flex;align-items:center;flex:none}
.qa-tile:hover .qa-arrow{opacity:1;transform:translateX(2px)}
html[dir="rtl"] .qa-tile:hover .qa-arrow{transform:translateX(-2px)}
.ret-pulse{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.ret-bar{height:8px;border-radius:99px;background:var(--line2);display:flex;overflow:hidden;gap:2px}
.ret-seg{height:100%;transition:width .3s ease}
.ret-seg-green{background:var(--green)}
.ret-seg-amber{background:var(--amber)}
.ret-seg-red{background:var(--red)}
.ret-legend{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink2)}
.ret-pill{display:flex;align-items:center;gap:5px;font-weight:600}
.ret-dot{width:7px;height:7px;border-radius:50%}
.ch-risk-pill{padding:8px 12px;border-radius:10px;background:var(--amber-soft);color:var(--amber-ink);font-size:12px;display:flex;align-items:center;gap:8px;border:1px solid rgba(245,158,11,.25)}
.ch-risk-pill.ch-safe{background:var(--green-soft);color:var(--green-ink);border-color:rgba(34,197,94,.25)}
.ai-digest-card{padding:18px 20px;border-radius:14px;border:1px solid rgba(200,240,75,.28);background:linear-gradient(155deg,rgba(200,240,75,.06),rgba(200,240,75,.015) 60%,var(--surface));position:relative;overflow:hidden;box-shadow:0 8px 24px -12px rgba(200,240,75,.15)}
.ai-digest-glow{position:absolute;top:-40px;inset-inline-end:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(200,240,75,.22),transparent 70%);pointer-events:none}
.ai-bullets{display:flex;flex-direction:column;gap:9px;margin:12px 0 14px}
.ai-bullet{display:flex;align-items:flex-start;gap:10px;font-size:12.5px;line-height:1.45;color:var(--ink)}
.ai-bullet-ic{width:20px;height:20px;border-radius:6px;background:var(--surface);display:grid;place-items:center;flex:none;box-shadow:0 1px 4px rgba(0,0,0,.15);margin-top:1px}
@media(max-width:520px){.qa-grid{grid-template-columns:1fr}}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mcal .mh{padding:10px;text-align:center;font-size:11px;font-weight:700;color:var(--ink3);border-bottom:1px solid var(--line);background:var(--cal-hd)}
.mday{min-height:100px;border-inline-start:1px solid var(--line2);border-top:1px solid var(--line2);padding:8px;font-size:12.5px;color:var(--ink2)}
.mday.today{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.mday.click{cursor:pointer;transition:background .12s}
.mday.click:hover{background:var(--row-h)}
.mdots{display:flex;gap:3px;margin-top:8px;flex-wrap:wrap}
.mdot{width:7px;height:7px;border-radius:50%}
/* v18.63 — client calendar: week-plan rows (tap → add/assign workout per day)
   + real month-grid markers for the same split. */
.wprow{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);cursor:pointer;transition:border-color .12s,background .12s;margin-bottom:8px}
.wprow:hover{border-color:var(--acc-line);background:var(--row-h)}
.wprow.today{border-color:var(--accent);background:var(--accent-soft)}
.wp-d{display:flex;flex-direction:column;align-items:center;min-width:46px;flex:none}
.wp-d b{font-size:12px;color:var(--ink2)}
.wprow.today .wp-d b{color:var(--accent-ink)}
.wp-d small{font-size:11px;color:var(--ink3);font-weight:700}
.wp-w{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wp-w i{color:var(--green);display:inline-flex;flex:none}
.wp-r{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink3)}
.wp-a{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;color:var(--accent-deep)}
.wp-s{display:flex;gap:4px;align-items:center;margin-inline-start:auto;flex:none}
.wp-c{color:var(--ink3);flex:none;display:flex}
.mcal.compact .mday{min-height:74px;padding:7px 8px}
.md-w{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:800;color:var(--accent-deep);margin-top:5px;min-width:0}
.md-w span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ================= v18.41 — CINEMATIC 3D WELCOME / UNLOCK (students) =================
   Full-screen stage that replaces the demo picker for the join flow: glowing
   padlock, orbiting rings, drifting particles, a perspective grid — and the
   portal opens by DRAGGING THE HANDLE TO THE RIGHT. --ux (0..1, set by JS)
   physically opens the shackle, spins the rings, intensifies the glow and
   tilts the scene; past the threshold the lock bursts open (shockwave + zoom)
   and the device binds to the profile. Always dark — a stage, not a form. */
.unlock{position:fixed;inset:0;z-index:6;overflow:hidden;user-select:none;-webkit-user-select:none;background:radial-gradient(120% 90% at 50% 0%,#151A24 0%,#0A0B0E 55%,#050608 100%);perspective:1100px}

.un-grid{position:absolute;inset-inline:-20%;bottom:-14%;height:48%;transform:translateZ(-170px) rotateX(62deg);background:linear-gradient(rgba(200,240,75,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(200,240,75,.14) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:linear-gradient(to top,#000 26%,transparent 90%);mask-image:linear-gradient(to top,#000 26%,transparent 90%);opacity:.55;pointer-events:none}
.un-dot{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--accent);animation:unfloat 7s ease-in-out infinite;pointer-events:none}

.un-rings{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) translateZ(40px) rotate(calc(var(--ux,0)*140deg));pointer-events:none}
.un-ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1.5px solid rgba(200,240,75,.4);transform:translate(-50%,-50%)}
/* v18.47 — the big dashed circle is the dumbbell's FRAME: the bar sits exactly
   on its center (like the reference screenshot). 260px keeps circle + hint +
   card inside one viewport. */
.un-ring.r1{width:260px;height:260px;border-style:dashed;opacity:.8;animation:unspin 14s linear infinite}
.un-ring.r2{width:330px;height:330px;opacity:.4;animation:unspin 24s linear infinite reverse}
.un-ring.r3{width:405px;height:405px;opacity:.2;animation:unspin 38s linear infinite}
@keyframes unspin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
/* v18.47 — the dumbbell sits in normal flow inside .un-hold (grid-centered),
   so it is EXACTLY centered in the big dashed circle (position:absolute from
   the padlock era broke place-items:center). */
.un-lock{position:relative;transform:translateY(calc(var(--ux,0)*-30px)) rotate(calc(var(--ux,0)*-3deg)) scale(calc(1 + var(--ux,0)*.07));animation:unbob 5.5s ease-in-out infinite;pointer-events:none}
/* bob rides the individual `translate` property (composes with the --ux
   transform instead of overriding it); the old margin-top animated layout
   every frame. -4.5px = the visual offset margin-top:-9px produced under
   place-items:center (margin-box centering shifts by half). */
@keyframes unbob{0%,100%{translate:0 0}50%{translate:0 -4.5px}}
.un-lock svg{filter:drop-shadow(0 0 22px rgba(200,240,75,.4)) drop-shadow(0 18px 40px rgba(0,0,0,.6))}
/* v18.44 — HOLD-TO-LIFT: the dumbbell itself is the button (isometric hold,
   like a plank). Holding fills a progress ring around it, the plates glow
   toward the center, the whole bar LIFTS, rings/particles accelerate — and
   at 100% it bursts into the portal. Replaces slide-to-unlock. */
.un-hold{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) translateZ(80px);width:260px;height:260px;display:grid;place-items:center;cursor:grab;touch-action:none;z-index:3;-webkit-tap-highlight-color:transparent}
.un-hold.dis{cursor:not-allowed}
.un-hold.dis .un-lock{opacity:.45}
.un-hold:active{cursor:grabbing}
/* v18.47 — the floating hint line was removed (it collided with the card on
   short viewports); the instruction lives in the FOOT status instead, with
   the pulsing hand icon. */
.un-hintline{display:inline-flex;gap:7px;align-items:center}
.un-hintline .ic{color:var(--accent);animation:unpulse 1.5s ease-in-out infinite}
@keyframes unpulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
.holding .un-ring.r1{animation-duration:3.5s}.holding .un-ring.r2{animation-duration:6s}.holding .un-ring.r3{animation-duration:9s}
.holding .un-dot{animation-duration:2.2s}
/* v18.42 — the hero is a 3D DUMBBELL (sporty element, not a padlock): the
   plates slide toward the center as the handle moves (inner plates travel
   farther than the outer ones for depth) and SLAM home on unlock. The
   CoachMint bolt rides the bar between them. */
.un-plate{transition:transform .18s ease-out}
.un-plate.li{transform:translateX(calc(var(--ux,0)*22px))}
.un-plate.ri{transform:translateX(calc(var(--ux,0)*-22px))}
.un-plate.lo{transform:translateX(calc(var(--ux,0)*8px))}
.un-plate.ro{transform:translateX(calc(var(--ux,0)*-8px))}
.un-shock{position:absolute;left:50%;top:34%;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:2.5px solid var(--accent);opacity:0;transform:translateZ(60px);pointer-events:none}
.un-card{position:absolute;left:50%;top:71%;transform:translate(-50%,-50%) translateZ(34px);width:min(440px,90vw);text-align:center}
/* v18.45 — the progress ring IS the avatar's halo: the photo sits in the
   center of the hold ring, so the user literally "fills themselves up" while
   holding. Typography: eyebrow → greeting → big name → coach chip. */
.un-avwrap{position:relative;width:100px;height:100px;margin:0 auto;display:grid;place-items:center}
.un-avwrap .av{box-shadow:0 0 0 4px rgba(200,240,75,.14),0 14px 34px -10px rgba(0,0,0,.75)}
.un-avwrap .av img{transition:transform .2s ease-out}

.un-avring{position:absolute;inset:0;transform:rotate(-90deg)}

.un-avring .fg{stroke:var(--accent);stroke-linecap:round;filter:drop-shadow(0 0 7px rgba(200,240,75,.65));transition:stroke-dashoffset .1s linear}
.un-sub{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.un-hi{font-size:13.5px;font-weight:600;color:#8A90A0;margin-top:10px}

/* v18.49 — Persian is a CONNECTED script: any letter-spacing pulls the
   letters apart and looks broken — reset all card text to 0 for FA. */
html[lang="fa"] .un-hi,html[lang="fa"] .un-name,html[lang="fa"] .un-meta,html[lang="fa"] .un-sub{letter-spacing:0}
.un-coach{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:6px 14px 6px 8px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:12px;font-weight:700;color:#C6CBD6}

.un-codebox{display:flex;gap:8px;margin:16px auto 0;max-width:360px}
.un-codebox .inp{flex:1;background:rgba(255,255,255,.06);border-color:rgba(200,240,75,.3);color:#F5F6F8}
.un-pick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.un-chip{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:99px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);color:#E8EAF0;font-size:13px;font-weight:700;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.un-chip.on{border-color:var(--accent);background:rgba(200,240,75,.12);box-shadow:0 0 0 3px rgba(200,240,75,.12)}
/* v18.44 — the slide track was removed; the dumbbell itself is the hold target */
.un-foot{position:absolute;left:50%;bottom:calc(3.5vh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:16px;align-items:center;font-size:11.5px;color:#7A8291;white-space:nowrap}

.un-fsep{color:#414856;font-weight:800}
/* unlock burst: rings blow out, shackle springs open, shockwave expands, the
   whole stage zooms toward the viewer, then the portal renders */
.unlocked .un-ring{animation:unburst .85s ease-out forwards}
@keyframes unburst{to{transform:translate(-50%,-50%) scale(2.7);opacity:0}}
.unlocked .un-plate.li{animation:unslamL .55s cubic-bezier(.34,1.56,.64,1) forwards}

@keyframes unslamL{to{transform:translateX(28px)}}
@keyframes unslamR{to{transform:translateX(-28px)}}
@keyframes unslamLo{to{transform:translateX(10px)}}
@keyframes unslamRo{to{transform:translateX(-10px)}}
.unlocked .un-shock{animation:unshock .95s ease-out forwards}
@keyframes unshock{0%{opacity:.95;transform:translateZ(60px) scale(1)}100%{opacity:0;transform:translateZ(60px) scale(7.5)}}

.phone{width:356px;max-width:100%;height:min(726px,94vh);background:#0F1114;border:9px solid #05070A;border-radius:44px;box-shadow:0 34px 70px -30px rgba(0,0,0,.9);overflow:hidden;position:relative;display:flex;flex-direction:column;flex:none;font-family:Vazirmatn,system-ui,sans-serif;font-size:16px;line-height:normal}

.capp{flex:1;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:78px}
.capp::-webkit-scrollbar{display:none}
/* v18.78 — mockup chead: transparent, in-flow (scrolls away), 24px/900 title */
/* v18.79 — mockup aligns flex-start (the pill sits level with the eyebrow) and
   lets the eyebrow WRAP (the mockup's is 2 lines / 30px tall, ours was 1 line). */
.chead{position:static;background:transparent;backdrop-filter:none;padding:44px 14px 12px;padding-top:calc(44px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:none;z-index:5}
/* v18.78 — cards carry their own 14px mockup insets; cbody must NOT add more
   (the old padding:14px made every card 28px from the edge) and no flex gap
   (card margins already provide the 12px rhythm). */
.cbody{padding:0 0 96px;display:flex;flex-direction:column;gap:0}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:none}
.phone .cbody>.ccard{margin:0 14px 12px}
.cstat{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.cempty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 20px;text-align:center;color:var(--ink2)}
/* v18.110 — mockup cnav: 70px, translucent blur bar, 9.5px labels, 26px indicator.
   direction:ltr pins the tab order to LTR in FA/RTL mode (mockup line 100) and makes
   .cdot resolve to `right`. z-index:15 matches the mockup and still sits under .cplayer(20). */
.cnav{position:absolute;bottom:0;left:0;right:0;height:70px;background:rgba(13,15,19,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.07);display:flex;padding:8px 6px 12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;direction:ltr}
.cnav-it{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;font-weight:800;color:var(--ink3);cursor:pointer;padding:6px 0 0;border-radius:12px;position:relative;transition:.15s}
.cnav-it.on{color:var(--accent);background:none}
.cnav-it.on::after{content:'';position:absolute;top:0;inset-inline:calc(50% - 13px);width:26px;height:3px;border-radius:99px;background:var(--accent)}
.cdot{position:absolute;top:4px;inset-inline-end:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--red);border:1.5px solid #0D0F13}
.cplayer{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
/* v18.89 — mockup .plhead / .app / .plfoot (screen 03). The rest timer moves
   OUT of .cpfoot into the body, so the foot shrinks from 240px to the mockup's
   72px translucent bar with a ghost + primary pair.
   ⚠ .cpbody MUST hide its scrollbar (like .capp): `overflow-y:auto` laid out a
     10px gutter, so EVERY block measured 300px instead of the mockup's 310px. */
.cphead{display:flex;align-items:center;gap:10px;padding:44px 14px 10px;padding-top:calc(44px + env(safe-area-inset-top,0px));border-bottom:none}
.cpbody{flex:1;overflow-y:auto;padding:0 0 84px;scrollbar-width:none}
.cpbody::-webkit-scrollbar{display:none}
.cpfoot{position:absolute;bottom:0;left:0;right:0;height:72px;background:rgba(13,15,19,.95);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.07);padding:11px 14px 16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:9px;align-items:center;z-index:15}
.cpfoot .btn{flex:1;height:44px;justify-content:center;gap:7px}
.cpfoot .btn-ghost-btn{flex:none;width:46px;padding:0}
/* mockup .plhead .back — a 32px square tile, not the generic ghost button.
   Scoped with .phone because `.phone .btn` (0,2,0, later in the sheet) was
   winning the specificity tie on font-size/weight. */
.phone .cphead>.btn-ghost{width:32px;height:32px;padding:0;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;justify-content:center;flex:none;font-size:16px;font-weight:400;gap:normal;text-align:start}
/* v18.71 — pro rest timer: fullscreen overlay */
.restfs{position:absolute;inset:0;z-index:30;background:radial-gradient(120% 100% at 50% 0%,#1B2313,#0A0C0E 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:34px 26px}
.restfs-x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:14px;width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink2);display:grid;place-items:center;cursor:pointer}
.restfs-x:hover{border-color:var(--accent);color:var(--accent)}
.restfs-l{font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:900;color:var(--accent)}
.restfs-n{font-size:clamp(56px,20vw,74px);line-height:1;font-weight:900;font-family:'JetBrains Mono',monospace;letter-spacing:-.04em;color:#fff;text-shadow:0 0 44px rgba(200,240,75,.25)}
.restfs-bar{width:100%;max-width:250px;height:8px;border-radius:99px;background:#22262D;overflow:hidden;margin-top:2px}
.restfs-bar i{display:block;height:100%;background:var(--accent);transition:width .35s linear,background .25s}
.restfs-c{display:flex;gap:8px;margin-top:16px;width:100%;max-width:280px}
.restfs-c .btn{flex:1;height:44px}
.restfs[data-s="pause"] .restfs-n,.restfs[data-s="pause"] .restfs-l{color:var(--amber);text-shadow:none}
.restfs[data-s="pause"] .restfs-bar i{background:var(--amber)}
/* v18.105 — mockup 08: setting rows are FLAT inside the section card (a
   border-bottom divider), not one little card each. Profile is the only screen
   that emits .setrow, so this change is scoped to it. */
.setrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.setrow:last-child{border:none}
.setrow .si{width:32px;height:32px;border-radius:10px;background:var(--surface3);display:grid;place-items:center;flex:none;font-size:14px}
.setrow .t{flex:1;min-width:0}
.setrow .t b{font-size:13px;display:block;font-weight:700}
.setrow .t span{font-size:10.5px;color:var(--ink3)}
.setrow .chev{color:var(--ink3);display:flex;flex:none}
.ckb{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;background:var(--surface);flex:none;cursor:pointer;padding:0}
.ckb.on{background:var(--accent-deep);border-color:var(--accent-deep)}
.rpe{width:25px;height:22px;border-radius:7px;border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--ink2);background:var(--surface);cursor:pointer;padding:0}
.rpe.on{background:var(--ink-bg);color:#fff;border-color:var(--ink-bg)}
.restbar{background:var(--accent-soft);border:1px solid var(--acc-line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
/* v18.71 — Habits checklist card (Today / Habits tab) */
.hab-hd{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
.hab-ic{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.hab-t{flex:1;min-width:0}
/* v18.79 — mockup uses DIRECT-CHILD selectors: `.hab-t span` was catching the
   nested `.new` badge and turning it into a mono/ink3 block (90px taller header). */
.hab-t>b{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:900;color:var(--ink)}
.hab-t>span{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.hab-t>span>b{color:var(--accent);font-family:'JetBrains Mono',monospace;font-weight:900}
.hab-t>span>span{color:var(--accent);font-family:'JetBrains Mono',monospace;font-weight:900}
.hab-hd .ic{color:var(--ink3);transition:transform .28s cubic-bezier(.4,0,.2,1);flex:none}
.hab-hd.open .ic{transform:rotate(180deg)}
.hab-hd:hover .ic{color:var(--accent)}
.hab-bd{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1),opacity .22s;overflow:hidden}
.hab-bd.closed{grid-template-rows:0fr;opacity:0}
.hab-wr{min-height:0;overflow:hidden;padding-top:9px}
.hab-r{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2)}
.hab-r:last-child{border-bottom:none}
.hab-tk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;cursor:pointer;padding:0;transition:.15s}
.hab-tk:not([disabled]):hover{border-color:var(--accent)}
.hab-tk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hab-tk[disabled]{opacity:.45;cursor:default}
.hab-in{flex:1;min-width:0}
.hab-in b{display:block;font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hab-in span{display:block;font-size:10.5px;color:var(--ink3)}
.hab-r.on .hab-in b{color:var(--ink3)}
.hab-n{width:70px;background:var(--seg-bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:12px;padding:5px 6px;text-align:center}
.hab-n:focus{outline:none;border-color:var(--accent)}
.hab-v{font-size:11.5px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--ink2);min-width:38px;text-align:right;flex:none}
.hab-r.on .hab-v{color:var(--accent)}
/* client portal — black chrome, green brand accents */
.phone .card-t{color:var(--accent-deep)}
/* v18.78 — mockup chead: transparent, no gradient, no border (scrolls away) */
.phone .chead{background:transparent;border-bottom:none}
.phone .chead .muted{color:rgba(255,255,255,.55);font-weight:600}
.phone .chead .gbadge{background:rgba(200,240,75,.14);color:var(--accent);border:1px solid rgba(200,240,75,.25)}
/* v18.59 — STITCH HEADER: accent eyebrow + page title left, streak pill +
   notification bell + avatar right. Page titles live here now (the old .csec
   divs moved up), so every tab keeps its exact previous heading text. */
/* v18.79 — mockup .chead-t is a plain block: the 3px gap lives on the TITLE */
.chead-t{flex:1;min-width:0}
.chead-eyebrow{display:block;font-size:9.5px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--pf-ac)}
html[lang="fa"] .chead-eyebrow{letter-spacing:.06em}
html[lang="fa"] .chead-eyebrow{letter-spacing:0}
/* v18.79 — mockup: line-height:normal (not 1.15), ink colour, 3px top gap */
.chead-title{font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:normal;color:var(--ink);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="fa"] .chead-title{letter-spacing:0}
.chead-a{display:flex;align-items:center;gap:8px;flex:none}
/* v18.79 — mockup .pill is the header streak chip: lime-soft fill + lime border */
.chead-streak{display:flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:999px;background:var(--accent-soft);border:1px solid rgba(200,240,75,.3);color:var(--accent);font-size:12.5px;font-weight:900;flex:none}
.chead-bell{position:relative;width:30px;height:30px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);color:var(--ink2);cursor:pointer;transition:color .15s}
.chead-bell:hover{color:var(--ink)}
.chead-bell .cdot{top:5px;inset-inline-end:5px}
.chead-av{display:block;line-height:0;flex:none;border-radius:50%}
/* v18.71 — pushed sub-page (Calendar/Profile): inline back chevron in the title.
   vertical-align:-6px puts the 26px box's centre on the 20px text's optical centre. */
.chead-title .bk{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink);cursor:pointer;vertical-align:middle;margin-inline-end:7px;padding:0;transition:.15s}
.chead-title .bk:hover{background:rgba(200,240,75,.14);border-color:var(--accent);color:var(--accent)}
.phone .chip{background:var(--accent-soft);color:var(--accent-ink)}
.phone .fchip{background:var(--accent-soft);border-color:var(--acc-chip);color:var(--accent-ink)}
.phone .fchip:hover{background:var(--accent);color:var(--accent-ink)}
.phone .seg{background:var(--accent-soft)}
.phone .seg button.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.phone .pbar{background:var(--accent-soft)}
.phone .pbar i{background:linear-gradient(90deg,var(--accent-deep),var(--accent))}
/* v18.14 — Fitness+-inspired client app: the phone is ALWAYS true-black with
   dark-gray cards, regardless of the coach theme (Apple Fitness+ never goes
   light inside the app). Scoped via CSS vars on .phone so every nested
   component (chips, inputs, bars) adapts without touching markup. */
/* v18.23 — FitFlow redesign (UI inspiration board): charcoal panels on
   near-black, acid-lime accents, glowing progress, fine hairlines. Same
   markup, new skin — content untouched. */
/* v18.27 — PHONE SKINS: the client app ships 4 selectable themes. The base
   rules below are the shared dark skeleton; each skin overrides the palette
   via .phone[data-skin=…]. Default = fitflow. Chosen in Profile → App Theme,
   persisted in PREFS.phoneSkin (per device, like theme/accent). */
.phone{--surface:#171A1F;--surface2:#1D2127;--surface3:#22262D;--line:#262A31;--line2:#1F232A;--ink:#F5F6F8;--ink2:#B4B9C4;--ink3:#7E8492;
  --accent-soft:rgba(200,240,75,.12);
  --row-h:#1C2026;--seg-bg:#22262D;--seg-on:#2B3038;--kbd-bg:#1C2026;--cal-hd:#1B1F25;--cal-alt:#171A1F;
  --glass:rgba(5,6,8,.88);--glass2:rgba(5,6,8,.92);--btn-dark-bg:#F5F6F8;--btn-dark-fg:#12151B;
  background:#0F1114;color:var(--ink)}
/* v18.78 — mockup-exact phone cards: flat surface, no gradient, no hairline */
.phone .ccard{box-shadow:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;position:relative}
.phone .ccard::before{content:none}
/* v18.78 — mockup buttons/progress inside the phone: flat lime, 10px radius */
.phone .btn-lime{background:var(--accent);border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:none}
.phone .pbar{height:7px}
.phone .pbar i{background:var(--accent)}
.phone .chip{background:#22262D;color:#E9EAEE;border:1px solid #2E333B}
.phone .fchip{background:#1C2026;border-color:#2E333B;color:#B4B9C4}
.phone .fchip.on,.phone .fchip:hover{background:rgba(200,240,75,.1);border-color:var(--accent);color:var(--accent)}
.phone .inp,.phone .sel,.phone .ta{background:#1C2026;border-color:#2E333B;color:var(--ink)}
.phone .tbl th{color:#7E8492}.phone .tbl td{border-color:#1F232A}
.phone .tbl tbody tr[data-act]:hover td:first-child{box-shadow:none}
/* Fitness+ check-in segments: dark pills, selected = lime outline + lime text */
.phone .seg{background:transparent;gap:6px}
.phone .seg button{flex:1;background:#1C2026;border:1.5px solid transparent;border-radius:10px;color:#B4B9C4}
.phone .seg button.on{background:rgba(200,240,75,.08);border-color:var(--accent);color:var(--accent);box-shadow:none}
/* FitFlow bottom tab bar: charcoal glass, active = lime icon + label + glow dot.
   v18.110: the .cnav surface is no longer re-declared here (it was forcing blur(18px)
   over a later opaque fill). The base rule is now the single source of truth. */
.phone .cnav-it,.mshell .cnav-it{color:var(--ink3)}
.phone .cnav-it.on,.mshell .cnav-it.on{color:var(--accent);background:none}
/* v18.76 — mockup fhero (design 01): lime-tinted gradient card, 14px insets */
/* v18.79 — mockup .fhero text inherits --ink (#F5F6F8), not pure white */
.fhero{position:relative;overflow:hidden;border-radius:18px;margin:0 14px 12px;padding:15px;color:var(--ink);border:1px solid rgba(200,240,75,.18);
  background:linear-gradient(160deg,#2A3118 0%,#171A1F 55%)}
.fhero h3{font-size:19px;font-weight:900;margin:9px 0 2px;letter-spacing:-.02em}
.fhero .who{font-size:11.5px;color:var(--ink2)}
.fhero .who b{color:var(--ink)}
.fhero .meta{display:flex;gap:14px;margin-top:10px}
.fhero .meta div{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
html[lang="fa"] .fhero .meta div{letter-spacing:0}
.fhero .meta b{display:block;font-size:14px;color:var(--ink);font-family:'JetBrains Mono',monospace}
.fhero .cta{display:flex;gap:8px;margin-top:12px}
/* v18.79 — mockup CTA buttons carry NO horizontal padding */
.fhero .cta .btn{flex:1;height:42px;width:auto;display:flex;align-items:center;justify-content:center;gap:7px;padding:0}
.fhero .cta .btn-out{flex:none;width:46px}
.fhero.pink{background:radial-gradient(110% 90% at 85% 5%,rgba(235,150,90,.2),transparent 55%),
             radial-gradient(130% 110% at 10% 95%,rgba(186,56,138,.14),transparent 60%),
             linear-gradient(150deg,#1B1F26,#14161B 60%,#101318)}
.fhero .card-t{color:rgba(255,255,255,.85)}
.fhero .chip{background:rgba(255,255,255,.07);color:var(--ink2);border:1px solid rgba(255,255,255,.1);border-radius:999px;font-weight:800}
.fhero .glass{width:100%;justify-content:center;background:rgba(0,0,0,.32);backdrop-filter:blur(6px);color:#fff;border-radius:13px;font-weight:700;border:1px solid rgba(255,255,255,.09)}
/* ============ v18.111 — TODAY HERO (superdesign ①-④) ============
   .fhero is deliberately KEPT as the element: the four phone skins target
   `.phone[data-skin] .fhero` (lines 964/979/994) and would otherwise stop
   styling the workout card. .ws-hero only layers typography + CTA weight on
   top, and it sits at specificity (0,2,0) so every skin still wins. */
.phone{
  --font-display:'Oxanium','Vazirmatn',system-ui,sans-serif;
  --hero-grad:linear-gradient(135deg,rgba(200,240,75,.17) 0%,rgba(200,240,75,.06) 44%,rgba(15,17,20,0) 100%);
  --hero-edge:rgba(200,240,75,.30);
  --sh-hero:0 18px 44px -20px rgba(200,240,75,.45),inset 0 1px 0 rgba(255,255,255,.05);
  --sh-btn:0 10px 24px -10px rgba(200,240,75,.6);
}
.fhero.ws-hero{margin:0 14px 14px;padding:16px;border-radius:22px;
  background:var(--hero-grad);border-color:var(--hero-edge);box-shadow:var(--sh-hero)}
.fhero.ws-hero .ws-eye{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font:800 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.fhero.ws-hero .ws-eye .ws-dur{display:inline-flex;align-items:center;gap:5px;
  color:var(--ink2);letter-spacing:.06em;text-transform:none}
.fhero.ws-hero .ws-eye .ws-dur svg{width:13px;height:13px}
.fhero.ws-hero h3{font-family:var(--font-display);font-size:26px;font-weight:700;
  line-height:1.02;letter-spacing:-.028em;text-transform:uppercase;margin:11px 0 0}
html[lang="fa"] .fhero.ws-hero h3{text-transform:none;letter-spacing:0;font-size:22px}
.fhero.ws-hero .who{font-size:12.5px;color:var(--ink2);margin-top:6px}
.fhero.ws-hero .ws-chips{display:flex;gap:7px;margin-top:14px}
.fhero.ws-hero .ws-chip{flex:1;min-width:0;background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.07);
  border-radius:10px;padding:8px 7px;text-align:center}
.fhero.ws-hero .ws-chip b{display:block;font:700 13px/1 'JetBrains Mono',monospace;letter-spacing:-.01em;color:var(--ink)}
.fhero.ws-hero .ws-chip span{display:block;margin-top:4px;font:600 8.5px/1 'JetBrains Mono',monospace;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.fhero.ws-hero .cta{margin-top:15px}
.fhero.ws-hero .cta .btn-lime{height:52px;border-radius:13px;font-size:14.5px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;box-shadow:var(--sh-btn)}
html[lang="fa"] .fhero.ws-hero .cta .btn-lime{text-transform:none;letter-spacing:0}
/* v18.111 — FA resets: these three carry .10–.16em tracking + uppercase for the
   Latin athletic look, but letter-spacing on Arabic script visually SEPARATES
   joined letters. Persian must inherit normal tracking and no transform. */
html[lang="fa"] .fhero.ws-hero .ws-eye,
html[lang="fa"] .fhero.ws-hero .ws-chip span,
html[lang="fa"] .ring-row .rm .k{letter-spacing:0;text-transform:none}
/* TODAY — nutrition ring, real NEng numbers */
.ring-row{display:flex;align-items:center;gap:13px}
.ring-row .rr{position:relative;width:74px;height:74px;flex:none}
.ring-row .rr svg{transform:rotate(-90deg);display:block}
.ring-row .rr .rv{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1;gap:2px}
.ring-row .rr .rv b{font:700 15px/1 'JetBrains Mono',monospace}
.ring-row .rr .rv span{font:600 8px/1 'JetBrains Mono',monospace;letter-spacing:.1em;color:var(--ink3)}
.ring-row .rm{min-width:0;flex:1}
.ring-row .rm .k{font:700 9.5px/1 'JetBrains Mono',monospace;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3)}
.ring-row .rm .big{font:700 22px/1 var(--font-display);letter-spacing:-.03em;margin-top:7px}
.ring-row .rm .big i{font-style:normal;font-size:12px;color:var(--ink3);font-family:'JetBrains Mono',monospace}
.ring-row .rm .sub{font-size:11.5px;color:var(--ink2);margin-top:5px}
.ring-row .rm .sub b{color:var(--accent);font-weight:700}
/* FitFlow big lime CTA — glow shadow */
.btn-lime{width:100%;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--acc-mid));color:#141A05;font-weight:800;border-radius:14px;padding:13px 16px;font-size:14px;box-shadow:0 6px 22px -6px rgba(200,240,75,.45)}
.btn-lime:hover{filter:brightness(1.05)}
/* v18.79 — .btn-lime is width:100% by default (full-card CTAs); inside flex
   rows (mockup compact cards) it must size to content or it breaks the row. */
.row .btn-lime,.mom-danger .btn{width:auto}
/* v18.79 — mockup .btn: 13px / 800 (app was 13.5px / 600) — phone only */
.phone .btn{font-size:13px;font-weight:800}
.phone .btn-out{font-weight:800}
/* v18.79 — mockup lime button text = --accent-ink (#1A2205), not #141A05.
   The mockup .btn has border:none (so border-color resolves to currentColor). */
.phone .btn-lime{color:var(--accent-ink);border:none}
/* FitFlow weekly letter circles — glowing done state */
.wkc{display:flex;gap:7px}
.wkc i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12.5px;background:#1C2026;color:#8A90A0;flex:none;border:1px solid #262B33}
.wkc i.done{background:rgba(200,240,75,.14);color:var(--accent);border-color:rgba(200,240,75,.35);box-shadow:0 0 12px -2px rgba(200,240,75,.35)}
.wkc i.today{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
/* FitFlow pill filter row */
.fpills{display:flex;gap:8px;flex-wrap:wrap}
.fpill{padding:8px 16px;border-radius:999px;background:#1C2026;color:#B4B9C4;font-size:12.5px;font-weight:700;border:1.5px solid transparent;cursor:pointer}
.fpill.on{background:rgba(200,240,75,.08);border-color:var(--accent);color:var(--accent)}
/* v18.24 — FitFlow workout card: dark photo-hero style (charcoal gradient
   banner, chips on top, big title + subtitle at the bottom, like the board's
   "Upper Body Power" card). */
.wcard{position:relative;display:flex;flex-direction:column;min-height:190px;border-radius:20px;padding:14px;color:#fff;border:1px solid #2A2F38;overflow:hidden;
  background:radial-gradient(120% 80% at 85% 0%,rgba(200,240,75,.13),transparent 55%),
             radial-gradient(140% 110% at 10% 100%,rgba(200,240,75,.05),transparent 55%),
             linear-gradient(160deg,#232830,#15171C 65%,#101318)}
.wcard-top{display:flex;justify-content:space-between;align-items:center}
.wcard .btn-lime{box-shadow:0 6px 18px -6px rgba(200,240,75,.5)}
/* ================= v18.27 — SKIN VARIANTS =================
   Each skin re-themes the SAME components: canvas, card gradient, hairline
   color, chip/segment fills, nav, hero/workout-card glows. The lime accent
   of the coach theme is replaced by the skin's own accent so the client app
   feels like a distinct product theme. */
/* CARBON — pure black, white accents, minimal (Apple Fitness style) */
.phone[data-skin="carbon"]{background:#000}
.phone[data-skin="carbon"] .ccard{background:linear-gradient(180deg,#111214,#0C0D0F);border-color:#1E2126}
.phone[data-skin="carbon"] .ccard::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent)}
.phone[data-skin="carbon"] .chip{background:#17181B;border-color:#26282D}
.phone[data-skin="carbon"] .fchip,.phone[data-skin="carbon"] .inp,.phone[data-skin="carbon"] .sel,.phone[data-skin="carbon"] .ta,.phone[data-skin="carbon"] .seg button,.phone[data-skin="carbon"] .fpill,.phone[data-skin="carbon"] .wkc i,.phone[data-skin="carbon"] .pbar,.phone[data-skin="carbon"] .set-row{background:#141518;border-color:#24262B}
.phone[data-skin="carbon"] .fchip.on,.phone[data-skin="carbon"] .seg button.on,.phone[data-skin="carbon"] .fpill.on{background:rgba(255,255,255,.08);border-color:#fff;color:#fff}
.phone[data-skin="carbon"] .cnav,.phone[data-skin="carbon"] .cnav-it.on::after{background:#050506}
.phone[data-skin="carbon"] .cnav-it.on{color:#fff}
.phone[data-skin="carbon"] .cnav-it.on::after{background:#fff;box-shadow:0 0 10px rgba(255,255,255,.6)}
.phone[data-skin="carbon"] .fhero,.phone[data-skin="carbon"] .wcard{background:radial-gradient(110% 90% at 88% 0%,rgba(255,255,255,.1),transparent 55%),linear-gradient(150deg,#17181C,#0E0F11 60%,#0A0B0D);border-color:#22242A}
.phone[data-skin="carbon"] .btn-lime{background:linear-gradient(135deg,#FFFFFF,#D6D8DD);color:#0A0B0D;box-shadow:0 6px 22px -6px rgba(255,255,255,.35)}
.phone[data-skin="carbon"] .wkc i.done{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4);box-shadow:0 0 12px -2px rgba(255,255,255,.3)}
.phone[data-skin="carbon"] .pbar i{background:linear-gradient(90deg,#B9BCC4,#FFFFFF);box-shadow:0 0 10px -2px rgba(255,255,255,.5)}
.phone[data-skin="carbon"] .card-t svg,.phone[data-skin="carbon"] .cempty svg{color:#E9EAEE}
/* OCEAN — deep navy, cyan accents (calm water) */
.phone[data-skin="ocean"]{background:#060B14}
.phone[data-skin="ocean"] .ccard{background:linear-gradient(180deg,#0D1524,#0A101C);border-color:#16233A}
.phone[data-skin="ocean"] .ccard::before{background:linear-gradient(90deg,transparent,rgba(56,189,248,.35),transparent)}
.phone[data-skin="ocean"] .chip{background:#101B2E;border-color:#1C2C47}
.phone[data-skin="ocean"] .fchip,.phone[data-skin="ocean"] .inp,.phone[data-skin="ocean"] .sel,.phone[data-skin="ocean"] .ta,.phone[data-skin="ocean"] .seg button,.phone[data-skin="ocean"] .fpill,.phone[data-skin="ocean"] .wkc i,.phone[data-skin="ocean"] .pbar,.phone[data-skin="ocean"] .set-row{background:#0F1A2C;border-color:#1C2C47}
.phone[data-skin="ocean"] .fchip.on,.phone[data-skin="ocean"] .seg button.on,.phone[data-skin="ocean"] .fpill.on{background:rgba(56,189,248,.1);border-color:#38BDF8;color:#7DD3FC}
.phone[data-skin="ocean"] .cnav{background:rgba(4,9,17,.92)}
.phone[data-skin="ocean"] .cnav-it.on{color:#38BDF8}
.phone[data-skin="ocean"] .cnav-it.on::after{background:#38BDF8;box-shadow:0 0 10px rgba(56,189,248,.7)}
.phone[data-skin="ocean"] .fhero,.phone[data-skin="ocean"] .wcard{background:radial-gradient(110% 90% at 88% 0%,rgba(56,189,248,.16),transparent 55%),radial-gradient(130% 110% at 8% 100%,rgba(14,116,144,.14),transparent 55%),linear-gradient(150deg,#0E1B30,#0A1220 60%,#070D18);border-color:#1C2C47}
.phone[data-skin="ocean"] .btn-lime{background:linear-gradient(135deg,#38BDF8,#0EA5E9);color:#04121D;box-shadow:0 6px 22px -6px rgba(56,189,248,.5)}
.phone[data-skin="ocean"] .wkc i.done{background:rgba(56,189,248,.14);color:#7DD3FC;border-color:rgba(56,189,248,.4);box-shadow:0 0 12px -2px rgba(56,189,248,.4)}
.phone[data-skin="ocean"] .pbar i{background:linear-gradient(90deg,#0EA5E9,#38BDF8);box-shadow:0 0 10px -2px rgba(56,189,248,.6)}
.phone[data-skin="ocean"] .card-t svg,.phone[data-skin="ocean"] .cempty svg{color:#38BDF8}
/* SUNSET — warm plum, amber accents (energetic evening) */
.phone[data-skin="sunset"]{background:#120A10}
.phone[data-skin="sunset"] .ccard{background:linear-gradient(180deg,#1D1220,#150D17);border-color:#2E1F30}
.phone[data-skin="sunset"] .ccard::before{background:linear-gradient(90deg,transparent,rgba(251,146,60,.35),transparent)}
.phone[data-skin="sunset"] .chip{background:#241627;border-color:#38243B}
.phone[data-skin="sunset"] .fchip,.phone[data-skin="sunset"] .inp,.phone[data-skin="sunset"] .sel,.phone[data-skin="sunset"] .ta,.phone[data-skin="sunset"] .seg button,.phone[data-skin="sunset"] .fpill,.phone[data-skin="sunset"] .wkc i,.phone[data-skin="sunset"] .pbar,.phone[data-skin="sunset"] .set-row{background:#201323;border-color:#38243B}
.phone[data-skin="sunset"] .fchip.on,.phone[data-skin="sunset"] .seg button.on,.phone[data-skin="sunset"] .fpill.on{background:rgba(251,146,60,.1);border-color:#FB923C;color:#FDBA74}
.phone[data-skin="sunset"] .cnav{background:rgba(15,8,14,.92)}
.phone[data-skin="sunset"] .cnav-it.on{color:#FB923C}
.phone[data-skin="sunset"] .cnav-it.on::after{background:#FB923C;box-shadow:0 0 10px rgba(251,146,60,.7)}
.phone[data-skin="sunset"] .fhero,.phone[data-skin="sunset"] .wcard{background:radial-gradient(110% 90% at 88% 0%,rgba(251,146,60,.18),transparent 55%),radial-gradient(130% 110% at 8% 100%,rgba(219,39,119,.12),transparent 55%),linear-gradient(150deg,#241527,#180F1A 60%,#100A12);border-color:#38243B}
.phone[data-skin="sunset"] .btn-lime{background:linear-gradient(135deg,#FDBA74,#FB923C);color:#2A1204;box-shadow:0 6px 22px -6px rgba(251,146,60,.5)}
.phone[data-skin="sunset"] .wkc i.done{background:rgba(251,146,60,.14);color:#FDBA74;border-color:rgba(251,146,60,.4);box-shadow:0 0 12px -2px rgba(251,146,60,.4)}
.phone[data-skin="sunset"] .pbar i{background:linear-gradient(90deg,#F97316,#FDBA74);box-shadow:0 0 10px -2px rgba(251,146,60,.6)}
.phone[data-skin="sunset"] .card-t svg,.phone[data-skin="sunset"] .cempty svg{color:#FB923C}
/* FitFlow big bold section headers + tiny uppercase eyebrow */
.csec{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin:4px 2px -2px}
html[lang="fa"] .csec{letter-spacing:0}
.phone .card-t{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8A90A0}
html[lang="fa"] .phone .card-t{letter-spacing:0}
.phone .card-t svg{color:var(--accent)}
/* FitFlow stat strip (streak card) — lime gradient kept, glow added */
.phone .cstat{border:none;border-radius:18px;box-shadow:0 8px 26px -10px rgba(200,240,75,.5)}
/* v18.110 — the opaque fill below was the "visual leak": it replaced the mockup's
   frosted rgba(13,15,19,.94) with solid #0D0F13, so scrolling content hit a hard seam
   instead of dissolving under a blurred, slightly transparent bar. */
.phone .cnav-it{color:var(--ink3)}
.phone .cnav-it.on{color:var(--accent);background:none}
.phone .bub.me{background:var(--accent);color:var(--accent-ink);border:none}
.phone .bub.me .ctx{background:rgba(20,28,5,.14);color:var(--accent-ink)}
.phone .rpe.on{background:var(--accent-deep);border-color:var(--accent-deep)}
/* v18.83 — BUG: this used `color:var(--accent-ink)` (#1A2205, near-black) on the
   phone's dark surface (#171A1F) → outline-button labels were invisible. The
   border stays lime; the label falls back to the readable ink. */
.phone .btn-outline{border-color:var(--acc-line2);color:var(--ink)}
.phone .btn-outline:hover{color:var(--accent)}
.phone .cempty svg{color:var(--accent-deep)}
/* v18.89 — the mockup's .plhead has NO bottom border; this FitFlow rule was
   outranking `.cphead{border-bottom:none}` (0,2,0 > 0,1,0). */
.phone .cphead{border-bottom:none}
/* FitFlow progress bars — lime glow fill */
.phone .pbar{background:#1C2026;border:1px solid #262B33}
.phone .pbar i{background:linear-gradient(90deg,var(--accent-deep),var(--accent));box-shadow:0 0 10px -2px rgba(200,240,75,.6)}
/* v18.79 — mockup overrides the two rules above (flat track, no border, flat fill) */
.phone .pbar{background:#22262D;border:none;height:7px}
.phone .pbar i{background:var(--accent);box-shadow:none;height:100%}
/* FitFlow ring — lime gradient stroke (chart fns already use it) */
.phone .set-row{border-color:#23272F;background:#171A20}
.phone .set-row.on{background:rgba(200,240,75,.07);border-color:rgba(200,240,75,.35)}
/* ============ v18.58 — PROFILE TAB REDESIGN (student app) =============
   Visual-only reskin of cProfile to the neon profile board: ring avatar +
   camera badge, icon-tile rows, metric tiles, pill language switch, footer
   sign-out. No data or actions changed. --pf-ac re-tints every accent piece
   per phone skin (carbon/ocean/sunset override it here). */
.phone{--pf-ac:var(--accent);--pf-ac-ink:var(--accent-ink)}
.phone[data-skin="carbon"]{--pf-ac:#FFFFFF;--pf-ac-ink:#0A0B0D}
.phone[data-skin="ocean"]{--pf-ac:#38BDF8;--pf-ac-ink:#04121D}
.phone[data-skin="sunset"]{--pf-ac:#FB923C;--pf-ac-ink:#2A1204}
/* hero */
.pf-hero{overflow:hidden;text-align:center;padding:24px 16px 18px}
.pf-glow{position:absolute;border-radius:50%;filter:blur(48px);pointer-events:none}
.pf-g1{top:-78px;right:-64px;width:210px;height:210px;background:var(--pf-ac);opacity:.15}
.pf-g2{bottom:-92px;left:-72px;width:205px;height:205px;background:var(--pf-ac);opacity:.07}
.pf-avwrap{position:relative;display:inline-block;padding:3.5px;border-radius:50%;
  background:conic-gradient(from 200deg,var(--pf-ac),transparent 42%,var(--pf-ac) 78%,transparent);
  box-shadow:0 0 32px -8px var(--pf-ac)}
.pf-av{display:block;padding:0;border:none;background:none;border-radius:50%;cursor:pointer;line-height:0;transition:transform .15s}
.pf-av:active{transform:scale(.96)}
.pf-av .av{border:3px solid #14161B}
.pf-cam{position:absolute;bottom:-2px;right:-2px;width:32px;height:32px;padding:0;border-radius:50%;
  background:var(--pf-ac);color:var(--pf-ac-ink);display:flex;align-items:center;justify-content:center;
  border:3px solid #171A20;cursor:pointer;transition:transform .15s}
.pf-cam:active{transform:scale(.9)}
.pf-name{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:15px;font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--ink);word-break:break-word}
html[lang="fa"] .pf-name{letter-spacing:0}
.pf-sub{margin-top:5px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
html[lang="fa"] .pf-sub{letter-spacing:0}
.pf-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:13px}
.pf-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
  font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink2)}
html[lang="fa"] .pf-pill{letter-spacing:0}
.pf-pill-acc{color:var(--pf-ac)}
.pf-pill-ok{color:var(--green)}
.pf-pill-off{color:var(--ink3)}
.pf-dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pfPulse 1.7s ease-in-out infinite}
@keyframes pfPulse{0%,100%{opacity:1}50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.pf-dot{animation:none}}
/* member code strip */
.pf-code{display:flex;align-items:center;gap:11px;margin-top:15px;padding:11px 12px;border-radius:14px;
  background:rgba(0,0,0,.35);border:1px solid var(--line);text-align:start}
.pf-code .pf-qr{color:var(--pf-ac);display:flex;flex:none}
.pf-ck{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;font-weight:700;letter-spacing:.14em;color:var(--ink)}
.pf-copy{margin-inline-start:auto;flex:none;display:flex;align-items:center;gap:5px;padding:7px 10px;border:none;border-radius:10px;
  background:rgba(255,255,255,.07);color:var(--pf-ac);font-size:11.5px;font-weight:800;cursor:pointer;transition:transform .15s}
.pf-copy:active{transform:scale(.94)}
.pf-hint{display:flex;align-items:center;justify-content:space-between;margin:0 14px 4px}
/* card header */
.pf-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pf-hd h3{flex:1;min-width:0;margin:0;font-size:14.5px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
html[lang="fa"] .pf-hd h3{letter-spacing:0}
.pf-ico{flex:none;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);color:var(--pf-ac);border:1px solid var(--line)}
.pf-ico.n{color:var(--ink2)}
/* coach strip */
.pf-coach{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;
  background:rgba(255,255,255,.03);border:1px solid var(--line);margin-bottom:9px}
.pf-cn{flex:1;min-width:0}
.pf-cn b{display:block;font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-cn span{font-size:11.5px;color:var(--ink3)}
.pf-chat{flex:none;display:flex;align-items:center;gap:6px;padding:8px 13px;border:none;border-radius:11px;
  background:var(--pf-ac);color:var(--pf-ac-ink);font-size:12px;font-weight:800;cursor:pointer;transition:transform .15s}
.pf-chat:active{transform:scale(.95)}
/* info rows */
.pf-row{display:flex;align-items:center;gap:11px;padding:10px 11px;border:1px solid var(--line);border-radius:14px;
  background:rgba(255,255,255,.025);margin-top:8px}
.pf-hd + .pf-row,.pf-hd + .pf-coach{margin-top:0}
.pf-rt{flex:1;min-width:0}
.pf-rk{display:block;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
html[lang="fa"] .pf-rk{letter-spacing:0}
.pf-rv{display:block;font-size:13px;font-weight:700;color:var(--ink);word-break:break-word;text-align:start}
.pf-stat{margin-top:8px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}
.pf-stat .pf-tv{font-size:15px;font-weight:800;color:var(--ink)}
/* metric tiles */
.pf-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pf-tile{padding:12px 5px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);text-align:center}
.pf-tk{display:block;font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
html[lang="fa"] .pf-tk{letter-spacing:0}
.pf-tile .pf-tv{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
/* language switch */
.pf-lang{flex:none;display:flex;gap:5px;padding:4px;border-radius:99px;background:rgba(0,0,0,.32);border:1px solid var(--line)}
.pf-lang button{padding:7px 14px;border:none;border-radius:99px;background:none;color:var(--ink3);
  font-size:12px;font-weight:800;cursor:pointer;transition:background .18s,color .18s,box-shadow .18s}
.pf-lang button.on{background:var(--pf-ac);color:var(--pf-ac-ink);box-shadow:0 0 14px -5px var(--pf-ac)}
/* footer sign-out */
.pf-out{width:auto;margin:0 14px 12px;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 16px;border-radius:14px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--red);
  font-size:13.5px;font-weight:800;cursor:pointer;transition:background .15s,transform .15s}
.pf-out:hover{background:rgba(255,255,255,.07)}
.pf-out:active{transform:scale(.985)}
/* ============ v18.60 — TODAY REDESIGN (Stitch "Build Better Habits") ====
   Visual-only: greeting strip, momentum hero, action banner, section tabs,
   workout spotlight meta, sleep card. Accent via --pf-ac (skin-aware). */
.td-greet{display:flex;flex-direction:column;gap:6px;padding:4px 2px 2px}
.td-hi{display:flex;align-items:center;gap:7px;font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
html[lang="fa"] .td-hi{letter-spacing:0}
.td-bolt{color:var(--pf-ac);font-size:15px;animation:tdPulse 2s ease-in-out infinite}
@keyframes tdPulse{0%,100%{opacity:1}50%{opacity:.4}}
.td-sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.td-sub b{color:var(--pf-ac);font-weight:700}
.td-dot{width:6px;height:6px;border-radius:50%;background:var(--pf-ac);flex:none}
.td-cal-m{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
html[lang="fa"] .td-cal-m{letter-spacing:0;text-transform:none}
.td-chip{font-size:10px;font-weight:700;padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink2)}
.td-calbtn{display:flex;align-items:center;gap:3px;background:none;border:none;color:var(--pf-ac);font-size:12px;font-weight:700;cursor:pointer;padding:0}
.td-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:12px;background:rgba(255,255,255,.04);transition:background .15s,box-shadow .15s}
.td-day.on{background:var(--pf-ac);box-shadow:0 4px 14px -5px var(--pf-ac)}

/* ================= v18.26 — CALM MOTION (slow, no 3D) =================
   Gentle life for the client app: cards fade+rise slowly as they enter the
   viewport (IntersectionObserver, once per element), the tab content cross-
   fades softly, and interactive elements ease a touch slower. Everything is
   opacity/transform only, GPU-composited, and fully disabled for
   prefers-reduced-motion. */
.phone .cbody>.ccard,.phone .cbody>.wcard,.phone .cbody>.fhero{
  opacity:0;transform:translateY(26px);
  transition:opacity .9s cubic-bezier(.22,.61,.36,1),transform .9s cubic-bezier(.22,.61,.36,1);
  will-change:opacity,transform}
.phone .cbody>.ccard.fx-in,.phone .cbody>.wcard.fx-in,.phone .cbody>.fhero.fx-in{opacity:1;transform:translateY(0)}
/* stagger via transition-delay (set by the observer per index) */
@media(prefers-reduced-motion:reduce){
  .phone .cbody>.ccard,.phone .cbody>.wcard,.phone .cbody>.fhero{opacity:1!important;transform:none!important;transition:none!important}
}

/* ≤520px — client portal goes full-screen. The page must NEVER scroll as a whole:
   .clientwrap is pinned to the viewport (100vh on iOS is taller than the visible

   is contained (no rubber-band / pull-to-refresh moving the whole page), the
   floating lang/exit/feedback buttons are hidden (the lang one was an in-flow

   so iOS stops auto-zooming when the client types a message. */
