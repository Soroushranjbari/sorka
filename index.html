<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* v18.7 — light-theme separation fix (round 2): users only saw clear section
     boundaries while a modal dimmed the page (rgba(0,0,0,.55) overlay makes
     white surfaces glow against the darkened canvas). Round 1 (#EAEAE2) was
     too subtle — the canvas is now clearly darker than the cards and the
     hairlines/shadow carry real weight, so the layout has depth un-dimmed. */
  --bg:#DDDDD0; --surface:#FFFFFF; --sidebar:#12151B;
  --ink:#15181E; --ink2:#5C6270; --ink3:#9AA0AE;
  --line:#C8C8B6; --line2:#D5D5C6;
  --accent:#C8F04B; --accent-deep:#8FB51E; --accent-ink:#1A2205; --accent-soft:#F4FAE0;
  --acc-line:#CDE694; --acc-line2:#CFE49B; --acc-mid:#A6D437; --acc-mid2:#9CC53E; --acc-stat:#B4D95B; --acc-chip:#D8E9AF;
  --green:#16A34A; --green-soft:#E9F6EE; --red:#DC2626; --red-soft:#FDEDED;
  --amber:#C77414; --amber-soft:#FBF2E2; --blue:#2563EB; --blue-soft:#EAF1FE;
  --purple:#7C3AED; --purple-soft:#F2EDFD;
  --glass:rgba(221,221,208,.85); --glass2:rgba(221,221,208,.92);
  --ink-bg:#15181E; --btn-dark-bg:#15181E; --btn-dark-fg:#fff;
  --row-h:#F7F7F3; --seg-bg:#E9E9E3; --seg-on:#FFFFFF; --kbd-bg:#EFEFEA; --cal-hd:#F9F9F5; --cal-alt:#F7F7F3;
  --sh-1:0 1px 2px rgba(18,21,27,.09),0 6px 18px -6px rgba(18,21,27,.16);
  --sh-2:0 12px 32px -8px rgba(18,21,27,.18);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
html{color-scheme:light}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1114; --surface:#171A1F; --sidebar:#0B0D10;
  --ink:#E9EAEE; --ink2:#A9AFBA; --ink3:#707786;
  --line:#2E333B; --line2:#262B33;
  --glass:rgba(15,17,20,.85); --glass2:rgba(15,17,20,.92);
  --ink-bg:#0B0D10; --btn-dark-bg:#E9EAEE; --btn-dark-fg:#12151B;
  --row-h:#1C2026; --seg-bg:#22262D; --seg-on:#2B3038; --kbd-bg:#1C2026; --cal-hd:#1B1F25; --cal-alt:#171A1F;
  --sh-1:0 1px 2px rgba(0,0,0,.5); --sh-2:0 14px 34px -10px rgba(0,0,0,.7);
}
/* ================= v18.28 — DESIGN TEMPLATE: COACHMINT =================
   Sourced from the user's Stitch project (COACHMINT Fitness Operating System).
   Material-3 token set: graphite surfaces, mint primary, JetBrains Mono metrics,
   Space Grotesk display. Scoped under html[data-tpl="coachmint"] — the default
   design stays untouched. Light + dark variants keep the Theme toggle working. */
html[data-tpl="coachmint"]{
  --bg:#E9EDE9; --surface:#FFFFFF; --sidebar:#0E120E;
  --ink:#161A16; --ink2:#4E5A50; --ink3:#849587;
  --line:#D3DAD3; --line2:#E1E6E0;
  --accent:#00C97B; --accent-deep:#008A4D; --accent-ink:#032B18; --accent-soft:#E0F6EB;
  --acc-line:#9ED2B3; --acc-line2:#BCEBDA; --acc-mid:#00B86B; --acc-mid2:#00A862; --acc-stat:#5ED9A4; --acc-chip:#CDEFDF;
  --green:#008A4D; --green-soft:#E0F6EB; --red:#C62828; --red-soft:#FDEBEA;
  --amber:#B26A00; --amber-soft:#FBF1E0; --blue:#1565C0; --blue-soft:#EAF1FB;
  --purple:#6A3AB2; --purple-soft:#F1EBFB;
  --glass:rgba(233,237,233,.85); --glass2:rgba(233,237,233,.92);
  --row-h:#F2F5F1; --seg-bg:#E3E8E2; --seg-on:#FFFFFF; --kbd-bg:#EEF1ED; --cal-hd:#F4F7F3; --cal-alt:#EFF2EE;
  --sh-1:0 1px 2px rgba(12,20,14,.08),0 6px 18px -6px rgba(12,20,14,.14);
  --sh-2:0 12px 32px -8px rgba(12,20,14,.18);
}
html[data-tpl="coachmint"][data-theme="dark"]{
  --bg:#0C0E10; --surface:#1A1C1E; --sidebar:#0C0E10;
  --ink:#E2E2E5; --ink2:#B9CBBC; --ink3:#849587;
  --line:#2C302D; --line2:#242725;
  --accent:#00FF9D; --accent-deep:#00E38B; --accent-ink:#00391F; --accent-soft:rgba(0,255,157,.12);
  --acc-line:rgba(0,255,157,.42); --acc-line2:rgba(0,255,157,.28); --acc-mid:#00E38B; --acc-mid2:#00C97B; --acc-stat:#56FFA8; --acc-chip:rgba(0,255,157,.16);
  --green:#00E38B; --green-soft:rgba(0,255,157,.12); --red:#FFB4AB; --red-soft:rgba(255,180,171,.12);
  --amber:#FFB871; --amber-soft:rgba(255,184,113,.12); --blue:#8AB4F8; --blue-soft:rgba(138,180,248,.12);
  --purple:#C9A7F5; --purple-soft:rgba(201,167,245,.12);
  --glass:rgba(12,14,16,.85); --glass2:rgba(12,14,16,.92);
  --ink-bg:#0C0E10; --btn-dark-bg:#E2E2E5; --btn-dark-fg:#121416;
  --row-h:#1E2022; --seg-bg:#282A2C; --seg-on:#333537; --kbd-bg:#1E2022; --cal-hd:#1A1C1E; --cal-alt:#16181A;
  --sh-1:0 1px 2px rgba(0,0,0,.5); --sh-2:0 14px 34px -10px rgba(0,0,0,.7);
}

.sw{position:relative;width:38px;height:22px;flex:none;display:inline-block}
.sw input{position:absolute;opacity:0}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s;cursor:pointer}
.sw i::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;inset-inline-start:3px;top:3px;transition:.15s;box-shadow:var(--sh-1)}
.sw input:checked+i{background:var(--accent-deep)}
.sw input:checked+i::after{inset-inline-start:calc(100% - 19px)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid var(--line2)}
.set-row:last-child{border-bottom:none}
.set-row .t{font-weight:600;font-size:13.5px}
.set-row .d{font-size:12.5px;color:var(--ink2);margin-top:2px}
/* v17.6 — light-theme polish: sectioning, focus, scrollbars, empty states */
.sec-t{display:flex;align-items:center;gap:10px;margin:24px 0 12px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.sec-t::after{content:'';flex:1;height:1px;background:var(--line)}
.sec-t .bdg{letter-spacing:0}
html[lang="fa"] .sec-t{letter-spacing:0}
.stat{transition:transform .18s,box-shadow .18s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.stat .icw{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-deep);flex:none}
button:focus-visible,[data-act]:focus-visible,a:focus-visible,.tab:focus-visible,.fchip:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px;border-radius:8px}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid var(--bg)}
*::-webkit-scrollbar-thumb:hover{background:var(--ink3)}
*::-webkit-scrollbar-track{background:transparent}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:26px 20px;text-align:center;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty b{color:var(--ink2);font-size:13.5px}
.empty .muted{font-size:12.5px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:14px}
.cgrid .card{padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.cgrid .card:hover{border-color:var(--acc-line);box-shadow:var(--sh-2);transform:translateY(-1px)}
/* v17.11 — onboarding wizard */
.onb-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.onb-opt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;text-align:start;transition:border-color .15s,background .15s;color:var(--ink)}
.onb-opt:hover{border-color:var(--ink3)}
.onb-opt.on{border-color:var(--accent-deep);background:var(--accent-soft);color:var(--accent-ink)}
.onb-dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .2s}
.onb-dot.on{background:var(--accent-deep)}
@media(max-width:520px){.onb-grid{grid-template-columns:1fr}}
.cal-grid{display:grid;grid-template-columns:56px repeat(7,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.cal-hd{padding:10px 6px;text-align:center;border-bottom:2px solid var(--line);border-inline-start:1px solid var(--line2);font-size:12px;font-weight:700;color:var(--ink2);background:var(--cal-hd)}
.cal-hd.today{color:var(--accent-ink);background:var(--accent-soft)}
.cal-hd.click{cursor:pointer;transition:.12s}
.cal-hd.click:hover{background:var(--accent-soft)}
.cal-hd span{display:block;font-weight:600;font-size:11px;color:var(--ink3)}
.cal-hd.today span{color:var(--accent-ink)}
.cal-time{font-size:10.5px;font-weight:600;color:var(--ink3);text-align:end;padding:4px 8px 0 0;border-top:1px solid var(--line2);height:48px}
.cal-col{position:relative;border-inline-start:1px solid var(--line2);min-height:624px;cursor:cell}
.cal-col.droptarget{background:var(--accent-soft)!important}
.ev{position:absolute;border-radius:8px;padding:5px 8px;font-size:11.5px;font-weight:600;cursor:grab;border:1px solid;line-height:1.3;overflow:hidden;box-shadow:var(--sh-1);z-index:4}
.ev b{display:block;font-size:11.5px}.ev small{font-weight:500;opacity:.85;font-size:10.5px}
.ev:hover{filter:brightness(.97);box-shadow:var(--sh-2);z-index:8}
.ev-session{background:var(--accent-soft);border-color:var(--acc-line);color:var(--accent-ink);border-inline-start:3px solid var(--accent-deep)}
.ev-assess{background:var(--blue-soft);border-color:#C3D9FA;color:#1D4ED8;border-inline-start:3px solid var(--blue)}
.ev-meas{background:var(--purple-soft);border-color:#DDD0F9;color:#6D28D9;border-inline-start:3px solid var(--purple)}
.ev-appt{background:var(--amber-soft);border-color:#EFD9AE;color:#A15C0B;border-inline-start:3px solid var(--amber)}
.nowline{position:absolute;left:4px;right:4px;height:2px;background:var(--red);z-index:7;pointer-events:none}
.nowline::before{content:'';position:absolute;inset-inline-start:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.nowline::after{content:'NOW';position:absolute;inset-inline-end:4px;top:-9px;font-size:8px;font-weight:800;letter-spacing:.08em;background:var(--red);color:#fff;padding:1px 5px;border-radius:99px}
.calk{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.calk .card{padding:12px 14px}
.calk .v{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mcal .mh{padding:10px;text-align:center;font-size:11px;font-weight:700;color:var(--ink3);border-bottom:1px solid var(--line);background:var(--cal-hd)}
.mday{min-height:100px;border-inline-start:1px solid var(--line2);border-top:1px solid var(--line2);padding:8px;font-size:12.5px;color:var(--ink2)}
.mday.today{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.mday.click{cursor:pointer;transition:.12s}
.mday.click:hover{background:var(--row-h)}
.mdots{display:flex;gap:3px;margin-top:8px;flex-wrap:wrap}
.mdot{width:7px;height:7px;border-radius:50%}
.exb{display:flex;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:10px;box-shadow:var(--sh-1);transition:border-color .15s,box-shadow .15s,transform .15s}
/* v18.11 tier-3 — builder blocks feel like cards: lime edge + numbered lime badge + hover lift */
.exb{border-inline-start:3px solid var(--acc-line)}
.exb:hover{border-color:var(--acc-line);box-shadow:var(--sh-2);transform:translateY(-1px)}
.exb.dragging{opacity:.35}.exb.over{border-color:var(--accent-deep);box-shadow:0 0 0 3px var(--accent-soft)}
.grip{cursor:grab;color:var(--ink3);padding:6px 0}
.ex-num{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--acc-mid));display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--accent-ink);flex:none;margin-top:4px}
.ex-main{flex:1;min-width:0}
.mi{display:flex;flex-direction:column;gap:3px}
.mi span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)}
.mi input{width:64px;border:1px solid var(--line);border-radius:8px;padding:6px 7px;font-size:13px;font-weight:600;text-align:center;outline:none;background:var(--surface)}
.ex-grid{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.wk-it{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.wk-it.done{color:var(--ink3)}.wk-it.done .ic{color:var(--green)}
.wk-it.cur{background:var(--accent-soft);color:var(--accent-ink)}
/* v18.39 — challenge journey path: the current node pulses */
.ch-pulse{animation:chp 1.8s ease-in-out infinite}
@keyframes chp{0%,100%{opacity:.55}50%{opacity:.1}}
.excards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.exc{padding:16px;display:flex;flex-direction:column;gap:10px}
.exc .nm{font-weight:700;font-size:14px}
.exc .meta{font-size:12.5px;color:var(--ink2)}
.tcard{padding:18px;display:flex;flex-direction:column;gap:12px}
.photo{position:relative;height:340px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(160deg,#E9E9E4,#D8D8D2)}
.photo.after{position:absolute;inset:0;clip-path:inset(0 0 0 var(--cut,50%));background:linear-gradient(160deg,#DDE8CE,#C4D6A6)}
.photo .tag{position:absolute;top:10px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(18,21,27,.65);color:#fff;z-index:2}
.handle{position:absolute;top:0;bottom:0;left:var(--cut,50%);width:2px;background:var(--accent-deep);z-index:3}
.handle::after{content:'⟷';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;background:var(--surface);border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--ink2);box-shadow:var(--sh-1)}
.photo figcaption{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink3)}
.login{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.login-left{background:var(--sidebar);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-left::before{content:'';position:absolute;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(200,240,75,.16),transparent 62%);top:-160px;inset-inline-end:-160px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--accent)}
.lfeat{display:flex;flex-direction:column;gap:13px;position:relative}
.lfeat>div{display:flex;gap:11px;align-items:center;color:#C6CBD6;font-size:14.5px}
.lfeat .ic{color:var(--accent)}
.lquote{position:relative;max-width:420px;border-inline-start:3px solid var(--accent);padding-inline-start:16px;color:#C6CBD6;font-size:14px}
.lq-a{margin-top:8px;font-size:12px;color:#7A8291}
.login-right{display:flex;align-items:center;justify-content:center;padding:40px;background:var(--bg)}
.login-card{width:100%;max-width:400px}
.lrow{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink2);font-weight:500}
.chk input{accent-color:var(--accent-deep);width:15px;height:15px}
.divider{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:12px;margin:18px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.rolecard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:start;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--surface);cursor:pointer;transition:.15s}
.rolecard:hover{border-color:var(--accent-deep);box-shadow:0 0 0 3px var(--accent-soft);transform:translateY(-2px)}
.rolecard b{font-size:15.5px}
/* ================= v18.41 — CINEMATIC 3D WELCOME / UNLOCK (students) =================
   Full-screen stage that replaces the demo picker for the join flow: glowing
   padlock, orbiting rings, drifting particles, a perspective grid — and the
   portal opens by DRAGGING THE HANDLE TO THE RIGHT. --ux (0..1, set by JS)
   physically opens the shackle, spins the rings, intensifies the glow and
   tilts the scene; past the threshold the lock bursts open (shockwave + zoom)
   and the device binds to the profile. Always dark — a stage, not a form. */
.unlock{position:fixed;inset:0;z-index:6;overflow:hidden;user-select:none;-webkit-user-select:none;background:radial-gradient(120% 90% at 50% 0%,#151A24 0%,#0A0B0E 55%,#050608 100%);perspective:1100px}
.un-stage{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(calc(var(--ux,0)*9deg + var(--py,0deg)));transition:transform .18s ease-out}
.un-glow{position:absolute;left:50%;top:34%;width:620px;height:620px;transform:translate(-50%,-50%) translateZ(-120px);background:radial-gradient(circle,rgba(200,240,75,.22),rgba(200,240,75,.05) 42%,transparent 68%);opacity:calc(.5 + var(--ux,0)*.5);pointer-events:none}
.un-grid{position:absolute;inset-inline:-20%;bottom:-14%;height:48%;transform:translateZ(-170px) rotateX(62deg);background:linear-gradient(rgba(200,240,75,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(200,240,75,.14) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:linear-gradient(to top,#000 26%,transparent 90%);mask-image:linear-gradient(to top,#000 26%,transparent 90%);opacity:.55;pointer-events:none}
.un-dot{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--accent);animation:unfloat 7s ease-in-out infinite;pointer-events:none}
@keyframes unfloat{0%,100%{transform:translate3d(0,0,var(--z,0px))}50%{transform:translate3d(16px,-30px,var(--z,0px))}}
.un-rings{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) translateZ(40px) rotate(calc(var(--ux,0)*140deg));pointer-events:none}
.un-ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1.5px solid rgba(200,240,75,.4);transform:translate(-50%,-50%)}
/* v18.47 — the big dashed circle is the dumbbell's FRAME: the bar sits exactly
   on its center (like the reference screenshot). 260px keeps circle + hint +
   card inside one viewport. */
.un-ring.r1{width:260px;height:260px;border-style:dashed;opacity:.8;animation:unspin 14s linear infinite}
.un-ring.r2{width:330px;height:330px;opacity:.4;animation:unspin 24s linear infinite reverse}
.un-ring.r3{width:405px;height:405px;opacity:.2;animation:unspin 38s linear infinite}
@keyframes unspin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
/* v18.47 — the dumbbell sits in normal flow inside .un-hold (grid-centered),
   so it is EXACTLY centered in the big dashed circle (position:absolute from
   the padlock era broke place-items:center). */
.un-lock{position:relative;transform:translateY(calc(var(--ux,0)*-30px)) rotate(calc(var(--ux,0)*-3deg)) scale(calc(1 + var(--ux,0)*.07));animation:unbob 5.5s ease-in-out infinite;pointer-events:none}
@keyframes unbob{0%,100%{margin-top:0}50%{margin-top:-9px}}
.un-lock svg{filter:drop-shadow(0 0 22px rgba(200,240,75,.4)) drop-shadow(0 18px 40px rgba(0,0,0,.6))}
/* v18.44 — HOLD-TO-LIFT: the dumbbell itself is the button (isometric hold,
   like a plank). Holding fills a progress ring around it, the plates glow
   toward the center, the whole bar LIFTS, rings/particles accelerate — and
   at 100% it bursts into the portal. Replaces slide-to-unlock. */
.un-hold{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) translateZ(80px);width:260px;height:260px;display:grid;place-items:center;cursor:grab;touch-action:none;z-index:3;-webkit-tap-highlight-color:transparent}
.un-hold.dis{cursor:not-allowed}
.un-hold.dis .un-lock{opacity:.45}
.un-hold:active{cursor:grabbing}
/* v18.47 — the floating hint line was removed (it collided with the card on
   short viewports); the instruction lives in the FOOT status instead, with
   the pulsing hand icon. */
.un-hintline{display:inline-flex;gap:7px;align-items:center}
.un-hintline .ic{color:var(--accent);animation:unpulse 1.5s ease-in-out infinite}
@keyframes unpulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
.holding .un-ring.r1{animation-duration:3.5s}.holding .un-ring.r2{animation-duration:6s}.holding .un-ring.r3{animation-duration:9s}
.holding .un-dot{animation-duration:2.2s}
/* v18.42 — the hero is a 3D DUMBBELL (sporty element, not a padlock): the
   plates slide toward the center as the handle moves (inner plates travel
   farther than the outer ones for depth) and SLAM home on unlock. The
   CoachMint bolt rides the bar between them. */
.un-plate{transition:transform .18s ease-out}
.un-plate.li{transform:translateX(calc(var(--ux,0)*22px))}
.un-plate.ri{transform:translateX(calc(var(--ux,0)*-22px))}
.un-plate.lo{transform:translateX(calc(var(--ux,0)*8px))}
.un-plate.ro{transform:translateX(calc(var(--ux,0)*-8px))}
.un-shock{position:absolute;left:50%;top:34%;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:2.5px solid var(--accent);opacity:0;transform:translateZ(60px);pointer-events:none}
.un-card{position:absolute;left:50%;top:71%;transform:translate(-50%,-50%) translateZ(34px);width:min(440px,90vw);text-align:center}
/* v18.45 — the progress ring IS the avatar's halo: the photo sits in the
   center of the hold ring, so the user literally "fills themselves up" while
   holding. Typography: eyebrow → greeting → big name → coach chip. */
.un-avwrap{position:relative;width:100px;height:100px;margin:0 auto;display:grid;place-items:center}
.un-avwrap .av{box-shadow:0 0 0 4px rgba(200,240,75,.14),0 14px 34px -10px rgba(0,0,0,.75)}
.un-avwrap .av img{transition:transform .2s ease-out}
.un-avwrap .av img,.un-avwrap .av{transform:scale(calc(1 + var(--ux,0)*.06))}
.un-avring{position:absolute;inset:0;transform:rotate(-90deg)}
.un-avring .bg{stroke:rgba(255,255,255,.08)}
.un-avring .fg{stroke:var(--accent);stroke-linecap:round;filter:drop-shadow(0 0 7px rgba(200,240,75,.65));transition:stroke-dashoffset .1s linear}
.un-sub{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.un-hi{font-size:13.5px;font-weight:600;color:#8A90A0;margin-top:10px}
.un-name{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;color:#F5F6F8;margin-top:3px;line-height:1.15}
.un-meta{font-size:12.5px;color:#8A90A0;margin-top:10px;letter-spacing:.05em}
/* v18.49 — Persian is a CONNECTED script: any letter-spacing pulls the
   letters apart and looks broken — reset all card text to 0 for FA. */
html[lang="fa"] .un-hi,html[lang="fa"] .un-name,html[lang="fa"] .un-meta,html[lang="fa"] .un-sub{letter-spacing:0}
.un-coach{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:6px 14px 6px 8px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:12px;font-weight:700;color:#C6CBD6}
.un-coach .av{box-shadow:none}
.un-codebox{display:flex;gap:8px;margin:16px auto 0;max-width:360px}
.un-codebox .inp{flex:1;background:rgba(255,255,255,.06);border-color:rgba(200,240,75,.3);color:#F5F6F8}
.un-pick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.un-chip{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:99px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);color:#E8EAF0;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.un-chip.on{border-color:var(--accent);background:rgba(200,240,75,.12);box-shadow:0 0 0 3px rgba(200,240,75,.12)}
/* v18.44 — the slide track was removed; the dumbbell itself is the hold target */
.un-foot{position:absolute;left:50%;bottom:calc(3.5vh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:16px;align-items:center;font-size:11.5px;color:#7A8291;white-space:nowrap}
.un-foot .lnk{color:#A9B2C3}
.un-fsep{color:#414856;font-weight:800}
/* unlock burst: rings blow out, shackle springs open, shockwave expands, the
   whole stage zooms toward the viewer, then the portal renders */
.unlocked .un-ring{animation:unburst .85s ease-out forwards}
@keyframes unburst{to{transform:translate(-50%,-50%) scale(2.7);opacity:0}}
.unlocked .un-plate.li{animation:unslamL .55s cubic-bezier(.34,1.56,.64,1) forwards}
.unlocked .un-plate.ri{animation:unslamR .55s cubic-bezier(.34,1.56,.64,1) forwards}
.unlocked .un-plate.lo{animation:unslamLo .55s cubic-bezier(.34,1.56,.64,1) forwards}
.unlocked .un-plate.ro{animation:unslamRo .55s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes unslamL{to{transform:translateX(28px)}}
@keyframes unslamR{to{transform:translateX(-28px)}}
@keyframes unslamLo{to{transform:translateX(10px)}}
@keyframes unslamRo{to{transform:translateX(-10px)}}
.unlocked .un-shock{animation:unshock .95s ease-out forwards}
@keyframes unshock{0%{opacity:.95;transform:translateZ(60px) scale(1)}100%{opacity:0;transform:translateZ(60px) scale(7.5)}}
.unlocked .un-stage{animation:unzoom .95s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes unzoom{55%{opacity:1}100%{transform:translateZ(380px);opacity:0}}
.unlocked .un-card{animation:none;opacity:0;transition:opacity .4s}
.unlocked .un-lock{animation:unpop .6s ease-out forwards}
@keyframes unpop{35%{transform:translateY(-30px) scale(1.16)}100%{transform:translateY(-30px) scale(1.05);opacity:0}}
.unlocked .un-card{opacity:0;transition:opacity .3s}
@media (prefers-reduced-motion:reduce){.un-dot,.un-ring,.un-lock{animation:none}.un-stage{transition:none}}
.ric{width:44px;height:44px;border-radius:13px;display:grid;place-items:center}
.pickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 18px}
.pickc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;font-size:11.5px;font-weight:600;color:var(--ink2);transition:.12s}
.pickc.on{border-color:var(--accent-deep);background:var(--accent-soft);color:var(--accent-ink)}
.pal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;justify-content:center;align-items:flex-start;padding-top:11vh;backdrop-filter:blur(3px)}
.pal-box{width:100%;max-width:600px;max-height:68vh;background:var(--surface);border-radius:16px;box-shadow:var(--sh-2);display:flex;flex-direction:column;overflow:hidden;animation:pop .15s}
.pal-in{display:flex;gap:10px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line2)}
.pal-in input{flex:1;border:none;outline:none;font-size:15px;background:none;color:var(--ink)}
.pal-res{overflow-y:auto;padding:8px}
.pal-sec{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--ink3);padding:9px 10px 4px}
.pal-it{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:13.5px}
.pal-it .ic{color:var(--ink3)}
.pal-it.sel,.pal-it:hover{background:var(--accent-soft)}
.pal-it .arrow{margin-inline-start:auto;color:var(--ink3)}
#toasts{position:fixed;inset-inline-end:20px;bottom:20px;z-index:120;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink-bg);color:#fff;padding:11px 16px;border-radius:12px;box-shadow:var(--sh-2);font-size:13.5px;font-weight:500;animation:slide .2s}
.toast .ic{color:var(--accent)}
@keyframes slide{from{transform:translateY(8px);opacity:0}}
.bub{max-width:78%;padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.45}
.bub.me{background:var(--ink-bg);color:#fff;border-end-end-radius:6px}
.bub.them{background:var(--surface);border:1px solid var(--line);border-end-start-radius:6px}
.bub .ctx{display:inline-flex;font-size:10.5px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink);padding:2px 8px;border-radius:6px;margin-bottom:5px}
.bub.me .ctx{background:rgba(255,255,255,.16);color:#fff}
.vid{width:220px;max-width:100%;height:118px;border-radius:12px;background:linear-gradient(150deg,#1B2029,#0D0F13);display:grid;place-items:center;color:#fff;position:relative;cursor:pointer;margin-top:4px}
.vid .dur{position:absolute;bottom:6px;inset-inline-end:8px;font-size:10.5px;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:6px}
.vid .lbl{position:absolute;top:6px;inset-inline-start:8px;font-size:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:1px 7px;border-radius:6px}
.composer{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line2);background:var(--surface)}
.clientwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px;background:var(--bg)}
.phone{width:410px;max-width:100%;height:min(870px,94vh);background:var(--bg);border:10px solid #0D0F13;border-radius:48px;box-shadow:0 30px 70px -25px rgba(13,15,19,.5);overflow:hidden;position:relative;display:flex;flex-direction:column;flex:none}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:26px;background:#0D0F13;border-radius:99px;z-index:6}
.capp{flex:1;overflow-y:auto;scrollbar-width:thin;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.chead{position:sticky;top:0;background:var(--glass2);backdrop-filter:blur(10px);padding:52px 16px 12px;padding-top:calc(52px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:5}
.cbody{padding:14px 14px 96px;display:flex;flex-direction:column;gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh-1)}
.cstat{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.cempty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 20px;text-align:center;color:var(--ink2)}
.cnav{position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:8px 8px 22px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:7}
.cnav-it{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--ink3);cursor:pointer;padding:5px 0;border-radius:10px;position:relative}
.cnav-it.on{color:var(--accent-deep)}
.cdot{position:absolute;top:4px;inset-inline-end:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--red)}
.cplayer{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.cphead{display:flex;align-items:center;gap:6px;padding:48px 12px 10px;padding-top:calc(48px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line2)}
.cpbody{flex:1;overflow-y:auto;padding:14px}
.cpfoot{padding:12px 14px 24px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line2);background:var(--surface)}
.setrow{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;margin-top:7px;background:var(--surface);transition:.15s}
.setrow.on{background:var(--accent-soft);border-color:var(--acc-line)}
.ckb{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;background:var(--surface);flex:none;cursor:pointer;padding:0}
.ckb.on{background:var(--accent-deep);border-color:var(--accent-deep)}
.rpe{width:25px;height:22px;border-radius:7px;border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--ink2);background:var(--surface);cursor:pointer;padding:0}
.rpe.on{background:var(--ink-bg);color:#fff;border-color:var(--ink-bg)}
.restbar{background:var(--accent-soft);border:1px solid var(--acc-line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
/* client portal — black chrome, green brand accents */
.phone .card-t{color:var(--accent-deep)}
.phone .chead{background:linear-gradient(180deg,#12151B,#171B22);color:#fff;border-bottom:1px solid rgba(200,240,75,.16)}
.phone .chead .muted{color:rgba(255,255,255,.55);font-weight:600}
.phone .chead .gbadge{background:rgba(200,240,75,.14);color:var(--accent);border:1px solid rgba(200,240,75,.25)}
.phone .chip{background:var(--accent-soft);color:var(--accent-ink)}
.phone .fchip{background:var(--accent-soft);border-color:var(--acc-chip);color:var(--accent-ink)}
.phone .fchip:hover{background:var(--accent);color:var(--accent-ink)}
.phone .seg{background:var(--accent-soft)}
.phone .seg button.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.phone .pbar{background:var(--accent-soft)}
.phone .pbar i{background:linear-gradient(90deg,var(--accent-deep),var(--accent))}
/* v18.14 — Fitness+-inspired client app: the phone is ALWAYS true-black with
   dark-gray cards, regardless of the coach theme (Apple Fitness+ never goes
   light inside the app). Scoped via CSS vars on .phone so every nested
   component (chips, inputs, bars) adapts without touching markup. */
/* v18.23 — FitFlow redesign (UI inspiration board): charcoal panels on
   near-black, acid-lime accents, glowing progress, fine hairlines. Same
   markup, new skin — content untouched. */
/* v18.27 — PHONE SKINS: the client app ships 4 selectable themes. The base
   rules below are the shared dark skeleton; each skin overrides the palette
   via .phone[data-skin=…]. Default = fitflow. Chosen in Profile → App Theme,
   persisted in PREFS.phoneSkin (per device, like theme/accent). */
.phone{--surface:#15171C;--line:#262A31;--line2:#1F232A;--ink:#F5F6F8;--ink2:#B4B9C4;--ink3:#7E8492;
  --row-h:#1C2026;--seg-bg:#22262D;--seg-on:#2B3038;--kbd-bg:#1C2026;--cal-hd:#1B1F25;--cal-alt:#171A1F;
  --glass:rgba(5,6,8,.88);--glass2:rgba(5,6,8,.92);--btn-dark-bg:#F5F6F8;--btn-dark-fg:#12151B;
  background:#0A0B0E;color:var(--ink)}
.phone .ccard{box-shadow:none;background:linear-gradient(180deg,#171A20,#14161B);border:1px solid #23272F;border-radius:18px;position:relative}
.phone .ccard::before{content:'';position:absolute;top:0;inset-inline:14px;height:1px;background:linear-gradient(90deg,transparent,rgba(200,240,75,.28),transparent);pointer-events:none}
.phone .chip{background:#22262D;color:#E9EAEE;border:1px solid #2E333B}
.phone .fchip{background:#1C2026;border-color:#2E333B;color:#B4B9C4}
.phone .fchip.on,.phone .fchip:hover{background:rgba(200,240,75,.1);border-color:var(--accent);color:var(--accent)}
.phone .inp,.phone .sel,.phone .ta{background:#1C2026;border-color:#2E333B;color:var(--ink)}
.phone .tbl th{color:#7E8492}.phone .tbl td{border-color:#1F232A}
.phone .tbl tbody tr[data-act]:hover td:first-child{box-shadow:none}
/* Fitness+ check-in segments: dark pills, selected = lime outline + lime text */
.phone .seg{background:transparent;gap:6px}
.phone .seg button{flex:1;background:#1C2026;border:1.5px solid transparent;border-radius:10px;color:#B4B9C4}
.phone .seg button.on{background:rgba(200,240,75,.08);border-color:var(--accent);color:var(--accent);box-shadow:none}
/* FitFlow bottom tab bar: charcoal glass, active = lime icon + label + glow dot */
.phone .cnav,.mshell .cnav{background:rgba(13,15,19,.9);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.06)}
.phone .cnav-it,.mshell .cnav-it{color:#6B7280}
.phone .cnav-it.on,.mshell .cnav-it.on{color:var(--accent);background:none}
.phone .cnav-it.on::after{content:'';position:absolute;top:0;inset-inline:calc(50% - 9px);width:18px;height:2.5px;border-radius:99px;background:var(--accent);box-shadow:0 0 10px rgba(200,240,75,.7)}
/* FitFlow gradient hero card — charcoal base with lime energy glow */
.fhero{position:relative;overflow:hidden;border-radius:20px;padding:18px;color:#fff;border:1px solid #2A2F38;
  background:radial-gradient(110% 90% at 88% 0%,rgba(200,240,75,.16),transparent 55%),
             radial-gradient(130% 110% at 8% 100%,rgba(200,240,75,.07),transparent 55%),
             linear-gradient(150deg,#1B1F26,#14161B 60%,#101318)}
.fhero.pink{background:radial-gradient(110% 90% at 85% 5%,rgba(235,150,90,.2),transparent 55%),
             radial-gradient(130% 110% at 10% 95%,rgba(186,56,138,.14),transparent 60%),
             linear-gradient(150deg,#1B1F26,#14161B 60%,#101318)}
.fhero .card-t{color:rgba(255,255,255,.85)}
.fhero .chip{background:rgba(0,0,0,.3);color:#fff;border:1px solid rgba(255,255,255,.08)}
.fhero .glass{width:100%;justify-content:center;background:rgba(0,0,0,.32);backdrop-filter:blur(6px);color:#fff;border-radius:13px;font-weight:700;border:1px solid rgba(255,255,255,.09)}
/* FitFlow big lime CTA — glow shadow */
.btn-lime{width:100%;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--acc-mid));color:#141A05;font-weight:800;border-radius:14px;padding:13px 16px;font-size:14px;box-shadow:0 6px 22px -6px rgba(200,240,75,.45)}
.btn-lime:hover{filter:brightness(1.05)}
/* FitFlow weekly letter circles — glowing done state */
.wkc{display:flex;gap:7px}
.wkc i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12.5px;background:#1C2026;color:#8A90A0;flex:none;border:1px solid #262B33}
.wkc i.done{background:rgba(200,240,75,.14);color:var(--accent);border-color:rgba(200,240,75,.35);box-shadow:0 0 12px -2px rgba(200,240,75,.35)}
.wkc i.today{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
/* FitFlow pill filter row */
.fpills{display:flex;gap:8px;flex-wrap:wrap}
.fpill{padding:8px 16px;border-radius:999px;background:#1C2026;color:#B4B9C4;font-size:12.5px;font-weight:700;border:1.5px solid transparent;cursor:pointer}
.fpill.on{background:rgba(200,240,75,.08);border-color:var(--accent);color:var(--accent)}
/* v18.24 — FitFlow workout card: dark photo-hero style (charcoal gradient
   banner, chips on top, big title + subtitle at the bottom, like the board's
   "Upper Body Power" card). */
.wcard{position:relative;display:flex;flex-direction:column;min-height:190px;border-radius:20px;padding:14px;color:#fff;border:1px solid #2A2F38;overflow:hidden;
  background:radial-gradient(120% 80% at 85% 0%,rgba(200,240,75,.13),transparent 55%),
             radial-gradient(140% 110% at 10% 100%,rgba(200,240,75,.05),transparent 55%),
             linear-gradient(160deg,#232830,#15171C 65%,#101318)}
.wcard-top{display:flex;justify-content:space-between;align-items:center}
.wcard .btn-lime{box-shadow:0 6px 18px -6px rgba(200,240,75,.5)}
/* ================= v18.27 — SKIN VARIANTS =================
   Each skin re-themes the SAME components: canvas, card gradient, hairline
   color, chip/segment fills, nav, hero/workout-card glows. The lime accent
   of the coach theme is replaced by the skin's own accent so the client app
   feels like a distinct product theme. */
/* CARBON — pure black, white accents, minimal (Apple Fitness style) */
.phone[data-skin="carbon"]{background:#000}
.phone[data-skin="carbon"] .ccard{background:linear-gradient(180deg,#111214,#0C0D0F);border-color:#1E2126}
.phone[data-skin="carbon"] .ccard::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent)}
.phone[data-skin="carbon"] .chip{background:#17181B;border-color:#26282D}
.phone[data-skin="carbon"] .fchip,.phone[data-skin="carbon"] .inp,.phone[data-skin="carbon"] .sel,.phone[data-skin="carbon"] .ta,.phone[data-skin="carbon"] .seg button,.phone[data-skin="carbon"] .fpill,.phone[data-skin="carbon"] .wkc i,.phone[data-skin="carbon"] .pbar,.phone[data-skin="carbon"] .set-row{background:#141518;border-color:#24262B}
.phone[data-skin="carbon"] .fchip.on,.phone[data-skin="carbon"] .seg button.on,.phone[data-skin="carbon"] .fpill.on{background:rgba(255,255,255,.08);border-color:#fff;color:#fff}
.phone[data-skin="carbon"] .cnav,.phone[data-skin="carbon"] .cnav-it.on::after{background:#050506}
.phone[data-skin="carbon"] .cnav-it.on{color:#fff}

.phone[data-skin="carbon"] .fhero,.phone[data-skin="carbon"] .wcard{background:radial-gradient(110% 90% at 88% 0%,rgba(255,255,255,.1),transparent 55%),linear-gradient(150deg,#17181C,#0E0F11 60%,#0A0B0D);border-color:#22242A}
.phone[data-skin="carbon"] .btn-lime{background:linear-gradient(135deg,#FFFFFF,#D6D8DD);color:#0A0B0D;box-shadow:0 6px 22px -6px rgba(255,255,255,.35)}
.phone[data-skin="carbon"] .wkc i.done{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4);box-shadow:0 0 12px -2px rgba(255,255,255,.3)}
.phone[data-skin="carbon"] .pbar i{background:linear-gradient(90deg,#B9BCC4,#FFFFFF);box-shadow:0 0 10px -2px rgba(255,255,255,.5)}
.phone[data-skin="carbon"] .card-t svg,.phone[data-skin="carbon"] .cempty svg{color:#E9EAEE}
/* OCEAN — deep navy, cyan accents (calm water) */
.phone[data-skin="ocean"]{background:#060B14}
.phone[data-skin="ocean"] .ccard{background:linear-gradient(180deg,#0D1524,#0A101C);border-color:#16233A}
.phone[data-skin="ocean"] .ccard::before{background:linear-gradient(90deg,transparent,rgba(56,189,248,.35),transparent)}

.phone[data-skin="ocean"] .fchip.on,.phone[data-skin="ocean"] .seg button.on,.phone[data-skin="ocean"] .fpill.on{background:rgba(56,189,248,.1);border-color:#38BDF8;color:#7DD3FC}

.phone[data-skin="ocean"] .fhero,.phone[data-skin="ocean"] .wcard{background:radial-gradient(110% 90% at 88% 0%,rgba(56,189,248,.16),transparent 55%),radial-gradient(130% 110% at 8% 100%,rgba(14,116,144,.14),transparent 55%),linear-gradient(150deg,#0E1B30,#0A1220 60%,#070D18);border-color:#1C2C47}
.phone[data-skin="ocean"] .btn-lime{background:linear-gradient(135deg,#38BDF8,#0EA5E9);color:#04121D;box-shadow:0 6px 22px -6px rgba(56,189,248,.5)}
.phone[data-skin="ocean"] .wkc i.done{background:rgba(56,189,248,.14);color:#7DD3FC;border-color:rgba(56,189,248,.4);box-shadow:0 0 12px -2px rgba(56,189,248,.4)}
.phone[data-skin="ocean"] .pbar i{background:linear-gradient(90deg,#0EA5E9,#38BDF8);box-shadow:0 0 10px -2px rgba(56,189,248,.6)}
.phone[data-skin="ocean"] .card-t svg,.phone[data-skin="ocean"] .cempty svg{color:#38BDF8}
/* SUNSET — warm plum, amber accents (energetic evening) */
.phone[data-skin="sunset"]{background:#120A10}
.phone[data-skin="sunset"] .ccard{background:linear-gradient(180deg,#1D1220,#150D17);border-color:#2E1F30}
.phone[data-skin="sunset"] .ccard::before{background:linear-gradient(90deg,transparent,rgba(251,146,60,.35),transparent)}

.phone[data-skin="sunset"] .fchip.on,.phone[data-skin="sunset"] .seg button.on,.phone[data-skin="sunset"] .fpill.on{background:rgba(251,146,60,.1);border-color:#FB923C;color:#FDBA74}

.phone[data-skin="sunset"] .cnav-it.on{color:#FB923C}

/* FitFlow big bold section headers + tiny uppercase eyebrow */
.csec{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin:4px 2px -2px}
html[lang="fa"] .csec{letter-spacing:0}
.phone .card-t{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8A90A0}
html[lang="fa"] .phone .card-t{letter-spacing:0}
.phone .card-t svg{color:var(--accent)}
/* FitFlow stat strip (streak card) — lime gradient kept, glow added */
.phone .cstat{border:none;border-radius:18px;box-shadow:0 8px 26px -10px rgba(200,240,75,.5)}
.phone .cnav{background:#0D0F13;border-top:1px solid rgba(255,255,255,.07)}
.phone .cnav-it{color:#8A90A0}
.phone .cnav-it.on{color:var(--accent);background:none}
.phone .bub.me{background:var(--accent);color:var(--accent-ink);border:none}
.phone .bub.me .ctx{background:rgba(20,28,5,.14);color:var(--accent-ink)}
.phone .rpe.on{background:var(--accent-deep);border-color:var(--accent-deep)}

/* v18.40 — LUCIDE ICON BANK bridge. Resolution order in ic(): the legacy P
   map above first (zero visual regression for existing screens), then
   LUCIDE_ALIAS, then ANY Lucide kebab name — new UI can simply write
   ic('heart-pulse') / ic('medal') / ic('crown') / ic('dumbbell-…'). */
const LUCIDE_ALIAS={grid:'layout-grid',stack:'layers',note:'file-text',gear:'settings',help:'circle-help',edit:'pencil',trash:'trash-2',more:'ellipsis',camflip:'refresh-ccw',grip:'grip-vertical',cart:'shopping-cart',refresh:'rotate-cw',qr:'qr-code',robot:'bot',stopwatch:'timer',chart:'chart-line',chevL:'chevron-left',chevR:'chevron-right',chevD:'chevron-down',arrowR:'arrow-right'};
const lucideSvg=name=>{
  const L=window.lucide||window.Lucide;if(!L||!name)return '';
  const pk=String(name).split('-').filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join('');
  const node=(L.icons&&L.icons[pk])||L[pk];
  if(!Array.isArray(node))return '';
  return node.map(nd=>{const t=nd[0],a=nd[1]||{};
    const at=Object.keys(a).map(k=>`${k}="${a[k]}"`).join(' ');
    return `<${t}${at?' '+at:''}/>`}).join('');
};
const ic=(n,s=16)=>{
  const inner=P[n]||lucideSvg(LUCIDE_ALIAS[n])||lucideSvg(n);
  return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`};
const CM=(s=18)=>`<svg width="${s}" height="${Math.round(s*100/120)}" viewBox="0 0 120 100" fill="none" style="display:block" aria-hidden="true"><path d="M36 6L116 6 94 30 56 30 44 50 56 70 94 70 116 94 4 94Z" fill="currentColor"/></svg>`;

/* Coach-configurable calendar working hours (e.g. 08:00 → 24:00).
   Sanitizes stored values: start 0–23.5, end start+1…24, always on the half hour. */
function calHours(){
  const q=v=>{const n=Math.round((+v)*2)/2;return Number.isFinite(n)?n:null};
  let s=q(PREFS.cal&&PREFS.cal.start);if(s==null)s=7;
  let e=q(PREFS.cal&&PREFS.cal.end);if(e==null)e=21;
  s=Math.max(0,Math.min(23.5,s));
  e=Math.max(s+1,Math.min(24,e));
  return {start:s,end:e};
}

   coach B signs in on the SAME device; the local arrays (and STORE_KEY) still
   held A's clients, and the first sync "seeded" B's empty workspace with them
   — so A's clients appeared under B too. Every saved payload now carries the
   coach id it belongs to; on login/signup as a DIFFERENT coach the local
   workspace is wiped (and the previous account's parked codes dropped) before
   any sync can run. Same coach returning to the device keeps offline edits. */
let DATA_OWNER=null;
function adoptAccount(acct){
  const id=(acct&&acct.id)||'';
  if(!id)return;
  if(!DATA_OWNER||DATA_OWNER!==id){
    // No owner stamp (fresh device / demo seed) or a DIFFERENT coach was last:
    // the local bytes must never reach the new coach's workspace.
    freshWorkspace();
    try{localStorage.removeItem('co-legacy-ws')}catch(e){}
    if(DATA_OWNER&&DATA_OWNER!==id){try{localStorage.removeItem('co-ws')}catch(e){}}
  }
  DATA_OWNER=id;
  saveData();
}
function saveData(){
  let payload='';
  try{
    payload=JSON.stringify({v:13,owner:DATA_OWNER,ownerName:wsOwnerName(),CLIENTS,EVENTS,NOTES,MSGS,TEMPLATES,FILES,BUILDER,NPLANS,MTPL,PTPL,NHIST,ACTIVITY,NOTIFS,FOODS,PACKS,MSGTPL,EXVID,COACH_PIC,ONBOARD,CEXS,FORMS,CHALLENGES,NLOGS,NCHAT,NINS,NRULES,DB:packDB(),DEAD,UI:{tpl:PREFS.uiTpl||'default'}});
    localStorage.setItem(STORE_KEY,payload);
  }catch(e){}
  // render() runs on EVERY interaction, so without this comparison even a pure
  // view switch marked the workspace dirty and scheduled a full-payload PUT.
  // Only actual data changes should reach the network.
  if(payload&&payload!==__lastPack){
    __lastPack=payload;
    if(CLOUD.on)cloudSchedule();
  }
}
function loadData(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw)return false;
    const d=JSON.parse(raw);
    if(!d||d.v!==13){
      // Don't silently throw away a payload we can't read. Park it under a
      // backup key so it can be recovered/migrated instead of vanishing.
      try{if(!localStorage.getItem(STORE_KEY+'-backup'))localStorage.setItem(STORE_KEY+'-backup',raw)}catch(e){}
      return false;
    }
    DATA_OWNER=d.owner||null; // whose tenant these local bytes belong to
    WS_OWNER=d.ownerName||''; // coach display name (shown on client devices)
    const repl=(arr,val)=>{arr.length=0;(val||[]).forEach(x=>arr.push(x))};
    repl(CLIENTS,d.CLIENTS);repl(EVENTS,d.EVENTS);repl(NOTES,d.NOTES);repl(MSGS,d.MSGS);
    repl(TEMPLATES,d.TEMPLATES);repl(FILES,d.FILES);repl(BUILDER,d.BUILDER);
    repl(NPLANS,d.NPLANS);repl(MTPL,d.MTPL);repl(PTPL,d.PTPL);repl(NHIST,d.NHIST);
    repl(NLOGS,d.NLOGS);repl(NCHAT,d.NCHAT);repl(NINS,d.NINS);
    if(Array.isArray(d.NRULES)&&d.NRULES.length){NRULES.length=0;d.NRULES.forEach(r=>NRULES.push(r))}
    repl(ACTIVITY,d.ACTIVITY);repl(NOTIFS,d.NOTIFS);repl(FOODS,d.FOODS);
    repl(PACKS,d.PACKS);repl(MSGTPL,d.MSGTPL);repl(CEXS,d.CEXS);repl(FORMS,d.FORMS);repl(CHALLENGES,d.CHALLENGES);syncCustomEx();
    // v18.9.1 — workspaces saved before the food seed existed carry FOODS:[]
    // (freshWorkspace used to leave it empty). There is no food-delete UI, so
    // an empty library is always a broken state, never intentional: backfill.
    if(!FOODS.length)defaultFoods().forEach(f=>FOODS.push(f));
    if(d.EXVID&&typeof d.EXVID==='object')EXVID=d.EXVID;
    if(typeof d.COACH_PIC==='string')COACH_PIC=d.COACH_PIC;
    if(d.ONBOARD&&typeof d.ONBOARD==='object')ONBOARD=d.ONBOARD;
    /* v18.35 — design template rides the workspace payload: switching it on any
       device applies it everywhere after the next sync. */
    if(d.UI&&typeof d.UI==='object'&&typeof d.UI.tpl==='string')PREFS.uiTpl=d.UI.tpl==='coachmint'?'coachmint':'default';
    Object.keys(d.DB||{}).forEach(k=>{DB[k]=d.DB[k]});
    Object.keys(DEAD).forEach(k=>{DEAD[k].length=0;((d.DEAD||{})[k]||[]).forEach(x=>DEAD[k].push(String(x)))});
    /* NOTE: this used to run `if(!EVENTS.some(e=>e.att)) EVENTS.forEach(e=>e.day<TODAY&&(e.att='done'))`
       — i.e. EVERY past session was silently marked "Attended" the first time a
       workspace had no recorded attendance. That fabricated history fed the
       attendance-rate KPI, the "Missed session" list and what clients see, and
       was unrecoverable once pushed. Attendance must only be set explicitly. */
    if(TEMPLATES.some(tp=>!tp.exs&&!tp.parts)){
      const seeds=defaultTemplates();
      TEMPLATES.forEach((tp,i)=>{if(!tp.exs&&!tp.parts){const sd=seeds.find(s=>s.n===tp.n);if(sd)TEMPLATES[i]=JSON.parse(JSON.stringify(sd))}});
    }
    CLIENTS.forEach(c=>{if(!DB[c.id])DB[c.id]={workouts:[],sessions:[],stats:{done:c.done||0,missed:c.missed||0},nutrition:null,measures:mseeds(c.id)}});
    Object.keys(DB).forEach(k=>{if(!DB[k].measures){DB[k].measures=mseeds(k)}});
    scrubNames(); // stored payload may predate the escaping fix — strip markup from names
    return true;
  }catch(e){return false}
}

/* ============ PHASE-1 AUTH (coach accounts + tenant sessions) ============ */
/* Session token in localStorage; every sync request carries it as a Bearer
   header when present. Students keep syncing by code alone (no login). */
const AUTH={token:'',coach:null,ws:null,access:null};
try{AUTH.token=localStorage.getItem('co-auth')||''}catch(e){}
const authHeaders=()=>AUTH.token?{'authorization':'Bearer '+AUTH.token}:{};
const authSet=t=>{AUTH.token=t||'';try{t?localStorage.setItem('co-auth',t):localStorage.removeItem('co-auth')}catch(e){}};
/* v16.5 — the signed-in coach's REAL identity. The UI used to hardcode the
   demo persona "Soroush Karimi / soroush@coachos.app" in the sidebar, topbar
   and profile, so the name chosen at signup never appeared anywhere (it WAS
   saved server-side — only the display was wrong). Falls back to the persona
   in demo mode. */
const coachName=()=>(AUTH.coach&&AUTH.coach.name)||'Coach Soroush';
const coachFirst=()=>coachName().trim().split(/\s+/)[0]||'Coach';
const coachEmail=()=>(AUTH.coach&&AUTH.coach.email)||'soroush@coachos.app';
let WS_OWNER=''; // coach display name carried inside the workspace payload
const wsOwnerName=()=>WS_OWNER||coachName();
/* Full cloud-state reset — MUST run whenever the active account changes,
   otherwise the next coach's sync keeps targeting the previous coach's
   workspace (403 foreign) and pulls foreign data over local rows. */
function cloudReset(){
  CLOUD.on=false;CLOUD.code='';CLOUD.rev=0;CLOUD.dirty=false;CLOUD.started=false;
  clearTimeout(CLOUD.pushT);
  // The 7s poll used to be started with a bare setInterval() and never cleared,
  // so every sign-out/sign-in left another live interval behind — N accounts
  // meant N × /api/data GETs every 7 seconds, forever, in a long-lived PWA.
  clearInterval(CLOUD.pollT);CLOUD.pollT=null;
  clearInterval(CLOUD.remT);CLOUD.remT=null;
  // Preserve the pre-account workspace code before dropping it: the one-time
  // /api/auth/claim import in the bootstrap reads it, and this reset used to
  // delete it, making that import permanently unreachable.
  try{
    const legacy=localStorage.getItem('co-ws');
    if(legacy&&!localStorage.getItem('co-legacy-ws'))localStorage.setItem('co-legacy-ws',legacy);
    localStorage.removeItem('co-ws');
  }catch(e){}
}
/* Empty in-memory workspace — used when a NEW account is created so coaches
   start clean instead of inheriting the demo seed (which also instantly
   exceeds the trial quota and silently blocks adding clients). */
function freshWorkspace(){
  CLIENTS.length=0;EVENTS.length=0;NOTES.length=0;MSGS.length=0;TEMPLATES.length=0;
  FILES.length=0;BUILDER.length=0;NPLANS.length=0;MTPL.length=0;PTPL.length=0;
  NHIST.length=0;ACTIVITY.length=0;NOTIFS.length=0;PACKS.length=0;MSGTPL.length=0;
  NLOGS.length=0;NCHAT.length=0;NINS.length=0;NRULES.length=0;
  defaultNrules().forEach(r=>NRULES.push(r));
  FORMS.length=0;CHALLENGES.length=0;
  CEXS.length=0;syncCustomEx();
  // v18.9.1 — a new coach still needs a usable nutrition library: the 20
  // starter foods + meal/plan templates. FOODS used to stay EMPTY here, so
  // "Create Nutrition Plan" seeded meals referencing FOODS[fi] entries that
  // did not exist — the planner crashed and the food picker was blank.
  FOODS.length=0;
  defaultFoods().forEach(f=>FOODS.push(f));
  defaultMtpl().forEach(x=>MTPL.push(x));
  defaultPtpl().forEach(x=>PTPL.push(x));
  ONBOARD={done:false};
  Object.keys(DB).forEach(k=>delete DB[k]);
  Object.keys(DEAD).forEach(k=>DEAD[k].length=0);
  S.cid=1;S.pickCid=1;S.msgThread=null;S.nplan=0;
}
async function authApi(path,opts){
  const o=opts||{};
  o.headers=Object.assign({'content-type':'application/json'},authHeaders(),o.headers||{});
  const r=await fetch(path,o);
  let d=null;try{d=await r.json()}catch(e){}
  return {status:r.status,ok:r.ok,d};
}
async function authSignup(){
  const name=($('su-name')?.value||'').trim();
  const email=($('su-email')?.value||'').trim();
  const pw=$('su-pass')?.value||'';
  const coupon=($('su-coupon')?.value||'').trim();
  if(!name||!email||pw.length<8){toast(t('Enter name, valid email, password 8+ chars'));return}
  toast(t('Creating your account…'));
  try{
    const {status,ok,d}=await authApi('/api/auth/signup',{method:'POST',body:JSON.stringify({name,email,password:pw,coupon:coupon||undefined})});
    if(!ok){toast(t(authErrMsg(d,status)));return}
    authSet(d.token);AUTH.coach=d.coach;AUTH.ws=d.workspace;
    // The optional activation code (prefilled from the shop) is redeemed
    // server-side in the SAME call — the plan is active on first landing.
    if(d.redeemed&&d.access){
      AUTH.access=d.access;BILL.info=d.billing||BILL.info;
      try{localStorage.removeItem('coach-os-coupon')}catch(e){}
    } else AUTH.access=d.access;
    // New account: drop the local demo seed and any previous tenant's cloud
    // state, so the coach starts with an empty, correctly-owned workspace.
    cloudReset();adoptAccount(d.coach);
    S.role='coach';S.view=ONBOARD.done?landingView():'dash';render();
    toast(d.redeemed?t('Plan activated ✓ — welcome to ')+planLbl(d.billing.plan)
      :d.redeemError?t(billErr({error:d.redeemError}))
      :t('Welcome')+', '+d.coach.name.split(' ')[0]+' ✓');
    cloudEnsure();maybeOnboard();
  }catch(e){toast(t('Could not reach server'))}
}
async function authLogin(){
  const email=($('li-email')?.value||'').trim();
  const pw=$('li-pass')?.value||'';
  if(!email||!pw){toast(t('Enter email and password'));return}
  toast(t('Signing in…'));
  try{
    // Login is email + password ONLY — activation codes are redeemed at
    // signup (post-purchase) or manually in Settings → Account, never here.
    const {status,ok,d}=await authApi('/api/auth/login',{method:'POST',body:JSON.stringify({email,password:pw})});
    if(!ok){toast(t(authErrMsg(d,status)));return}
    authSet(d.token);AUTH.coach=d.coach;AUTH.ws=d.workspace;
    AUTH.access=d.access;
    // Account switched in this tab: reset the sync target AND wipe local data
    // that belongs to the previous coach — otherwise the first sync pushes the
    // previous coach's clients into this coach's (empty) workspace.
    cloudReset();adoptAccount(d.coach);
    S.role='coach';S.view=ONBOARD.done?landingView():'dash';render();
    toast(t('Welcome back')+', '+d.coach.name.split(' ')[0]+' ✓');
    cloudEnsure();maybeOnboard();
  }catch(e){toast(t('Could not reach server'))}
}
async function authLogout(){
  // Flush pending local edits BEFORE tearing down the sync target — a quick
  // add-client → sign-out otherwise loses them (cloudReset drops the dirty
  // flag and the next account's adoptAccount wipes the local bytes).
  if(CLOUD.on&&CLOUD.dirty){try{await cloudPush()}catch(e){}}
  try{if(AUTH.token)await authApi('/api/auth/logout',{method:'POST'})}catch(e){}
  authSet('');AUTH.coach=null;AUTH.ws=null;AUTH.access=null;
  cloudReset(); // never let the next session reuse this tenant's sync target
  // Admin/billing state belongs to the signed-out account — clear it so a
  // different account on this device never sees stale rows.
  BILL.info=null;BILL.quota=null;BILL.adminCoaches=null;BILL.adminLoaded=false;BILL.adminError=null;BILL.redeemCode='';
}

async function billRefresh(){

  try{
    const {ok,d}=await authApi('/api/billing/me');
    if(ok&&d&&d.ok){

      // for the very first render before /api/billing/me has answered.
      BILL.quota=d.quota||{used:billSeats(),max:planMaxClients()};
      AUTH.access=Object.assign({},AUTH.access,{status:d.billing.status,plan:d.billing.plan});
    }
  }catch(e){}
}

const billErr=d=>{
  const e=d&&d.error;
  if(e==='unknown-code')return 'Code not found — check and retry';
  if(e==='code-used-up')return 'This code was already used';
  if(e==='code-expired')return 'This code has expired';
  if(e==='bad-code')return 'Enter a coupon or payment code';
  if(e==='bad-plan')return 'That plan is not available — pick a plan and retry';
  if(e==='forbidden')return 'Your account is not allowed to do that';
  if(e==='code-exists'||e==='duplicate-code')return 'That code already exists — choose another';
  if(e==='coach-not-found')return 'No coach found with that email or ID';
  if(e==='cannot-suspend-admin')return 'Admin accounts cannot be suspended';
  if(e==='rate-limited')return 'Too many attempts — wait a minute and retry';
  if(e==='sub-suspended')return 'Access suspended — contact support';
  if(e==='sub-expired')return 'Subscription expired — renew to keep editing';
  if(e==='quota-exceeded')return 'Client limit reached — upgrade your plan or archive a client';
  // Fall back to the raw server code instead of a generic network message,
  // which used to be shown for every unmapped error (including 429s).
  return e||'Could not reach server';
};

const cloudFetch=async (code,rev)=>{

    const r=await fetch('/api/data?code='+encodeURIComponent(code)+(rev?'&rev='+encodeURIComponent(rev):''),{headers:authHeaders()});
    if(!r.ok)return null;return await r.json()

const cloudPut=async data=>{

    if(r.ok&&o.ok){CLOUD.rev=o.rev;return true}
    if(r.status===409){CLOUD.rev=o.rev||0;CLOUD.dirty=true}

    if(r.status===402){

        // both fell into the quota message before, telling a suspended coach to
        // "upgrade your plan or archive a client".

            :'Client limit reached — upgrade your plan or archive a client'));
      }

    }

    if(cur&&cur.ok){CLOUD.rev=cur.rev||0;cloudMerge(cur.data,false)}

    if(AUTH.token&&!AUTH.coach){await authMe()}

      CLOUD.code=AUTH.ws.code;
      const out=await cloudFetch(CLOUD.code);
      if(out&&out.ok){
        CLOUD.rev=out.rev||0;
        if(out.data&&cloudMerge(out.data,true)){cloudResync();render()}
        // Server holds no bytes yet (fresh account): push local demo/state up
        // so this device is the seed. Authenticated PUT binds tenant ownership.
        if(!out.data){CLOUD.dirty=true;await cloudPush()}
        try{localStorage.setItem('co-ws',CLOUD.code)}catch(e){}
        CLOUD.on=true;cloudStart();

    let code='';try{code=(localStorage.getItem('co-ws')||'').toUpperCase().trim()}catch(e){}

    if(out.data){CLOUD.rev=out.rev||0;if(cloudMerge(out.data,true)){cloudResync();render()}}

/* Fetch + merge a PERSONAL join code ("<workspace>-<client>") WITHOUT entering

   screen (bind on unlock). Returns the matched client or null. */
async function joinPersonal(v){
  const parts=parseJoinCode(v);if(!parts)return null;
  const out=await cloudFetch(parts.ws);
  /* v18.53 — distinguish "server unreachable" from "code not found": a dead
     server (or offline phone) must NOT show the misleading "Code not found" —
     the code may be perfectly valid. Returns 'offline' so the unlock screen
     shows a retry-with-connection message instead. */
  if(!out){S.unOffline=true;return null}
  if(!out.ok||out.exists===false)return null;
  S.unOffline=false;

  cloudReset();

  CLOUD.code=parts.ws;
  CLOUD.rev=out.rev||0;
  if(out.data)cloudMerge(out.data,true);

  try{localStorage.setItem('co-join',JSON.stringify({code:CLOUD.code,cid:me.id,pcode:v}))}catch(e){}

async function cloudJoinCode(forced){ // client: connect with a connection code
  /* v18.50 — a NEW attempt restarts the invalid/timeout state. */
  S.unInvalid=false;S.unT0=0;
  const v=(forced||($('join-code')?.value||'')).toUpperCase().trim();
  if(!v){toast('Invalid code');return}
  /* v16.3 — personal code "<workspace>-<client>": resolves the tenant AND the
     exact profile, then binds this device straight to it. A bare 6-char code
     keeps the legacy workspace-wide behaviour for old invites. */
  const parts=parseJoinCode(v);
  if(parts){
    const me=await joinPersonal(v);
    if(!me){toast(t('Invalid code'));return}
    S.pickCid=me.id;S.joinCid=me.id;S.joinCode=v;
    /* On the unlock stage the slider completes the entry (the whole point of
       the welcome lock); from the legacy demo picker we enter directly. */
    if(S.role==='client'){S.cid=me.id;S.ptab='today';S.player=null;render();toast(t('Connected as')+' '+t(me.name)+' ✓')}
    else render();

  if(CLOUD.on&&CLOUD.code===v){
    S.role='client';S.cid=S.pickCid||(CLIENTS[0]&&CLIENTS[0].id)||1;S.ptab='today';S.player=null;S.joinCode=null;
    render();toast('Connected to your coach ✓');return;
  }
  const out=await cloudFetch(v);
  if(!out||!out.ok){toast('Invalid code');return}
  if(out.exists===false){toast(t('Invalid code'));return}
  /* Joining a workspace must start from a CLEAN slate. Previously the local
     arrays were kept, so a device already synced to coach A that entered coach
     B's code merged A's clients/notes/messages into B's workspace and then
     pushed the union — the unauthenticated "student device" PUT path happily
     accepts it. Wiping first is what cloudReset()'s own contract requires. */
  cloudReset();
  freshWorkspace();
  CLOUD.code=v;
  CLOUD.rev=out.rev||0;
  if(out.data)cloudMerge(out.data,true);
  /* If the workspace exists but holds no bytes yet, do NOT push this device's
     local/demo data into someone else's workspace — just wait for the coach's
     first push (cloudPull picks it up). */
  CLOUD.on=true;cloudStart();
  S.wsConnected=true;
  try{localStorage.setItem('co-ws',v)}catch(e){}
  cloudResync();render();
  toast('Workspace connected ✓ — pick your profile below');
}

/* Session packs: attending a session consumes one from the client's oldest
   pack with remaining sessions; un-marking refunds it (tracked via ev.packId
   so a re-mark never double-charges). */
function packCharge(ev,was){
  if(ev.type!=='session')return;
  if(ev.att==='done'&&!ev.packId){
    const p=PACKS.filter(x=>x.client===ev.client&&x.total-x.used>0).sort((a,b)=>a.createdAt-b.createdAt)[0];
    if(p){p.used++;ev.packId=p.id}
  }else if(was==='done'&&ev.att!=='done'&&ev.packId){
    const p=PACKS.find(x=>x.id===ev.packId);
    if(p&&p.used>0)p.used--;
    ev.packId=undefined;
  }
}

  parseText(txt){

  },
  /* "What should I eat now?" — deterministic, contextual. Buckets map to the
     product spec: quick / high-protein / budget / light / no-cook. Each option

  suggestNow(c,iso){
    const rem=this.remaining(c,iso)||{kcal:600,p:40,c:60,f:20};
    const hour=TDATE.getHours();
    const meal=hour<11?'Breakfast':hour<15?'Lunch':hour<18?'Snack':hour<22?'Dinner':'Before Bed';
    const pool=FOODS.filter(f=>f.kcal>0);
    const dislikes=String((c.nprof||{}).dislikes||'').toLowerCase().split(/[,،]/).map(x=>x.trim()).filter(Boolean);
    const allergies=String((c.nprof||{}).allergies||'').toLowerCase().split(/[,،]/).map(x=>x.trim()).filter(Boolean);
    const okF=f=>!allergies.some(a=>a&&(f.n.toLowerCase().includes(a)||foodName(f.n).toLowerCase().includes(a)))&&!dislikes.some(a=>a&&(f.n.toLowerCase().includes(a)||foodName(f.n).toLowerCase().includes(a)));

        sum=picks.reduce((a,x)=>({kcal:a.kcal+x.kcal,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f}),{kcal:0,p:0,c:0,f:0});

      mk('protein',t('High-protein'),f=>f.p/f.kcal>0.15,byScore),

/* ================= v18.41 — CINEMATIC 3D WELCOME / UNLOCK =================
   After scanning the connection QR or opening an invite link, the student
   lands on a full-screen 3D stage: a glowing padlock inside orbiting rings,
   drifting particles and a perspective grid. The portal opens by DRAGGING
   THE HANDLE TO THE RIGHT — the drag physically opens the shackle, spins the
   rings, intensifies the glow and tilts the scene; past the threshold the
   lock bursts open (shockwave + zoom) and the device binds to the profile. */
function unlockStage(){
  const parts=S.joinCode?parseJoinCode(S.joinCode):null;
  if(parts){ // PERSONAL code: only the bound profile counts — never the demo seed
    const me=CLIENTS.find(c=>String(c.code||'').toUpperCase()===parts.pc);
    if(me)return 'ready';
    /* v18.50 — NO infinite "Checking code…": once the workspace payload has
       arrived (S.wsConnected), the fetch failed on its own (S.unInvalid) or
       the 8s timeout passed, the code simply is not valid — show an explicit
       error with a retry instead of loading forever. */
    if(S.unInvalid||S.unOffline||(S.wsConnected&&CLOUD.code===parts.ws)||(S.unT0&&Date.now()-S.unT0>8200))return 'invalid';
    /* Start the clock ONCE per attempt + schedule the re-render that flips
       the state when the timeout fires (nothing else renders the login view
       while the code is being checked). */
    if(!S.unT0){S.unT0=Date.now();setTimeout(()=>{const s=unlockStage();if(S.view==='login'&&(s==='loading'||s==='invalid'))render()},8400)}
    return 'loading';
  }
  /* Bare/legacy code: v18.51 — the profile PICKER IS GONE. A student must
     always land on THEIR OWN name (the one the coach registered). A bare
     workspace code can only auto-bind when exactly ONE active student exists;
     with several, the student is sent to their PERSONAL invite code instead
     of ever choosing an identity. */
  if(!S.joinCode||!S.wsConnected)return 'code';
  const act=CLIENTS.filter(c=>c.status!=='Archived');
  /* v18.52 — a device previously bound to a profile (co-join cid, saved by
     older flows WITHOUT the personal pcode) re-binds SILENTLY: the student
     always lands on THEIR OWN name — never the picker, never a dead end. */
  if(S.joinCid&&act.some(c=>c.id===S.joinCid))return 'ready1';
  return act.length===1?'ready1':'multi';
}

/* Pointer wiring for the unlock stage — v18.44 HOLD-TO-LIFT: press and HOLD
   the dumbbell (isometric hold, like a plank). The hold fills the progress
   ring, lifts the bar and accelerates the rings/particles; at 100% it bursts
   into the portal. Release early → spring back. Pointer tilt adds a subtle
   3D parallax on hover/move. */
function unlockWire(){
  const sc=$('un-scene'),lk=$('un-hold'),prog=$('un-prog');
  if(!sc||!lk)return;
  /* v18.54 — the personal-code fetch runs on EVERY unlock render until it
     binds (or fails definitively): the old one-shot `wired` guard let a SINGLE
     transient failure (Render cold-start, a 429, a flaky signal) stick for the
     whole session as "Code not found". */
  const jp=S.joinCode?parseJoinCode(S.joinCode):null;
  const jpBound=jp&&CLIENTS.some(c=>String(c.code||'').toUpperCase()===jp.pc);
  if(jp&&!jpBound&&!S.unFetching&&!S.unInvalid&&!S.unOffline){
    S.unFetching=true;
    const jc=S.joinCode; // a result from an abandoned/replaced code must not poison the new state
    joinPersonal(jc).then(me=>{S.unFetching=false;
      if(S.joinCode!==jc)return; // stale attempt (user changed the code meanwhile)
      if(me){S.wsConnected=true;S.pickCid=me.id}else{S.unInvalid=true}
      render();
    }).catch(()=>{S.unFetching=false});
  }
  if(lk.dataset.wired)return;
  lk.dataset.wired='1';
  S.unlock={ux:0,hold:false,fetching:false,raf:0,t0:0};
  const CIRC=295.3;
  const armed=()=>lk.dataset.armed==='1';
  const set=v=>{S.unlock.ux=v;sc.style.setProperty('--ux',v.toFixed(3));
    if(prog)prog.setAttribute('stroke-dashoffset',(CIRC*(1-v)).toFixed(1));
    sc.classList.toggle('holding',v>0.02&&S.unlock.hold)};
  const tick=()=>{
    if(!S.unlock.hold)return;
    const v=Math.min(1,(performance.now()-S.unlock.t0)/1100);
    set(v);
    if(v>=1){S.unlock.hold=false;sc.classList.remove('holding');complete();return}
    S.unlock.raf=requestAnimationFrame(tick);
  };
  const start=e=>{if(!armed()||S.unlock.hold)return;S.unlock.hold=true;S.unlock.t0=performance.now();
    try{lk.setPointerCapture(e.pointerId)}catch(err){}e.preventDefault();S.unlock.raf=requestAnimationFrame(tick)};
  const cancel=()=>{
    if(!S.unlock.hold)return;S.unlock.hold=false;cancelAnimationFrame(S.unlock.raf);sc.classList.remove('holding');
    const from=S.unlock.ux,t0=performance.now();
    const back=()=>{if(S.unlock.hold)return;const k=Math.min(1,(performance.now()-t0)/240);set(from*(1-k)*(1-k));if(k<1)requestAnimationFrame(back)};
    requestAnimationFrame(back);
  };
  lk.addEventListener('pointerdown',start);
  lk.addEventListener('pointerup',cancel);
  lk.addEventListener('pointercancel',cancel);
  lk.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!S.unlock.hold){start(e)}});
  lk.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')cancel()});
  sc.addEventListener('pointermove',e=>{if(S.unlock.hold)return;const r=sc.getBoundingClientRect();
    sc.style.setProperty('--py',(((e.clientX-r.left)/r.width-.5)*8).toFixed(2)+'deg');
    sc.style.setProperty('--rx',((-.5+(e.clientY-r.top)/r.height)*6).toFixed(2)+'deg')});
  const reset=()=>{sc.classList.remove('unlocked');set(0);const st=$('un-status');if(st)st.textContent=t('Keep holding until it lifts')};
  const complete=async()=>{
    sc.classList.add('unlocked'); // plates slam + rings burst + shockwave + zoom
    const st=unlockStage();
    const parts=S.joinCode?parseJoinCode(S.joinCode):null;
    let known=parts?CLIENTS.find(c=>String(c.code||'').toUpperCase()===parts.pc):null;
    /* v18.50 — archived profiles never auto-bind (ready1 = exactly one ACTIVE).
       v18.52 — a persisted profile bind (joinCid) wins over "first active". */
    if(!known&&st==='ready1')known=(S.joinCid&&CLIENTS.find(c=>c.id===S.joinCid&&c.status!=='Archived'))||CLIENTS.find(c=>c.status!=='Archived');
    const stat=$('un-status');if(stat)stat.textContent=t('Unlocking…');
    await new Promise(r=>setTimeout(r,820)); // let the burst play
    if(known){ // data already on this device (returning student / bare code)
      S.role='client';S.cid=known.id;S.pickCid=known.id;S.joinCid=known.id;S.ptab='today';S.player=null;S.joinCode=null;
      render();toast(t('Welcome')+', '+t(known.name).split(' ')[0]+' 🔓');return;
    }
    if(parts){const me=await joinPersonal(S.joinCode);
      if(me){S.role='client';S.cid=me.id;S.pickCid=me.id;S.ptab='today';S.player=null;render();toast(t('Connected as')+' '+t(me.name)+' 🔓');return}}
    reset();toast(t('Invalid code'));
  };
}

function vCAttend(){
  const c=client(S.cid);
  const list=[...EVENTS.filter(e=>e.client===c.name)].sort((a,b)=>a.day-b.day||a.start-b.start);
  const done=list.filter(e=>e.att==='done').length;

  const pend=list.length-done-miss;

  const kpi=(k,v,cl)=>`<div class="card stat" style="padding:14px 16px"><span class="k">${t(k)}</span><div class="v" style="font-size:22px;color:${cl||'var(--ink)'}">${v}</div></div>`;

/* The workout builder is ALWAYS scoped to the selected client: switching
   clients loads THAT client's current program (or an empty builder), so one
   client's program can never leak into another's. */
function loadClientProgram(cid){
  const c=CLIENTS.find(x=>x.id===cid);if(!c)return;
  const ws=(DB[cid]&&DB[cid].workouts)||[];
  const cur=ws[0]; // newest first (b-save unshifts)
  if(cur&&cur.exercises&&cur.exercises.length){
    BUILDER.length=0;cur.exercises.forEach(x=>BUILDER.push({...x}));
    S.wname=cur.name+' — '+c.name;
    S.wday=cur.day||'Monday';S.wdur=cur.dur||'60 min';S.wnote=cur.note||'';
  }else{
    BUILDER.length=0;
    S.wname='New Workout — '+c.name;
    S.wday='Monday';S.wdur='60 min';S.wnote='';
  }
}

function icsExport(){
  const pad=n=>String(n).padStart(2,'0');
  const dstr=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  // Minutes were clamped to 45 and snapped to 15-minute steps, so a 09:50 or
  // 09:05 session exported as 09:45. Keep the hour and round the real minutes.
  const tstr=t2=>{const h=Math.min(23,Math.floor(t2)),m=(t2-h)*60;return `${pad(h)}${pad(Math.min(59,Math.round(m)))}00`};
  let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CoachMint//Calendar//EN','CALSCALE:GREGORIAN'];
  EVENTS.forEach(ev=>{
    const d=dayDate(ev.day,0);
    const endH=Math.min(23.98,ev.start+ev.dur);
    out.push('BEGIN:VEVENT',`UID:co-os-${ev.id}@coachos`,
      `DTSTART:${dstr(d)}T${tstr(ev.start)}`,
      `DTEND:${dstr(d)}T${tstr(endH)}`,
      `SUMMARY:${ev.label} — ${ev.client}`,'END:VEVENT');
  });
  out.push('END:VCALENDAR');
  const blob=new Blob([out.join('\r\n')],{type:'text/calendar'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='coachmint-calendar.ics';a.click();
  toast('Calendar exported (.ics)');
}

function vProgressCm(){
  const c=client(S.cid);
  const ws=DB[c.id]||{};
  const done=ws.stats?.done||0,miss=ws.stats?.missed||0;
  const adh=Math.round(done/((done+miss)||1)*100);
  const kpi=(k,v,s)=>`<div class="cm-kpi"><span class="k">${t(k)}</span><b>${v}</b><span class="s">${s}</span></div>`;
  return `
  <div class="page-h"><div>
    <div class="eyebrow">${t('Performance Analytics')} // ${esc(t(c.name))}</div>
    <h1>${t('Progress')}</h1><div class="sub">${t('Data across your clients')}</div></div>

  <div class="cm-kpis" style="margin-bottom:14px">
    ${kpi('Workouts Done',nf(done),`${t('Missed')}: ${nf(miss)}`)}
    ${kpi('Adherence',adh+'%',adh>=75?t('Optimal'):t('Attention'))}
    ${kpi('Streak',`${nf(c.streak||0)} ${t('wk')}`,t(c.goal))}
    ${kpi('Weight',uwS(c.weight||null),t(c.prog))}
  </div>
  ${vCProgress()}`;
}

function nRuleHit(c,r){
  const days=r.days||3;
  if(r.metric==='logging'){const ad=NEng.adherence(c,days);return ad.withTg>0&&ad.logged===0?`${nf(days)} ${t('days without logs')}`:null}
  if(r.metric==='weight'){
    const tr=RPT.trend(c);if(!tr||tr.dir==='flat'||!tr.delta)return null;
    const bad=(/fat loss/i.test(c.goal||'')&&tr.dir==='up')||(/muscle gain/i.test(c.goal||'')&&tr.dir==='down');
    return bad?`${tr.dir==='up'?'+':''}${tr.delta}kg ${t('vs goal')} ${c.goal||''}`:null;
  }
  let sum=0,logged=0;
  for(let i=0;i<days;i++){
    const iso=__iso(-i);const tg=NEng.targets(c,iso);if(!tg||!tg.kcal)continue;
    const co=NEng.consumed(c,iso);
    if(co.kcal<=0)continue;logged++;
    if(r.metric==='protein')sum+=tg.p?co.p/tg.p*100:100;
    else if(r.metric==='kcal')sum+=co.kcal/tg.kcal*100;
    else if(r.metric==='water')sum+=NEng.waterT(c)>0?(NEng.waterOf(c,iso)/NEng.waterT(c))*100:100;
  }
  if(!logged||r.op!=='below')return null;
  const avg=sum/logged;
  return avg<r.thr?`${t('avg')} ${nf(Math.round(avg))}% · ${nf(logged)}/${nf(days)} ${t('days')}`:null;
}
const N_RULE_TITLE={protein:'Protein below target',kcal:'Calories off target',logging:'Not logging food',water:'Hydration low',weight:'Weight trend off goal'};
/* Daily sweep: rules → insights (NINS) + alerts (NOTIFS). Coach devices only;
   deduped per client+metric+day so nobody gets spammed. */
function nSweepAuto(){
  if(S.role==='client'||!CLIENTS.length)return;
  try{
    const key='co-nsweep-day';
    if(localStorage.getItem(key)===rptDailyKey())return;
    localStorage.setItem(key,rptDailyKey());
    let fired=0;
    CLIENTS.filter(c=>c.status!=='Archived').forEach(c=>{
      NRULES.filter(r=>r.on).forEach(r=>{
        const hit=nRuleHit(c,r);if(!hit)return;
        if(NINS.some(x=>x.client===c.name&&x.metric===r.metric&&x.d===isoToday()))return;
        const title=t(N_RULE_TITLE[r.metric]||r.metric);
        NINS.unshift({id:uid(),client:c.name,metric:r.metric,kind:r.sev==='alert'?'concern':r.sev==='warn'?'pattern':'observation',title,detail:hit,sev:r.sev,d:isoToday(),at:Date.now()});
        if(r.sev!=='info'){NOTIFS.unshift({t:`⚠️ ${t(c.name)} — ${title}`,d:'Just now',un:true});fired++}
      });
    });
    if(NINS.length>80)NINS.length=80;
    if(fired){
      ACTIVITY.unshift({w:'Just now',i:'zap',h:lang==='fa'?`<b>دستیار تغذیه</b> ${nf(fired)} هشدار صادر کرد`:`<b>Nutrition assistant</b> raised ${nf(fired)} alert${fired>1?'s':''}`});
      saveData();
    }
  }catch(e){}
}

window.npMacro=()=>{
  const k=+$('np-kcal')?.value||1,p=+$('np-p')?.value||0,c=+$('np-c')?.value||0,f=+$('np-f')?.value||0;
  const pk=Math.min(100,Math.round(p*4/k*100)),ck=Math.min(100-pk,Math.round(c*4/k*100)),fk=Math.max(0,100-pk-ck);
  const el=$('np-dist');if(el)el.innerHTML=distBar(pk,ck,fk);
};
