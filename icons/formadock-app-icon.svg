<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- App Icon Rounded Corner Mask -->
    <clipPath id="squircle">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>

    <!-- Deep Metallic Canvas Gradient -->
    <radialGradient id="iconBg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#18202F"/>
      <stop offset="50%" stop-color="#0E131C"/>
      <stop offset="100%" stop-color="#07090D"/>
    </radialGradient>

    <!-- Intense Lime Gradient -->
    <linearGradient id="limeWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2FF9E"/>
      <stop offset="45%" stop-color="#C8F04B"/>
      <stop offset="100%" stop-color="#88B810"/>
    </linearGradient>

    <!-- Premium Silver Titanium -->
    <linearGradient id="silverSpine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="neonAura" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Clip -->
  <g clip-path="url(#squircle)">
    <!-- Base Background -->
    <rect width="512" height="512" fill="url(#iconBg)"/>

    <!-- Subtle Technical Background Grid Lines -->
    <line x1="0" y1="128" x2="512" y2="128" stroke="#1E293B" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#1E293B" stroke-opacity="0.35" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#1E293B" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke="#1E293B" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="#1E293B" stroke-opacity="0.35" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="#1E293B" stroke-opacity="0.25" stroke-width="1"/>

    <!-- Inner Border Highlight -->
    <rect x="2" y="2" width="508" height="508" rx="113" ry="113" 
          fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="2"/>

    <!-- ================= PURE KINETIC F MARK (Clean & Razor Sharp) ================= -->
    <g transform="translate(46, 42) scale(3.5)" filter="url(#softShadow)">
      <!-- Vertical Athletic Spine -->
      <rect x="20" y="14" width="18" height="74" rx="4" fill="url(#silverSpine)"/>

      <!-- Top Velocity Wing -->
      <path d="M38 14 L102 14 C104.8 14 106.8 16.8 105.4 19.4 L92.2 43.5 C91.1 45.5 89 46.8 86.6 46.8 L38 46.8 Z" 
            fill="url(#limeWing)" filter="url(#neonAura)"/>

      <!-- Middle Aerodynamic Wing -->
      <path d="M38 53 L82 53 C84.8 53 86.8 55.8 85.4 58.4 L75.2 77.5 C74.1 79.5 72 80.8 69.6 80.8 L38 80.8 Z" 
            fill="url(#limeWing)"/>
    </g>
  </g>
</svg>
