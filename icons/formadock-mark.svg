<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background Glow Gradient -->
    <radialGradient id="markGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C8F04B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C8F04B" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Neon Lime Linear Gradient -->
    <linearGradient id="neonLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF6F"/>
      <stop offset="60%" stop-color="#C8F04B"/>
      <stop offset="100%" stop-color="#9BC81C"/>
    </linearGradient>

    <!-- Titanium Base Gradient -->
    <linearGradient id="titaniumSpine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Deep Metallic Shadow -->
    <linearGradient id="dockCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A3447"/>
      <stop offset="100%" stop-color="#141A24"/>
    </linearGradient>

    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="64" cy="56" r="44" fill="url(#markGlow)"/>

  <!-- Geometric Monogram "F + Docking Hub" -->
  <!-- 1. Primary Kinetic Wing (Top bar of F) -->
  <path d="M42 22 L102 22 C104.5 22 106 24.5 104.5 26.8 L92 46 C90.8 47.8 88.8 49 86.6 49 L42 49 Z" 
        fill="url(#neonLime)" 
        filter="url(#neonBlur)"/>

  <!-- 2. Docking Hub (Middle connector bar of F with docking slot) -->
  <path d="M42 56 L80 56 C82.2 56 84.2 57.2 85.4 59 L91.5 68.5 C92.7 70.3 91.5 72.8 89.3 72.8 L42 72.8 Z" 
        fill="url(#neonLime)"/>

  <!-- Docking Slot Accent (Subtle cut-in indicating connection / data dock) -->
  <circle cx="68" cy="64.4" r="3.2" fill="#0D1117"/>

  <!-- 3. Vertical Base Spine (Foundational pillar of F & Dock) -->
  <path d="M22 24 C22 22.9 22.9 22 24 22 L36 22 C37.1 22 38 22.9 38 24 L38 94 C38 96.2 36.2 98 34 98 L24 98 C22.9 98 22 97.1 22 96 Z" 
        fill="url(#titaniumSpine)"/>

  <!-- 4. Grounded Dock Foot (Stable base anchor) -->
  <path d="M22 84 L54 84 C56.2 84 58 85.8 58 88 L58 94 C58 96.2 56.2 98 54 98 L22 98 Z" 
        fill="url(#dockCore)" 
        stroke="#334155" 
        stroke-width="1.5"/>

  <!-- Kinetic pulse dot in base -->
  <circle cx="48" cy="91" r="2.5" fill="#C8F04B"/>
</svg>