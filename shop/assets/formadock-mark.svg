<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100" fill="none">
  <defs>
    <!-- Neon Lime Linear Gradient -->
    <linearGradient id="neonLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF6F"/>
      <stop offset="50%" stop-color="#C8F04B"/>
      <stop offset="100%" stop-color="#9BC81C"/>
    </linearGradient>

    <!-- Titanium Base Gradient -->
    <linearGradient id="titaniumSpine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ================= PURE KINETIC F (Clean Minimalist Monogram) ================= -->
  <!-- 1. Vertical Athletic Base Spine -->
  <rect x="20" y="14" width="18" height="74" rx="4" fill="url(#titaniumSpine)"/>

  <!-- 2. Primary Kinetic Velocity Wing (Top bar of F) -->
  <path d="M38 14 L102 14 C104.8 14 106.8 16.8 105.4 19.4 L92.2 43.5 C91.1 45.5 89 46.8 86.6 46.8 L38 46.8 Z" 
        fill="url(#neonLime)" 
        filter="url(#neonGlow)"/>

  <!-- 3. Secondary Kinetic Wing (Middle bar of F) -->
  <path d="M38 53 L82 53 C84.8 53 86.8 55.8 85.4 58.4 L75.2 77.5 C74.1 79.5 72 80.8 69.6 80.8 L38 80.8 Z" 
        fill="url(#neonLime)"/>
</svg>
